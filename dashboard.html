                                                                Informar Valor
                                                            </button>
                                                        ) : p.status === 'A pagar' ? (
                                                            <div className="flex items-center gap-1">
                                                                <button onClick={() => handleLaunchPayments([p.id])} className="text-xs font-bold px-3 py-1.5 rounded-lg transition border shadow-sm bg-blue-50 text-blue-600 border-blue-200 hover:bg-blue-600 hover:text-white">
                                                                    Lançar na Carteira
                                                                </button>
                                                                <button onClick={() => { setEditingPayment(p); setNewPaymentValue(p.valor); }} className="text-slate-400 hover:text-blue-600 p-1.5 hover:bg-blue-50 rounded-lg transition" title="Editar Valor">
                                                                    <Icons.Edit />
                                                                </button>
                                                            </div>
                                                        ) : (
                                                            <button className="text-xs font-bold px-3 py-1.5 rounded-lg border shadow-sm bg-slate-50 text-slate-500 border-slate-200 cursor-default">
                                                                {p.status === 'Lançado' ? 'Na Carteira' : 'Pago'}
                                                            </button>
                                                        )}
                                                        <button 
                                                            onClick={() => setDeletingItem(p)}
                                                            className="text-slate-400 hover:text-red-600 p-1.5 hover:bg-red-50 rounded-lg transition"
                                                            title="Remover Lançamento"
                                                        >
                                                            <Icons.Trash />
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                        {totalPages > 1 && (
                            <div className="flex justify-center items-center gap-2 mt-6">
                                <button onClick={() => setCurrentPage(p => p - 1)} disabled={currentPage === 1} className="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed">
                                    Anterior
                                </button>
                                <span className="text-sm text-slate-500 font-medium">
                                    Página {currentPage} de {totalPages}
                                </span>
                                <button onClick={() => setCurrentPage(p => p + 1)} disabled={currentPage === totalPages} className="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed">
                                    Próxima
                                </button>
                            </div>
                        )}
                    </div>
                </div>

                <ConfirmModal 
                    isOpen={!!deletingItem}
                    title="Excluir Lançamento Financeiro"
                    message="Deseja realmente remover este lançamento financeiro? Esta ação não pode ser desfeita."
                    btnConfirm="Sim, Excluir"
                    btnCancel="Cancelar"
                    type="danger"
                    onCancel={() => setDeletingItem(null)}
                    onConfirm={async () => {
                        try {
                            if (!user) return;
                                const docRef = firebaseApi.doc(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments', deletingItem.id);
                                await firebaseApi.deleteDoc(docRef);
                            await logAudit(user, "Exclusão de Lançamento Financeiro", `Captação Cód: ${deletingItem.codigo}, Valor: ${formatMoney(deletingItem.valor)}`);
                            setDeletingItem(null);
                            showToast("Lançamento excluído.", "success");
                        } catch (err) {
                            showToast("Erro ao excluir lançamento.", "error");
                        }
                    }}
                />

                {editingPayment && (
                    <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                        <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 slide-up">
                            <h3 className="text-xl font-bold text-slate-800 mb-2">Informar Valor a Pagar</h3>
                            <p className="text-slate-600 mb-6 leading-relaxed">
                                Defina o valor da comissão para a captação <span className="font-bold">{editingPayment.codigo}</span> do corretor <span className="font-bold">{editingPayment.corretor}</span>.
                            </p>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1">Valor da Comissão (R$)</label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        value={newPaymentValue}
                                        onChange={(e) => setNewPaymentValue(e.target.value)}
                                        placeholder="Ex: 150.00"
                                        className="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 hover:bg-white transition"
                                        autoFocus
                                    />
                                </div>
                                <div className="flex gap-3 pt-2">
                                    <button onClick={() => { setEditingPayment(null); setNewPaymentValue(''); }} className="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl font-semibold hover:bg-slate-200 transition">Cancelar</button>
                                    <button onClick={handleUpdatePaymentValue} className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition shadow-sm">Salvar Valor</button>
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                {isModalOpen && (
                    <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 p-4 overflow-y-auto fade-in">
                        <div className="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 slide-up mx-auto my-8">
                            <h3 className="text-xl font-bold text-slate-800 mb-4 border-b border-slate-100 pb-3 flex items-center gap-2">
                                <Icons.DollarSign /> Novo Lançamento
                            </h3>
                            <form onSubmit={handleAddPayment} className="space-y-4">
                                
                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                    <label className="block text-sm font-semibold text-slate-700 mb-2">1. Buscar e Selecionar Captação</label>
                                    
                                    <div className="flex flex-col sm:flex-row gap-2 mb-3">
                                        <div className="flex-1 flex items-center bg-white border border-slate-300 rounded-lg px-2 focus-within:ring-2 focus-within:ring-blue-500 shadow-sm transition">
                                            <Icons.Calendar />
                                            <span className="text-xs text-slate-500 mx-1">De:</span>
                                            <input 
                                                type="date" 
                                                value={captureSearchStartDate} 
                                                onChange={(e) => setCaptureSearchStartDate(e.target.value)} 
                                                className="w-full py-1.5 outline-none bg-transparent text-sm text-slate-700"
                                            />
                                        </div>
                                        <div className="flex-1 flex items-center bg-white border border-slate-300 rounded-lg px-2 focus-within:ring-2 focus-within:ring-blue-500 shadow-sm transition">
                                            <span className="text-xs text-slate-500 mr-1">Até:</span>
                                            <input 
                                                type="date" 
                                                value={captureSearchEndDate} 
                                                onChange={(e) => setCaptureSearchEndDate(e.target.value)} 
                                                className="w-full py-1.5 outline-none bg-transparent text-sm text-slate-700"
                                            />
                                        </div>
                                    </div>

                                    <div className="flex items-center bg-white border border-slate-300 rounded-lg px-3 focus-within:ring-2 focus-within:ring-blue-500 mb-3 shadow-sm transition">
                                        <Icons.Search />
                                        <input
                                            type="text"
                                            placeholder="Filtrar por código ou corretor..."
                                            value={captureSearchTerm}
                                            onChange={(e) => setCaptureSearchTerm(e.target.value)}
                                            className="w-full px-2 py-2 outline-none bg-transparent text-sm"
                                        />
                                    </div>

                                    <select 
                                        value={selectedCapture}
                                        onChange={(e) => setSelectedCapture(e.target.value)}
                                        className="w-full px-3 py-2.5 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm text-sm"
                                    >
                                        <option value="" disabled>Selecione a captação na lista abaixo...</option>
                                        {filteredCapturesForSelect.map(c => (
                                            <option key={c.id} value={c.id}>
                                                {c.codigo} - {c.corretor} ({formatDateToBR(c.data)})
                                            </option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1">2. Valor a Pagar (R$)</label>
                                    <input 
                                        type="number"
                                        step="0.01"
                                        value={valor}
                                        onChange={(e) => setValor(e.target.value)}
                                        placeholder="Ex: 150.00"
                                        className="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 hover:bg-white transition"
                                    />
                                </div>
                                <div className="flex gap-3 mt-8 pt-4 border-t border-slate-100">
                                    <button type="button" onClick={() => { setIsModalOpen(false); setCaptureSearchTerm(''); setCaptureSearchStartDate(getDefaultStartDate()); setCaptureSearchEndDate(getDefaultEndDate()); }} className="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl font-semibold hover:bg-slate-200 transition">Cancelar</button>
                                    <button type="submit" className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition shadow-sm">Lançar a Pagar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                    )}
                    {isModalOpen && (
                        <ConfirmModal
                            isOpen={showPaymentConfirm}
                            title="Lançamento Realizado!"
                            message="O que você gostaria de fazer agora?"
                            btnConfirm="Lançar Outro Valor"
                            btnCancel="Voltar para Financeiro"
                            onConfirm={handleAddNewPayment}
                            onCancel={handleClosePaymentModal}
                        />
                )}
            </React.Fragment>
        );
        };

        const Carteira = ({ isLoaded, user, brokers, showToast, firebaseApi, logAudit, navigate }) => {
            const [view, setView] = useState('list'); // 'list' or 'details'
            const [selectedBroker, setSelectedBroker] = useState(null);
            const [categoryFilter, setCategoryFilter] = useState('todos');
            const [showOnlyWithValues, setShowOnlyWithValues] = useState(true);
            const [dataInicio, setDataInicio] = useState(getDefaultStartDate());
            const [dataFim, setDataFim] = useState(getDefaultEndDate());
            const [payments, setPayments] = useState([]);
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                if (!user || !isLoaded) {
                    if (isLoaded) setLoading(false);
                    return;
                }
                setLoading(true);
                const { query, collection, onSnapshot, where, and, orderBy } = firebaseApi;
                const paymentsRef = collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments');
                
                const q = query(paymentsRef, 
                    and(
                        where("status", "==", "Lançado"),
                        where("dataLancamento", ">=", dataInicio + "T00:00:00.000Z"),
                        where("dataLancamento", "<=", dataFim + "T23:59:59.999Z")
                    ),
                    orderBy("dataLancamento", "desc")
                );

                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setPayments(data);
                    setLoading(false);
                }, (error) => {
                    console.error("Error fetching wallet payments:", error);
                    showToast("Erro ao carregar a carteira. Verifique o console para criar índices.", "error");
                    setLoading(false);
                });
                return () => unsubscribe();
            }, [user, dataInicio, dataFim, isLoaded, firebaseApi]);

            const brokerWalletStats = useMemo(() => {
                const stats = {};
                const brokerCategoryMap = new Map(brokers.map(b => [b.name, b.category || 'locacao']));

                payments.forEach(p => {
                    if (p.status === 'Lançado' && p.corretor) {
                        if (!stats[p.corretor]) {
                            stats[p.corretor] = { 
                                name: p.corretor, 
                                lancadoCount: 0, 
                                lancadoValue: 0,
                                category: brokerCategoryMap.get(p.corretor) || 'locacao'
                            };
                        }
                        stats[p.corretor].lancadoCount += 1;
                        stats[p.corretor].lancadoValue += p.valor;
                    }
                });

                return Object.values(stats).sort((a, b) => b.lancadoValue - a.lancadoValue);
            }, [payments, brokers]);

            const handleSelectBroker = (brokerName) => {
                setSelectedBroker(brokerName);
                setView('details');
            };

            const handleBack = () => {
                setSelectedBroker(null);
                setView('list');
            };

            if (view === 'details') {
                return <CarteiraBrokerDetails 
                            brokerName={selectedBroker} 
                            onBack={handleBack}
                            user={user}
                            showToast={showToast}
                            dataInicioParent={dataInicio}
                            dataFimParent={dataFim}
                            dataInicio={dataInicio}
                            setDataInicio={setDataInicio}
                            dataFim={dataFim}
                            firebaseApi={firebaseApi}
                            logAudit={logAudit}
                        />;
            }

            return (
                <div className="max-w-5xl mx-auto slide-up">
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-slate-100 pb-6">
                            <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z" /><path fillRule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clipRule="evenodd" /></svg>
                                Carteira de Comissões
                            </h2>
                            <div className="flex items-center gap-2">
                                 <div className="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus-within:ring-2 focus-within:ring-blue-500 transition">
                                    <Icons.Calendar />
                                    <span className="text-sm text-slate-500 ml-2 mr-1">De:</span>
                                    <input type="date" value={dataInicio} onChange={(e) => setDataInicio(e.target.value)} className="outline-none bg-transparent text-slate-700 font-medium w-full sm:w-32" />
                                    <span className="text-sm text-slate-500 mx-2">Até:</span>
                                    <input type="date" value={dataFim} onChange={(e) => setDataFim(e.target.value)} className="outline-none bg-transparent text-slate-700 font-medium w-full sm:w-32" />
                                </div>
                                
                            </div>
                        </div>
                        <div className="flex flex-wrap gap-4 items-center mb-6">
                            <select value={categoryFilter} onChange={(e) => setCategoryFilter(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none font-medium w-full sm:w-auto">
                                <option value="todos">Todas as Equipes</option>
                                <option value="locacao">Locação</option>
                                <option value="lancamento">Lançamento</option>
                                <option value="terceiro">Terceiro</option>
                            </select>
                            <label className="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" checked={showOnlyWithValues} onChange={(e) => setShowOnlyWithValues(e.target.checked)} className="h-5 w-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500" />
                                <span className="font-medium text-sm text-slate-700">Mostrar apenas com valores a pagar</span>
                            </label>
                        </div>

                        {brokerWalletStats.length === 0 ? (
                            <div className="text-center py-16 text-slate-500 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                                <p className="mb-4 text-lg">Nenhuma comissão lançada para pagamento neste período.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                                {brokerWalletStats
                                .filter(broker => {
                                    const valueMatch = !showOnlyWithValues || broker.lancadoValue > 0;
                                    const categoryMatch = categoryFilter === 'todos' || broker.category === categoryFilter;
                                    return valueMatch && categoryMatch;
                                })
                                .map(broker => (
                                    <div key={broker.name} onClick={() => handleSelectBroker(broker.name)} className="group bg-white border border-slate-200 hover:border-blue-400 hover:shadow-md hover:-translate-y-1 transition-all duration-200 cursor-pointer rounded-2xl p-5 flex flex-col justify-between">
                                        <div className="flex items-center gap-3 mb-5">
                                            <div className="bg-slate-100 text-slate-600 group-hover:bg-blue-100 group-hover:text-blue-600 p-3 rounded-full transition-colors"><Icons.User /></div>
                                            <h3 className="font-bold text-slate-800 text-lg truncate" title={broker.name}>{broker.name}</h3>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-sm text-slate-500 font-medium">{broker.lancadoCount} comissões</p>
                                            <p className="text-2xl font-black text-green-600">{formatMoney(broker.lancadoValue)}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const CarteiraBrokerDetails = ({ brokerName, onBack, user, showToast, firebaseApi, logAudit, dataInicioParent, dataFimParent }) => {
            const [launchedPayments, setLaunchedPayments] = useState([]);
            const [paidPayments, setPaidPayments] = useState([]);
            const [selectedPayments, setSelectedPayments] = useState([]);
            const [deletingPayment, setDeletingPayment] = useState(null);
            const [loading, setLoading] = useState(true);
            const [statusFilter, setStatusFilter] = useState('Lançado'); // 'Lançado' ou 'Paga'
            const [dataInicio, setDataInicio] = useState(dataInicioParent);
            const [dataFim, setDataFim] = useState(dataFimParent);

            const fetchData = useCallback(() => {
                if (!user || !brokerName || !dataInicio || !dataFim) return;
                setLoading(true);
                const { query, collection, where, getDocs, and, orderBy } = firebaseApi;
                const paymentsRef = collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments');

                const qLaunched = query(paymentsRef,
                    and(
                        where("corretor", "==", brokerName),
                        where("status", "==", "Lançado"),
                        where("dataLancamento", ">=", dataInicio + "T00:00:00.000Z"),
                        where("dataLancamento", "<=", dataFim + "T23:59:59.999Z")
                    ),
                    orderBy("dataLancamento", "desc")
                );

                const qPaid = query(paymentsRef,
                    and(
                        where("corretor", "==", brokerName),
                        where("status", "==", "Paga"),
                        where("dataPagamento", ">=", dataInicio),
                        where("dataPagamento", "<=", dataFim)
                    ),
                    orderBy("dataPagamento", "desc")
                );

                Promise.all([getDocs(qLaunched), getDocs(qPaid)]).then(([launchedSnap, paidSnap]) => {
                    const launchedData = launchedSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    const paidData = paidSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setLaunchedPayments(launchedData);
                    setPaidPayments(paidData);
                }).catch(error => {
                    console.error("Error fetching broker wallet data:", error);
                    showToast("Erro ao carregar a carteira do corretor. Verifique o console para criar índices.", "error");
                }).finally(() => {
                    setLoading(false);
                });
            }, [user, brokerName, dataInicio, dataFim, firebaseApi, showToast]);

            useEffect(() => {
                fetchData();
            }, [fetchData]);

            const payments = useMemo(() => {
                return statusFilter === 'Lançado' ? launchedPayments : paidPayments;
            }, [statusFilter, launchedPayments, paidPayments]);

            const handlePay = async (paymentIdsToPay) => {
                if (paymentIdsToPay.length === 0) {
                    showToast("Nenhuma comissão selecionada para pagar.", "error");
                    return;
                }
                try {
                    if (!user) return;
                    const paymentDate = new Date().toISOString().split('T')[0];
                    for (const paymentId of paymentIdsToPay) {
                        const docRef = firebaseApi.doc(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments', paymentId);
                        await firebaseApi.updateDoc(docRef, {
                            status: 'Paga',
                            dataPagamento: paymentDate,
                            lastModifiedBy: user.email
                        });
                    }
                    await logAudit(user, "Pagamento de Comissão", `Pagou ${paymentIdsToPay.length} comissões para ${brokerName}.`);
                    setSelectedPayments([]);
                    showToast(`${paymentIdsToPay.length} comissão(ões) foi/foram marcada(s) como 'Paga(s)'.`, "success");
                    fetchData(); // Recarrega os dados para atualizar a lista
                } catch (err) {
                    showToast("Erro ao processar o pagamento.", "error");
                }
            };

            const handleSelectPayment = (paymentId) => {
                setSelectedPayments(prev =>
                    prev.includes(paymentId)
                        ? prev.filter(id => id !== paymentId)
                        : [...prev, paymentId]
                );
            };

            const totalValor = useMemo(() => 
                payments.reduce((acc, p) => acc + p.valor, 0), [payments]);

            const handleDeletePayment = async () => {
                if (!deletingPayment) return;
                try {
                    if (!user) return;
                    const docRef = firebaseApi.doc(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments', deletingPayment.id);
                    await firebaseApi.deleteDoc(docRef);
                    await logAudit(user, "Exclusão de Lançamento da Carteira", `Pagamento ID: ${deletingPayment.id}, Corretor: ${brokerName}`);
                    setDeletingPayment(null);
                    showToast("Lançamento removido da carteira.", "success");
                    fetchData(); // Re-fetch data
                } catch (err) {
                    showToast("Erro ao remover lançamento.", "error");
                }
            };
            
            return (
                <div className="max-w-5xl mx-auto slide-up">
                    <button onClick={onBack} className="flex items-center gap-2 text-slate-700 hover:text-blue-600 bg-white border border-slate-300 hover:bg-blue-50 font-semibold mb-4 transition px-4 py-2 rounded-xl shadow-sm">
                        <Icons.ArrowLeft /> Voltar para Carteiras
                    </button>
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 border-b border-slate-200 pb-6">
                            <div>
                                <h2 className="text-3xl font-black text-slate-800 flex items-center gap-3 mt-1">
                                    <Icons.User /> {brokerName}
                                </h2>
                                <p className="text-slate-500 font-medium mt-2">
                                    {statusFilter === 'Lançado' ? 'Total a Pagar: ' : 'Total Pago no Período: '}
                                    <span className="font-bold text-green-600">{formatMoney(totalValor)}</span>
                                </p>
                            </div>
                            {selectedPayments.length > 0 && statusFilter === 'Lançado' && (
                                <div className="flex gap-2">
                                    <button onClick={() => handlePay(selectedPayments)} className="w-full sm:w-auto flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-5 rounded-xl shadow-sm transition mt-4 sm:mt-0">
                                        <Icons.CheckCircle /> Pagar Selecionados ({selectedPayments.length})
                                    </button>
                                </div>
                            )}
                        </div>
                        <div className="flex justify-between items-center mb-6">
                            <div className="flex border-b border-slate-200">
                                <button onClick={() => { setStatusFilter('Lançado'); setSelectedPayments([]); }} className={`px-4 py-3 font-semibold transition-colors duration-200 ${statusFilter === 'Lançado' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-slate-500 hover:text-slate-800'}`}>
                                    A Pagar
                                </button>
                                <button onClick={() => { setStatusFilter('Paga'); setSelectedPayments([]); }} className={`px-4 py-3 font-semibold transition-colors duration-200 ${statusFilter === 'Paga' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-slate-500 hover:text-slate-800'}`}>
                                    Histórico de Pagas
                                </button>
                            </div>
