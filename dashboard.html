        const Dashboard = ({ user, captures, brokers, setView, onSelectBroker, showToast, dataInicio, setDataInicio, dataFim, setDataFim }) => {
            const [showReportModal, setShowReportModal] = useState(false);
            const [selectedReportCategories, setSelectedReportCategories] = useState({ locacao: true, lancamento: true, terceiro: true });

            const filteredCaptures = useMemo(() => {
                if (!dataInicio || !dataFim) return captures;
                return captures.filter(c => c.data >= dataInicio && c.data <= dataFim);
            }, [captures, dataInicio, dataFim]);

            const brokerStats = useMemo(() => {
                const stats = {};
                const brokerCategoryMap = new Map(brokers.map(b => [b.name, b.category || 'locacao']));

                // Initialize stats for each broker to ensure all are included
                filteredCaptures.forEach(c => {
                    const name = c.corretor.trim();
                    const secondName = c.secondCorretor ? c.secondCorretor.trim() : null;
                    const key = name.toUpperCase();
                    if (!stats[key]) {
                        stats[key] = { 
                            name: name, 
                            count: 0, 
                            aluguelCount: 0, 
                            category: brokerCategoryMap.get(name) || 'locacao',
                            vendaCount: 0, 
                            aluguelVendaCount: 0, 
                            approvedForMetaCount: 0, // This will be the final score
                            // Temporary counters for meta calculation
                            metaPrimeiroRegistro: 0,
                            metaAtualizacao: 0
                        };
                    }
                    if (secondName && !stats[secondName.toUpperCase()]) {
                        stats[secondName.toUpperCase()] = {
                            name: secondName,
                            count: 0,
                            aluguelCount: 0,
                            category: brokerCategoryMap.get(secondName) || 'locacao',
                            vendaCount: 0,
                            aluguelVendaCount: 0,
                            approvedForMetaCount: 0,
                            metaPrimeiroRegistro: 0,
                            metaAtualizacao: 0
                        };
                    }
                });

                // Populate stats
                filteredCaptures.forEach(c => {
                    const name = c.corretor.trim();
                    const key = name.toUpperCase();
                    const secondName = c.secondCorretor ? c.secondCorretor.trim() : null;
                    const secondKey = secondName ? secondName.toUpperCase() : null;
                    const contribution = secondName ? 0.5 : 1;

                    [key, secondKey].filter(Boolean).forEach(currentKey => {
                        stats[currentKey].count += contribution;

                        if (c.tipo === 'venda') {
                            stats[currentKey].vendaCount += contribution;
                        } else if (c.tipo === 'aluguel_venda') {
                            stats[currentKey].aluguelVendaCount += contribution;
                        } else {
                            stats[currentKey].aluguelCount += contribution;
                        }

                        const isMetaEligible = c.status === 'aprovado' && c.availability !== 'indisponivel' && c.tipo !== 'venda';
                        if (isMetaEligible) {
                            if (c.registrationType === 'atualizacao') {
                                stats[currentKey].metaAtualizacao += contribution;
                            } else {
                                stats[currentKey].metaPrimeiroRegistro += contribution;
                            }
                        }
                    });
                });


                // Calculate final meta score for each broker
                Object.keys(stats).forEach(key => {
                    const broker = stats[key];
                    const atualizacaoBonus = broker.metaAtualizacao >= 5 ? 3 : 0;
                    broker.approvedForMetaCount = broker.metaPrimeiroRegistro + atualizacaoBonus;
                });

                return Object.values(stats).sort((a, b) => b.approvedForMetaCount - a.approvedForMetaCount);
            }, [filteredCaptures, brokers]);

            const topBroker = brokerStats.length > 0 ? brokerStats[0] : null;

            const handleCategoryToggle = (category) => {
                setSelectedReportCategories(prev => ({ ...prev, [category]: !prev[category] }));
            };

            const exportMonthlyPDF = async (currentUser, categoriesToInclude) => {
                const brokersToReport = brokerStats.filter(b => categoriesToInclude[b.category]);

                if (brokersToReport.length === 0) {
                    showToast("Não há dados para exportar neste período.", "error");
                    return;
                }
                setShowReportModal(false);
                try {
                    const meta = 6;
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    
                    const title = `Relatório de Captações: ${formatDateToBR(dataInicio)} a ${formatDateToBR(dataFim)}`;
                    
                    doc.setFontSize(16);
                    doc.text(title, 14, 22);
                    doc.setFontSize(10);
                    doc.setTextColor('#64748b'); // Corrigido para string hexadecimal (cinza)
                    doc.text(`Exportado por: ${currentUser?.email || 'Usuário desconhecido'}`, 14, 28);
                    
                    const tableData = brokersToReport.map(b => [ 
                        b.name,
                        b.aluguelCount,
                        b.aluguelVendaCount,
                        b.vendaCount,
                        b.count,
                        `${b.approvedForMetaCount} / ${meta}`,
                        b.approvedForMetaCount >= meta ? 'Atingida' : 'Não Atingida'
                    ]);
                    const totalAluguel = brokersToReport.reduce((sum, b) => sum + b.aluguelCount, 0);
                    const totalAluguelVenda = brokersToReport.reduce((sum, b) => sum + b.aluguelVendaCount, 0);
                    const totalVenda = brokersToReport.reduce((sum, b) => sum + b.vendaCount, 0);
                    const totalCount = brokersToReport.reduce((sum, b) => sum + b.count, 0);
                    tableData.push(['TOTAL', totalAluguel, totalAluguelVenda, totalVenda, totalCount, '', '']);
                    
                    doc.autoTable({
                        startY: 35,
                        head: [['Corretor', 'Aluguel', 'Aluguel/Venda', 'Venda', 'Total', 'Meta', 'Status Meta']],
                        body: tableData,
                        theme: 'grid',
                        headStyles: { fillColor: [37, 99, 235] },
                        styles: { fontSize: 11 },
                    });
                    
                    const formattedDate = `${dataInicio}_${dataFim}`;
                    doc.save(`captacoes_resumo_${formattedDate}.pdf`);
                    await logAudit(currentUser, "Exportação de PDF", `Relatório de Desempenho (Resumo). Período: ${formatDateToBR(dataInicio)} a ${formatDateToBR(dataFim)}`);
                    showToast("PDF gerado com sucesso!", "success");
                } catch(e) {
                    showToast("Erro ao gerar PDF.", "error");
                }
            };

            return (
                <div className="max-w-5xl mx-auto slide-up">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <div className="bg-gradient-to-br from-blue-600 to-blue-800 rounded-2xl p-6 text-white shadow-md flex items-center justify-between">
                            <div>
                                <p className="text-blue-100 font-medium mb-1">Total do Mês</p>
                                <h3 className="text-4xl font-black">{filteredCaptures.length} <span className="text-lg font-normal text-blue-200">imóveis</span></h3>
                            </div>
                            <div className="bg-blue-500/30 p-3 rounded-full">
                                <Icons.TrendingUp />
                            </div>
                        </div>
                        
                        <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex items-center justify-between">
                            <div>
                                <p className="text-slate-500 font-medium mb-1">Corretor Destaque</p>
                                <h3 className="text-2xl font-bold text-slate-800">
                                    {topBroker ? topBroker.name : '-'}
                                </h3>
                                {topBroker && <p className="text-sm text-green-600 font-medium mt-1">{topBroker.approvedForMetaCount} pts (meta)</p>}
                            </div>
                            <div className="bg-amber-100 text-amber-600 p-3 rounded-full">
                                <Icons.Award />
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-slate-100 pb-6">
                            <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                <Icons.Users /> Desempenho da Equipe
                            </h2>
                            
                            <div className="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                                <div className="flex-1 sm:flex-none flex items-center bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus-within:ring-2 focus-within:ring-blue-500 transition">
                                    <Icons.Calendar />
                                    <span className="text-sm text-slate-500 ml-2 mr-1">De:</span>
                                    <input 
                                        type="date" 
                                        value={dataInicio}
                                        onChange={(e) => setDataInicio(e.target.value)}
                                        className="outline-none bg-transparent text-slate-700 font-medium w-full sm:w-32"
                                    />
                                    <span className="text-sm text-slate-500 mx-2">Até:</span>
                                    <input 
                                        type="date" 
                                        value={dataFim}
                                        onChange={(e) => setDataFim(e.target.value)}
                                        className="outline-none bg-transparent text-slate-700 font-medium w-full sm:w-32"
                                    />
                                </div>
                                <button 
                                    onClick={() => setShowReportModal(true)}
                                    className="flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 px-5 rounded-xl transition shadow-sm w-full sm:w-auto"
                                    title="Exportar Relatório"
                                >
                                    <Icons.FileText /> <span className="sm:hidden md:inline">Relatório</span>
                                </button>
                            </div>
                        </div>

                        {brokerStats.length === 0 ? (
                            <div className="text-center py-16 text-slate-500 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                                <Icons.Search className="w-10 h-10 mx-auto text-slate-300 mb-3" />
                                <p className="mb-4 text-lg">Nenhuma captação registrada neste mês.</p>
                                <button onClick={() => setView('form')} className="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-2 px-6 rounded-lg transition shadow-sm">
                                    Registrar Primeira Captação
                                </button>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                                {brokerStats.map((broker, idx) => (
                                    <div 
                                        key={idx} 
                                        onClick={() => onSelectBroker(broker.name)}
                                        className="group bg-white border border-slate-200 hover:border-blue-400 hover:shadow-md hover:-translate-y-1 transition-all duration-200 cursor-pointer rounded-2xl p-5 flex flex-col justify-between"
                                    >
                                        <div className="flex items-center gap-3 mb-5">
                                            <div className="bg-slate-100 text-slate-600 group-hover:bg-blue-100 group-hover:text-blue-600 p-3 rounded-full transition-colors">
                                                <Icons.User />
                                            </div>
                                            <h3 className="font-bold text-slate-800 text-lg truncate" title={broker.name}>{broker.name}</h3>
                                        </div>
                                        <div className="flex justify-between items-end bg-slate-50 p-3 rounded-xl group-hover:bg-blue-50/50 transition-colors">
                                            <span className="text-sm text-slate-500 font-medium">Imóveis</span>
                                            <span className="text-3xl font-black text-blue-600 leading-none">{broker.count}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {showReportModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                            <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 slide-up">
                                <h3 className="text-xl font-bold text-slate-800 mb-4">Gerar Relatório de Desempenho</h3>
                                <p className="text-slate-600 mb-6">Selecione as categorias de corretores que você deseja incluir no relatório PDF.</p>
                                <div className="space-y-3 mb-8">
                                    <label className="flex items-center p-3 bg-slate-50 rounded-lg border border-slate-200 hover:bg-slate-100 cursor-pointer">
                                        <input type="checkbox" checked={selectedReportCategories.locacao} onChange={() => handleCategoryToggle('locacao')} className="h-5 w-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500" />
                                        <span className="ml-3 font-semibold text-slate-700">Locação</span>
                                    </label>
                                    <label className="flex items-center p-3 bg-slate-50 rounded-lg border border-slate-200 hover:bg-slate-100 cursor-pointer">
                                        <input type="checkbox" checked={selectedReportCategories.lancamento} onChange={() => handleCategoryToggle('lancamento')} className="h-5 w-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500" />
                                        <span className="ml-3 font-semibold text-slate-700">Lançamento</span>
                                    </label>
                                    <label className="flex items-center p-3 bg-slate-50 rounded-lg border border-slate-200 hover:bg-slate-100 cursor-pointer">
                                        <input type="checkbox" checked={selectedReportCategories.terceiro} onChange={() => handleCategoryToggle('terceiro')} className="h-5 w-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500" />
                                        <span className="ml-3 font-semibold text-slate-700">Terceiro</span>
                                    </label>
                                </div>
                                <div className="flex gap-3">
                                    <button 
                                        onClick={() => setShowReportModal(false)} 
                                        className="flex-1 bg-slate-100 text-slate-700 py-2.5 rounded-xl font-semibold hover:bg-slate-200 transition"
                                    >
                                        Cancelar
                                    </button>
                                    <button 
                                        onClick={() => exportMonthlyPDF(user, selectedReportCategories)}
                                        className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-semibold hover:bg-blue-700 transition shadow-sm"
                                    >
                                        Gerar PDF
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const BrokerDetails = ({ captures, brokerName, onBack, user, brokers, showToast, dataInicio, setDataInicio, dataFim, setDataFim, userProfile }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [statusFilter, setStatusFilter] = useState('todos');
            const [editingItem, setEditingItem] = useState(null);
            const [deletingItem, setDeletingItem] = useState(null);

            const brokerInfo = useMemo(() => brokers.find(b => b.name === brokerName), [brokers, brokerName]);

            const filteredData = useMemo(() => {
                return captures.filter(c => {
                    const upperBrokerName = brokerName.toUpperCase();
                    const matchBroker = c.corretor.trim().toUpperCase() === upperBrokerName ||
                                      (c.secondCorretor && c.secondCorretor.trim().toUpperCase() === upperBrokerName);
                    const matchMonth = (c.data >= dataInicio && c.data <= dataFim);
                    const matchStatus = statusFilter === 'todos' || (c.status || 'pendente') === statusFilter;
                    
                    const term = searchTerm.toLowerCase();
                    const matchSearch = term === '' || 
                                      (c.codigo && c.codigo.toLowerCase().includes(term));

                    return matchBroker && matchMonth && matchSearch && matchStatus;
                }).sort((a, b) => new Date(b.data) - new Date(a.data));
            }, [captures, brokerName, dataInicio, dataFim, searchTerm, statusFilter]);

            const handleToggleStatus = async (item) => {
                const newStatus = (item.status || 'pendente') === 'aprovado' ? 'pendente' : 'aprovado';
                try {
                    if (!user) return;
                    const docRef = window.doc(window.db, 'artifacts', window.__app_id, 'public', 'data', 'captures', item.id);
                    await window.updateDoc(docRef, {
                        status: newStatus,
                        lastModifiedBy: user.email
                    });
                    await logAudit(user, "Alteração de Status da Captação", `Código: ${item.codigo}, Novo Status: ${newStatus}`);
                    showToast(`Status da captação ${item.codigo} alterado para ${newStatus}.`, "success");
                } catch (err) {
                    showToast("Erro ao alterar o status.", "error");
                }
            };

            const exportBrokerPDF = async (currentUser) => {
                if (filteredData.length === 0) {
                    showToast("Não há dados para exportar neste período.", "error");
                    return;
                }
                try {
                    // Verificação de segurança para garantir que a biblioteca jsPDF foi carregada
                    if (!window.jspdf || !window.jspdf.jsPDF) {
                        showToast("A biblioteca de PDF ainda não carregou. Tente novamente em um instante.", "error");
                        console.error("jsPDF library not available on window.");
                        return;
                    }

                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    
                    doc.setFontSize(16);
                    doc.text(`Captações - Corretor: ${brokerName}`, 14, 22);
                    doc.setFontSize(12);
                    doc.text(`Período: ${formatDateToBR(dataInicio)} a ${formatDateToBR(dataFim)}`, 14, 30);
                    doc.setFontSize(10);
                    doc.setTextColor('#64748b'); // Corrigido para string hexadecimal (cinza)
                    doc.text(`Exportado por: ${currentUser?.email || 'Usuário desconhecido'}`, 14, 36);

                    const metaEligibleCaptures = filteredData.filter(c => c.status === 'aprovado' && c.availability !== 'indisponivel' && c.tipo !== 'venda');

                    const primeiroRegistroCount = metaEligibleCaptures.filter(c => (c.registrationType !== 'atualizacao')).length;
                    const atualizacaoCount = metaEligibleCaptures.filter(c => c.registrationType === 'atualizacao').length;

                    let metaScore = primeiroRegistroCount;
                    if (atualizacaoCount >= 5) {
                        metaScore += 3;
                    }
                    const meta = 6;
                    const metaAtingida = metaScore >= meta;

                    const totalCaptacoes = filteredData.length;
                    const totalAluguel = filteredData.filter(c => c.tipo === 'aluguel' || c.tipo === 'locacao' || typeof c.tipo === 'undefined').length;
                    const totalAluguelVenda = filteredData.filter(c => c.tipo === 'aluguel_venda').length; 
                    const totalVenda = filteredData.filter(c => c.tipo === 'venda').length;
                    
                    doc.setFontSize(12);
                    doc.setFont('helvetica', 'bold');
                    doc.text(`Total de Captações: ${totalCaptacoes} (Aluguel: ${totalAluguel}, Al-Vd: ${totalAluguelVenda}, Venda: ${totalVenda})`, 14, 46);

                    doc.setFont('helvetica', 'normal');
                    doc.setTextColor(metaAtingida ? '#22c55e' : '#ef4444');
                    doc.text(`Meta (${meta} pts): ${metaAtingida ? 'ATINGIDA' : 'NÃO ATINGIDA'} (${metaScore} de ${meta})`, 14, 52);
                    
                    // Reset text color
                    doc.setTextColor('#000000'); // Garante que seja string hexadecimal

                    const tableData = filteredData.map(item => [
                        item.codigo, 
                        item.tipo === 'venda' ? 'Venda' : (item.tipo === 'aluguel_venda' ? 'Aluguel/Venda' : 'Aluguel'), 
                        item.status === 'aprovado' ? 'Aprovado' : 'Pendente', 
                        formatDateToBR(item.data),
                        item.registrationType === 'atualizacao' ? 'Atualização' : '1º Registro',
                        item.availability === 'indisponivel' ? 'Indisponível' : 'Disponível'
                    ]);
                    
                    doc.autoTable({
                        startY: 60,
                        head: [['Código', 'Tipo', 'Status', 'Data', 'Registro', 'Disponibilidade']],
                        body: tableData,
                        theme: 'grid',
                        headStyles: { fillColor: [37, 99, 235] },
                        styles: { fontSize: 10 }
                    });

                    const formattedDate = `${dataInicio}_${dataFim}`;
                    doc.save(`captacoes_${brokerName.replace(/\s+/g, '_')}_${formattedDate}.pdf`);
                    await logAudit(currentUser, "Exportação de PDF", `Relatório Individual. Corretor: ${brokerName}, Período: ${formatDateToBR(dataInicio)} a ${formatDateToBR(dataFim)}`);
                    showToast("PDF do corretor gerado com sucesso!", "success");

                } catch(e) {
                    console.error("Erro ao gerar PDF do corretor:", e);
                    showToast("Erro ao gerar PDF.", "error");
                }
            };

            const handleSaveEdit = async () => {
                if (!editingItem.corretor || !editingItem.codigo || !editingItem.data) {
                    showToast("Preencha corretor, código e data!", "error");
                    return;
                }
                try {
                    if (!user) return;
                    const docRef = window.doc(window.db, 'artifacts', window.__app_id, 'public', 'data', 'captures', editingItem.id);
                    await window.updateDoc(docRef, {
                        corretor: editingItem.corretor.trim(),
                        codigo: editingItem.codigo.trim().toUpperCase(),
                        data: editingItem.data,
                        secondCorretor: editingItem.secondCorretor || null, // Salva o segundo corretor
                        tipo: editingItem.tipo || 'aluguel', // Garante que o tipo seja salvo
                        status: editingItem.status || 'pendente',
                        registrationType: editingItem.registrationType || 'primeiro_registro',
                        availability: editingItem.availability || 'disponivel',
                        lastModifiedBy: user.email
                    });
                    await logAudit(user, "Edição de Captação", `Corretor: ${editingItem.corretor.trim()}, Código: ${editingItem.codigo.trim().toUpperCase()}`);
                    setEditingItem(null);
                    showToast("Captação atualizada com sucesso!", "success");
                } catch (err) {
                    console.error("Erro ao atualizar:", err);
                    showToast("Erro ao salvar as edições.", "error");
                }
            };

            const handleDeleteItem = async () => {
                try {
                    if (!user) return;
                    const docRef = window.doc(window.db, 'artifacts', window.__app_id, 'public', 'data', 'captures', deletingItem.id);
                    await window.deleteDoc(docRef);
                    await logAudit(user, "Exclusão de Captação", `Código: ${deletingItem.codigo}, Corretor: ${deletingItem.corretor}`);
                    setDeletingItem(null);
                    showToast("Captação excluída permanentemente.", "success");
                } catch (err) {
                    showToast("Erro ao excluir a captação.", "error");
                }
            };

            return (
                <div className="max-w-5xl mx-auto slide-up">
                    <button 
                        onClick={onBack}
                        className="flex items-center gap-2 text-slate-500 hover:text-blue-600 font-medium mb-4 transition px-2 py-1 rounded-lg hover:bg-blue-50"
                    >
                        <Icons.ArrowLeft /> Voltar ao Dashboard
                    </button>
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                        <div className="mb-6 border-b border-slate-200 pb-6">
                            <p className="text-sm text-slate-500 font-medium uppercase tracking-wide">Captações por Corretor</p>
                            <h2 className="text-3xl font-black text-slate-800 flex items-center flex-wrap gap-x-3 gap-y-2 mt-1">
                                <Icons.User /> {brokerName}
                                {brokerInfo && (
                                    <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${
                                        brokerInfo.category === 'lancamento' ? 'bg-purple-100 text-purple-700' :
                                        brokerInfo.category === 'terceiro' ? 'bg-gray-100 text-gray-700' :
                                        'bg-sky-100 text-sky-700'
                                    }`}>{brokerInfo.category ? brokerInfo.category.charAt(0).toUpperCase() + brokerInfo.category.slice(1) : 'Locação'}</span>
                                )}
                            </h2>
                        </div>

                        <div className="flex flex-wrap items-center gap-3 mb-6">
                            <div className="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 w-full sm:w-auto focus-within:ring-2 focus-within:ring-blue-500">
                                <Icons.Calendar className="text-slate-400"/>
                                <span className="text-xs text-slate-500 ml-2 mr-1">De:</span>
                                <input 
                                    type="date" 
                                    value={dataInicio}
                                    onChange={(e) => setDataInicio(e.target.value)}
                                    className="outline-none bg-transparent w-full sm:w-28 text-sm font-medium"
                                />
                                <span className="text-xs text-slate-500 mx-1">Até:</span>
                                <input 
                                    type="date" 
                                    value={dataFim}
                                    onChange={(e) => setDataFim(e.target.value)}
                                    className="outline-none bg-transparent w-full sm:w-28 text-sm font-medium"
                                />
                            </div>
                            <div className="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 w-full sm:w-auto focus-within:ring-2 focus-within:ring-blue-500">
                                <Icons.Search className="text-slate-400"/>
                                <input 
                                    type="text" 
                                    placeholder="Buscar código..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="ml-2 outline-none bg-transparent w-full placeholder:text-slate-400"
                                />
                            </div>
                            <div className="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 w-full sm:w-auto focus-within:ring-2 focus-within:ring-blue-500">
                                <Icons.Shield className="text-slate-400"/>
                                <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="ml-2 outline-none bg-transparent w-full text-sm font-medium">
                                    <option value="todos">Todos os Status</option>
                                    <option value="aprovado">Aprovado</option>
                                    <option value="pendente">Pendente</option>
                                </select>
                            </div>
                        </div>

                        <div className="flex flex-wrap gap-4 items-center justify-between mb-4 mt-6 bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <h3 className="font-semibold text-slate-700">
                                Imóveis Encontrados: <span className="bg-blue-600 text-white text-xs font-bold px-2 py-1 rounded-full shadow-sm">{filteredData.length}</span>
                            </h3>
                            <div>
                                <button onClick={() => exportBrokerPDF(window.auth.currentUser)} className="flex items-center gap-1 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow-sm transition">
                                    <Icons.FileText /> Exportar PDF
                                </button>
                            </div>
                        </div>

                        {filteredData.length === 0 ? (
                            <div className="text-center py-12 text-slate-500 bg-slate-50 rounded-xl border border-dashed border-slate-200">
                                Nenhum registro encontrado com estes filtros.
                            </div>
                        ) : (
                            <div className="overflow-x-auto border border-slate-200 rounded-xl">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm">
                                            <th className="py-4 px-5 font-bold">Corretores</th>
                                            <th className="py-4 px-5 font-bold">Cód. Imóvel</th>
                                            <th className="py-4 px-5 font-bold">Status</th>
                                            <th className="py-4 px-5 font-bold">Tipo</th>
                                            <th className="py-4 px-5 font-bold">Data</th>
                                            <th className="py-4 px-5 font-bold">Registro</th>
                                            <th className="py-4 px-5 font-bold">Dispon.</th>
                                            <th className="py-4 px-5 font-bold text-right">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-sm">
                                        {filteredData.map((item) => (
                                            <tr key={item.id} className="border-b border-slate-100 hover:bg-blue-50/30 transition last:border-0">
                                                <td className="py-4 px-5 text-slate-600 font-medium">
                                                    <div className="flex flex-col">
                                                        <span>{item.corretor}</span>
                                                        {item.secondCorretor && <span className="text-xs text-slate-500">{item.secondCorretor}</span>}
                                                    </div>
                                                </td>
                                                <td className="py-4 px-5 font-bold text-slate-800">{item.codigo}</td>
                                                <td className="py-4 px-5 text-slate-600 font-medium">
                                                    <span className={`px-2 py-1 rounded-full text-xs font-semibold ${item.status === 'aprovado' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                                                        {item.status === 'aprovado' ? 'Aprovado' : 'Pendente'}
                                                    </span>
                                                </td>
                                                <td className="py-4 px-5 text-slate-600 font-medium">
                                                    <span className={`px-2 py-1 rounded-full text-xs font-semibold ${
                                                        item.tipo === 'venda' ? 'bg-purple-100 text-purple-700' : 
                                                        item.tipo === 'aluguel_venda' ? 'bg-orange-100 text-orange-700' : 
                                                        'bg-sky-100 text-sky-700'}`
                                                    }>{item.tipo === 'venda' ? 'Venda' : item.tipo === 'aluguel_venda' ? 'Aluguel/Venda' : 'Aluguel'}</span>
                                                </td>
                                                <td className="py-4 px-5 text-slate-500">{formatDateToBR(item.data)}</td>
                                                <td className="py-4 px-5 text-slate-600 font-medium">
                                                    <span className={`px-2 py-1 rounded-full text-xs font-semibold ${item.registrationType === 'atualizacao' ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-700'}`}>
                                                        {item.registrationType === 'atualizacao' ? 'Atualização' : '1º Registro'}
                                                    </span>
                                                </td>
                                                <td className="py-4 px-5 text-slate-600 font-medium">
                                                    <span className={`px-2 py-1 rounded-full text-xs font-semibold ${(item.availability === 'indisponivel') ? 'bg-red-100 text-red-700' : 'bg-teal-100 text-teal-700'}`}>
                                                        {(item.availability === 'indisponivel') ? 'Indisponível' : 'Disponível'}
                                                    </span>
                                                </td>
                                                <td className="py-4 px-5 text-right whitespace-nowrap">
                                                    {['Administrador', 'Gestor'].includes(userProfile?.role) && (
                                                        <>
                                                            <button onClick={() => handleToggleStatus(item)} className={`p-2 rounded-lg transition mr-2 ${
                                                                (item.status || 'pendente') === 'pendente' ? 'text-green-500 hover:bg-green-100' : 'text-amber-500 hover:bg-amber-100'
                                                            }`} title={(item.status || 'pendente') === 'pendente' ? 'Aprovar Captação' : 'Marcar como Pendente'}>
                                                                <Icons.CheckCircle />
                                                            </button>
                                                            <button onClick={() => setEditingItem({...item})} className="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-100 rounded-lg transition mr-2" title="Editar"><Icons.Edit /></button>
                                                            <button onClick={() => setDeletingItem(item)} className="p-2 text-slate-400 hover:text-red-600 hover:bg-red-100 rounded-lg transition" title="Excluir"><Icons.Trash /></button>
                                                        </>
                                                    )}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {editingItem && (
                            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                                <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 slide-up">
                                    <h3 className="text-xl font-bold text-slate-800 mb-4 border-b border-slate-100 pb-3">Editar Captação</h3>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-semibold text-slate-700 mb-1">Corretor Principal</label>
                                            <select 
                                                value={editingItem.corretor} 
                                                onChange={(e) => setEditingItem({...editingItem, corretor: e.target.value})} 
                                                className="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white" 
                                            >
                                                {brokers.map(b => (
                                                    <option key={b.id} value={b.name}>{b.name}</option>
                                                ))}
                                                {!brokers.some(b => b.name === editingItem.corretor) && (
                                                    <option value={editingItem.corretor}>{editingItem.corretor} (Inativo)</option>
                                                )}
                                            </select>
                                        </div>
                                        <div>
                                            <div className="flex items-center mb-1">
                                                <input
                                                    type="checkbox"
                                                    id="editHasSecondBroker"
                                                    checked={editingItem.secondCorretor !== null}
                                                    onChange={(e) => setEditingItem({...editingItem, secondCorretor: e.target.checked ? (editingItem.secondCorretor || '') : null})}
                                                    className="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                                                />
                                                <label htmlFor="editHasSecondBroker" className="ml-2 block text-sm font-semibold text-slate-700">Adicionar segundo corretor?</label>
                                            </div>
                                            {editingItem.secondCorretor !== null && (
                                                <select
                                                    value={editingItem.secondCorretor || ''}
                                                    onChange={(e) => setEditingItem({...editingItem, secondCorretor: e.target.value})}
                                                    className="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                                                >
                                                    <option value="">Selecione o segundo corretor...</option>
                                                    {brokers.map(b => (<option key={b.id} value={b.name}>{b.name}</option>))}
                                                </select>
                                            )}
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-slate-700 mb-1">Tipo</label>
                                            <select 
                                                value={editingItem.tipo || 'aluguel'} 
                                                onChange={(e) => setEditingItem({...editingItem, tipo: e.target.value})} 
                                                className="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white" 
                                            >
                                                <option value="aluguel">Aluguel</option>
                                                <option value="aluguel_venda">Aluguel e Venda</option>
                                                <option value="venda">Venda</option>
                                            </select>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-semibold text-slate-700 mb-1">Código</label>
                                                <input 
                                                    type="text" 
                                                    value={editingItem.codigo} 
                                                    onChange={(e) => setEditingItem({...editingItem, codigo: e.target.value})} 
                                                    className="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 uppercase" 
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-semibold text-slate-700 mb-1">Data</label>
                                                <input 
                                                    type="date" 
                                                    value={editingItem.data} 
                                                    onChange={(e) => setEditingItem({...editingItem, data: e.target.value})} 
                                                    className="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" 
                                                />
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-semibold text-slate-700 mb-1">Registro</label>
                                                <select 
                                                    value={editingItem.registrationType || 'primeiro_registro'} 
                                                    onChange={(e) => setEditingItem({...editingItem, registrationType: e.target.value})} 
                                                    className="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white" 
                                                >
                                                    <option value="primeiro_registro">1º Registro</option>
                                                    <option value="atualizacao">Atualização</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-semibold text-slate-700 mb-1">Disponibilidade</label>
                                                <select 
                                                    value={editingItem.availability || 'disponivel'} 
                                                    onChange={(e) => setEditingItem({...editingItem, availability: e.target.value})} 
                                                    className="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white" 
                                                >
                                                    <option value="disponivel">Disponível</option>
                                                    <option value="indisponivel">Indisponível</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex gap-3 mt-8">
                                        <button onClick={() => setEditingItem(null)} className="flex-1 bg-slate-100 text-slate-700 py-2.5 rounded-xl font-semibold hover:bg-slate-200 transition">Cancelar</button>
                                        <button onClick={handleSaveEdit} className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-semibold hover:bg-blue-700 transition shadow-sm">Salvar Alterações</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        <ConfirmModal 
                            isOpen={!!deletingItem}
                            title="Excluir Captação"
                            message={`Deseja realmente apagar o registro do imóvel ${deletingItem?.codigo}? Esta ação não pode ser desfeita.`}
                            btnConfirm="Sim, Excluir"
                            btnCancel="Cancelar"
                            type="danger"
                            onCancel={() => setDeletingItem(null)}
                            onConfirm={handleDeleteItem}
                        />
                    </div>
                </div>
            );
        };

        const Finance = ({ captures, payments, brokers, user, showToast, dataInicio, setDataInicio, dataFim, setDataFim, userProfile }) => {
            const [selectedBroker, setSelectedBroker] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [deletingItem, setDeletingItem] = useState(null);
            const [statusFilter, setStatusFilter] = useState('todos');
            const [currentPage, setCurrentPage] = useState(1);
            const [selectedPayments, setSelectedPayments] = useState([]);
            const [editingPayment, setEditingPayment] = useState(null);
            const [newPaymentValue, setNewPaymentValue] = useState('');
            
            // State for new payment modal
            const [selectedCapture, setSelectedCapture] = useState('');
            const [showPaymentConfirm, setShowPaymentConfirm] = useState(false);
            const [valor, setValor] = useState('');
            const [captureSearchTerm, setCaptureSearchTerm] = useState('');
            const [captureSearchStartDate, setCaptureSearchStartDate] = useState(getDefaultStartDate());
            const [captureSearchEndDate, setCaptureSearchEndDate] = useState(getDefaultEndDate());
            
            const handleAddNewPayment = () => {
                setSelectedCapture('');
                setValor('');
                setCaptureSearchTerm('');
                setShowPaymentConfirm(false);
            };

            const handleClosePaymentModal = () => {
                setShowPaymentConfirm(false);
                setIsModalOpen(false);
                // also reset fields
                setSelectedCapture('');
                setValor('');
                setCaptureSearchTerm('');
            };

            const filteredPayments = useMemo(() => {
                return payments.filter(p => {
                    const matchDate = p.dataRegistro >= dataInicio && p.dataRegistro <= dataFim;
                    const matchBroker = selectedBroker 
                        ? (p.corretor === selectedBroker || p.secondCorretor === selectedBroker)
                        : true;
                    const matchStatus = statusFilter === 'todos' ? true : p.status === statusFilter;
                    return matchDate && matchBroker && matchStatus;
                }).sort((a, b) => new Date(b.dataRegistro) - new Date(a.dataRegistro));
            }, [payments, dataInicio, dataFim, selectedBroker, statusFilter]);

            const itemsPerPage = 10;
            const totalPages = Math.ceil(filteredPayments.length / itemsPerPage);

            const paginatedPayments = useMemo(() => {
                return filteredPayments.slice(
                    (currentPage - 1) * itemsPerPage,
                    currentPage * itemsPerPage
                );
            }, [filteredPayments, currentPage]);

            useEffect(() => {
                setCurrentPage(1);
            }, [dataInicio, dataFim, selectedBroker, statusFilter]);

            const handleUpdatePaymentValue = async () => {
                if (!editingPayment || !newPaymentValue) {
                    showToast("Informe um valor válido.", "error");
                    return;
                }
                const numValor = parseFloat(newPaymentValue.replace(',', '.'));
                if (isNaN(numValor) || numValor <= 0) {
                    showToast("O valor deve ser um número maior que zero.", "error");
                    return;
                }

                try {
                    if (!user) return;
                    const docRef = window.doc(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments', editingPayment.id);
                    await window.updateDoc(docRef, {
                        valor: numValor,
                        status: 'A pagar',
                        lastModifiedBy: user.email
                    });
                    await logAudit(user, "Atualização de Valor de Pagamento", `Captação Cód: ${editingPayment.codigo}, Novo Valor: ${formatMoney(numValor)}`);
                    setEditingPayment(null);
                    setNewPaymentValue('');
                    showToast("Valor do pagamento atualizado com sucesso!", "success");
                } catch (err) {
                    showToast("Erro ao atualizar o valor.", "error");
                }
            };

            const handleSelectPayment = (paymentId) => {
                setSelectedPayments(prev =>
                    prev.includes(paymentId)
                        ? prev.filter(id => id !== paymentId)
                        : [...prev, paymentId]
                );
            };

            const handleSelectAll = () => {
                const allPayableIds = filteredPayments
                    .filter(p => p.status === 'A pagar')
                    .map(p => p.id);

                if (selectedPayments.length === allPayableIds.length) {
                    setSelectedPayments([]);
                } else {
                    setSelectedPayments(allPayableIds);
                }
            };

            const handleBulkPay = async () => {
                if (selectedPayments.length === 0) {
                    showToast("Nenhum pagamento selecionado.", "error");
                    return;
                }

                try {
                    if (!user) return;
                    const paymentDate = new Date().toISOString().split('T')[0];
                    for (const paymentId of selectedPayments) {
                        const docRef = window.doc(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments', paymentId);
                        await window.updateDoc(docRef, {
                            status: 'Paga',
                            dataPagamento: paymentDate,
                            lastModifiedBy: user.email
                        });
                    }
                    await logAudit(user, "Pagamento em Lote", `Pagou ${selectedPayments.length} captações.`);
                    setSelectedPayments([]);
                    showToast(`${selectedPayments.length} pagamentos foram marcados como 'Pagos'.`, "success");
                } catch (err) {
                    showToast("Erro ao processar o pagamento em lote.", "error");
                }
            };


            const summary = useMemo(() => {
                return filteredPayments.reduce((acc, p) => {
                    let valorParaSomar = p.valor;

                    // Se um corretor específico está filtrado e a captação foi dividida,
                    // atribui apenas metade do valor para o resumo desse corretor.
                    if (selectedBroker && p.hasSecondBroker) {
                        valorParaSomar = p.valor / 2;
                    }

                    if (p.status === 'A pagar') {
                        acc.aPagar += valorParaSomar;
                    } else if (p.status === 'Paga') {
                        acc.paga += valorParaSomar;
                    }
                    return acc;
                }, { aPagar: 0, paga: 0 });
            }, [filteredPayments, selectedBroker]);

            const filteredCapturesForSelect = useMemo(() => {
                const term = captureSearchTerm.toLowerCase();
                return captures.filter(c => {
                    const matchTerm = (c.codigo && c.codigo.toLowerCase().includes(term)) ||
                                      (c.corretor && c.corretor.toLowerCase().includes(term));
                    const matchDate = (!captureSearchStartDate || c.data >= captureSearchStartDate) && 
                                      (!captureSearchEndDate || c.data <= captureSearchEndDate);
                    
                    return matchTerm && matchDate;
                }).sort((a,b) => new Date(b.data) - new Date(a.data));
            }, [captures, captureSearchTerm, captureSearchStartDate, captureSearchEndDate]);

            const handleAddPayment = async (e) => {
                e.preventDefault();
                if (!selectedCapture || !valor) {
                    showToast("Selecione a captação e informe o valor.", "error");
                    return;
                }
                const numValor = parseFloat(valor.replace(',', '.'));
                if (isNaN(numValor) || numValor <= 0) {
                    showToast("Valor inválido.", "error");
                    return;
                }
                const cap = captures.find(c => c.id === selectedCapture);
                if (!cap) return;

                try {
                    if (!user) return;
                    const payRef = window.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments');
                    await window.addDoc(payRef, {
                        captureId: cap.id,
                        codigo: cap.codigo,
                        corretor: cap.corretor,
                        dataCaptacao: cap.data,
                        secondCorretor: cap.secondCorretor || null, // Salva o segundo corretor
                        hasSecondBroker: !!cap.secondCorretor, // Indica se tem segundo corretor
                        tipoContrato: cap.tipo || 'aluguel',
                        valor: numValor,
                        status: 'A pagar',
                        dataRegistro: new Date().toISOString().split('T')[0],
                        createdAt: new Date().toISOString(),
                        createdBy: user.email
                    });
                    
                    await logAudit(user, "Criação de Lançamento Financeiro", `Captação Cód: ${cap.codigo}, Valor: ${formatMoney(numValor)}`);
                    setShowPaymentConfirm(true);
                    showToast("Lançamento financeiro criado com sucesso!", "success");
                } catch (err) {
                    showToast("Erro ao lançar pagamento.", "error");
                }
            };

            const toggleStatus = async (payment) => {
                try {
                    if (!user) return;
                    const newStatus = payment.status === 'A pagar' ? 'Paga' : 'A pagar';
                    const updateData = {
                        status: newStatus,
                        lastModifiedBy: user.email,
                        dataPagamento: newStatus === 'Paga' ? new Date().toISOString().split('T')[0] : null
                    };
                    const docRef = window.doc(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments', payment.id);
                    await window.updateDoc(docRef, updateData);
                    await logAudit(user, "Alteração de Status de Pagamento", `Captação Cód: ${payment.codigo}, Novo Status: ${newStatus}`);
                    showToast(`Status atualizado para ${newStatus}.`, "success");
                } catch (err) {
                    showToast("Erro ao atualizar status.", "error");
                }
            };

            const exportPaidPDF = async (currentUser) => {
                if (filteredPayments.length === 0) {
                    showToast("Nenhum dado para exportar.", "error");
                    return;
                }
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    
                    doc.setFontSize(16);
                    doc.text('Relatório Financeiro - Captações PAGAS', 14, 20);
                    doc.setFontSize(11);
                    doc.text(`Período: ${formatDateToBR(dataInicio)} a ${formatDateToBR(dataFim)}`, 14, 28);
                    doc.setFontSize(10);
                    doc.setTextColor('#64748b');
                    doc.text(`Exportado por: ${currentUser?.email || 'Usuário desconhecido'}`, 14, 34);
                    
                    const paidOnly = filteredPayments.filter(p => p.status === 'Paga');
                    
                    if (paidOnly.length === 0) {
                        showToast("Não há lançamentos com status 'Paga' para exportar.", "info");
                        return;
                    }

                    const grouped = {};
                    paidOnly.forEach(payment => {
                        const valuePerBroker = payment.hasSecondBroker ? payment.valor / 2 : payment.valor;

                        if (!grouped[payment.corretor]) grouped[payment.corretor] = [];
                        grouped[payment.corretor].push({ ...payment, valor: valuePerBroker });

                        if (payment.secondCorretor) {
                            if (!grouped[payment.secondCorretor]) grouped[payment.secondCorretor] = [];
                            grouped[payment.secondCorretor].push({ ...payment, valor: valuePerBroker });
                        }
                    });

                    let currentY = 40;
                    const totalGeralPago = paidOnly.reduce((sum, p) => sum + p.valor, 0);
                    const sortedBrokers = Object.keys(grouped).sort();

                    for (const brokerName of sortedBrokers) {
                        const pays = grouped[brokerName];
                        if (currentY > 250) { doc.addPage(); currentY = 20; }

                        doc.setFontSize(12);
                        doc.setTextColor('#16a34a'); // Green
                        doc.text(`Corretor: ${brokerName}`, 14, currentY);
                        doc.setTextColor('#000000');

                        const tableData = pays.map(p => [ p.codigo, p.tipoContrato === 'venda' ? 'Venda' : p.tipoContrato === 'aluguel_venda' ? 'Aluguel/Venda' : 'Aluguel', formatDateToBR(p.dataCaptacao), formatDateToBR(p.dataPagamento), formatMoney(p.valor) ]);
                        const subTotal = pays.reduce((sum, p) => sum + p.valor, 0);
                        
                        tableData.push([{ content: 'TOTAL PAGO AO CORRETOR', colSpan: 4, styles: { fontStyle: 'bold', halign: 'right' } }, { content: formatMoney(subTotal), styles: { fontStyle: 'bold' } }]);

                        doc.autoTable({ startY: currentY + 4, head: [['Cód.', 'Tipo', 'Data Cap.', 'Data Pag.', 'Valor Pago']], body: tableData, theme: 'grid', headStyles: { fillColor: [22, 163, 74] }, styles: { fontSize: 9 }, margin: { bottom: 15 } });
                        
                        currentY = doc.lastAutoTable.finalY + 15;
                    }
                    
                    doc.setFontSize(12);
                    doc.text(`TOTAL GERAL PAGO NO PERÍODO: ${formatMoney(totalGeralPago)}`, 14, currentY);
                    
                    const formattedDate = `${dataInicio}_${dataFim}`;
                    doc.save(`lancamentos_pagos_${formattedDate}.pdf`);
                    await logAudit(currentUser, "Exportação de PDF", `Relatório Financeiro (Pagos). Período: ${formatDateToBR(dataInicio)} a ${formatDateToBR(dataFim)}`);
                    showToast("Relatório de Pagos gerado com sucesso!", "success");
                } catch(e) {
                    console.error("Erro ao gerar PDF de pagos:", e);
                    showToast("Erro ao gerar PDF.", "error");
                }
            };

            const exportPDF = async (currentUser) => {
                if (filteredPayments.length === 0) {
                    showToast("Nenhum dado para exportar.", "error");
                    return;
                }
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    
                    doc.setFontSize(16);
                    doc.text('Relatório Financeiro - Captações A PAGAR', 14, 20);
                    doc.setFontSize(11);
                    doc.text(`Período: ${formatDateToBR(dataInicio)} a ${formatDateToBR(dataFim)}`, 14, 28);
                    doc.setFontSize(10);
                    doc.setTextColor('#64748b'); // Corrigido para string hexadecimal (cinza)
                    doc.text(`Exportado por: ${currentUser?.email || 'Usuário desconhecido'}`, 14, 34);
                    
                    const aPagarOnly = filteredPayments.filter(p => p.status === 'A pagar');
                    
                    if (aPagarOnly.length === 0) {
                        showToast("Não há lançamentos com status 'A pagar' para exportar.", "info");
                        return;
                    }

                    const grouped = {};
                    aPagarOnly.forEach(payment => {
                        const valuePerBroker = payment.secondCorretor ? payment.valor / 2 : payment.valor;

                        // Add to primary broker
                        if (!grouped[payment.corretor]) grouped[payment.corretor] = [];
                        grouped[payment.corretor].push({ ...payment, valor: valuePerBroker });

                        // Add to second broker if exists
                        if (payment.secondCorretor) {
                            if (!grouped[payment.secondCorretor]) grouped[payment.secondCorretor] = [];
                            grouped[payment.secondCorretor].push({ ...payment, corretor: payment.secondCorretor, valor: valuePerBroker });
                        }
                    });

                    let currentY = 40;
                    const totalGeralAPagar = aPagarOnly.reduce((sum, p) => sum + p.valor, 0);

                    const sortedBrokers = Object.keys(grouped).sort();

                    for (const brokerName of sortedBrokers) {
                        const pays = grouped[brokerName];
                        if (currentY > 250) {
                            doc.addPage();
                            currentY = 20;
                        }

                        doc.setFontSize(12);
                        doc.setTextColor('#2563eb'); // Corrigido para string hexadecimal
                        doc.text(`Corretor: ${brokerName}`, 14, currentY);
                        doc.setTextColor('#000000'); // Garante que seja string hexadecimal

                        const tableData = pays.map(p => [
                            p.codigo,
                            p.tipoContrato === 'venda' ? 'Venda' : p.tipoContrato === 'aluguel_venda' ? 'Aluguel/Venda' : 'Aluguel',
                            formatDateToBR(p.dataCaptacao),
                            formatMoney(p.valor) // Already split value
                        ]);
                        
                        const subTotal = pays.reduce((sum, p) => sum + p.valor, 0);

                        doc.autoTable({
                            startY: currentY + 4,
                            head: [['Cód. Captação', 'Tipo', 'Data Captação', 'Valor a Pagar']],
                            body: tableData,
                            theme: 'grid',
                            headStyles: { fillColor: [226, 232, 240], textColor: [15, 23, 42] },
                            styles: { fontSize: 9 },
                            margin: { bottom: 15 }
                        });
                        
                        currentY = doc.lastAutoTable.finalY + 15;
                    }
                    
                    doc.setFontSize(12);
                    doc.text(`TOTAL GERAL A PAGAR: ${formatMoney(totalGeralAPagar)}`, 14, currentY);
                    
                    const formattedDate = `${dataInicio}_${dataFim}`;
                    doc.save(`lancamentos_${formattedDate}.pdf`);
                    await logAudit(currentUser, "Exportação de PDF", `Relatório Financeiro. Período: ${formatDateToBR(dataInicio)} a ${formatDateToBR(dataFim)}`);
                    showToast("Relatório de A Pagar gerado com sucesso!", "success");
                } catch(e) {
                    showToast("Erro ao gerar PDF.", "error");
                }
            };

            return (
                <React.Fragment>
                    <div className="max-w-7xl mx-auto slide-up">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                        <div className="bg-amber-50 border border-amber-200 p-4 rounded-xl shadow-sm">
                            <p className="text-amber-800 text-sm font-semibold">Total a Pagar (Período)</p>
                            <p className="text-2xl font-black text-amber-900">{formatMoney(summary.aPagar)}</p>
                        </div>
                        <div className="bg-green-50 border border-green-200 p-4 rounded-xl shadow-sm">
                            <p className="text-green-800 text-sm font-semibold">Total Já Pago</p>
                            <p className="text-2xl font-black text-green-900">{formatMoney(summary.paga)}</p>
                        </div>
                    </div>

                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                        <div className="border-b border-slate-200 pb-6 mb-8">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                                    <Icons.DollarSign /> Captações a Pagar
                                </h2>
                                <p className="text-slate-500 text-sm mt-1">Gerencie os lançamentos e pagamentos financeiros das captações.</p>
                            </div>
                            <div className="flex flex-wrap items-center gap-3 mt-6">
                                <div className="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 w-full sm:w-auto">
                                    <span className="text-sm text-slate-500 mr-2">De:</span>
                                    <input type="date" value={dataInicio} onChange={(e) => setDataInicio(e.target.value)} className="outline-none bg-transparent w-full sm:w-32 font-medium" />
                                    <span className="text-sm text-slate-500 mx-2">Até:</span>
                                    <input type="date" value={dataFim} onChange={(e) => setDataFim(e.target.value)} className="outline-none bg-transparent w-full sm:w-32 font-medium" />
                                </div>
                                <select value={selectedBroker} onChange={(e) => setSelectedBroker(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none font-medium w-full sm:w-auto flex-grow sm:flex-grow-0">
                                    <option value="">Todos os Corretores</option>
                                    {brokers.map(b => <option key={b.id} value={b.name}>{b.name}</option>)}
                                </select>
                                <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none font-medium w-full sm:w-auto flex-grow sm:flex-grow-0">
                                    <option value="todos">Todos os Status</option>
                                    <option value="Pendente de Valor">Pendente de Valor</option>
                                    <option value="A pagar">A Pagar</option>
                                    <option value="Paga">Paga</option>
                                </select>
                            </div>
                            <div className="flex flex-wrap justify-end items-center gap-3 mt-4">
                                {selectedPayments.length > 0 && (
                                    <button onClick={handleBulkPay} className="w-full sm:w-auto flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm transition">
                                        Pagar Selecionados ({selectedPayments.length})
                                    </button>
                                )}
                                {['Administrador', 'Gestor'].includes(userProfile?.role) && (
                                    <button onClick={() => setIsModalOpen(true)} className="flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm transition">
                                        <Icons.Plus /> Lançar Valor
                                    </button>
                                )}
                                <button onClick={() => exportPDF(user)} className="flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm transition">
                                    <Icons.FileText /> PDF (A Pagar)
                                </button>
                                <button onClick={() => exportPaidPDF(user)} className="flex items-center justify-center gap-2 bg-green-800 hover:bg-green-900 text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm transition">
                                    <Icons.FileText /> PDF (Pagos)
                                </button>
                            </div>
                        </div>

                        {filteredPayments.length === 0 ? (
                            <div className="text-center py-16 text-slate-500 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                                <Icons.DollarSign className="w-10 h-10 mx-auto text-slate-300 mb-3" />
                                <p className="mb-4 text-lg">Nenhum pagamento registrado neste período.</p>
                                {['Administrador', 'Gestor'].includes(userProfile?.role) && (
                                    <button onClick={() => setIsModalOpen(true)} className="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-2 px-6 rounded-lg transition shadow-sm">
                                        Fazer um lançamento agora
                                    </button>
                                )}
                            </div>
                        ) : (
                            <div className="overflow-x-auto border border-slate-200 rounded-xl">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm">
                                            <th className="py-3 px-3">
                                                <input
                                                    type="checkbox"
                                                    onChange={handleSelectAll}
                                                    checked={filteredPayments.filter(p => p.status === 'A pagar').length > 0 && selectedPayments.length === filteredPayments.filter(p => p.status === 'A pagar').length}
                                                />
                                            </th>
                                            <th className="py-3 px-3 font-bold">Captação (Cód)</th>
                                            <th className="py-3 px-3 font-bold">Tipo</th>

                                    <tbody className="text-sm">

                                                        {
                                                            p.status === 'Paga' ? <Icons.CheckCircle className="w-4 h-4" /> :
                                                            p.status === 'A pagar' ? <Icons.DollarSign className="w-4 h-4" /> :
                                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>

                                                <td className="py-3 px-3 text-right">

                        {totalPages > 1 && (

                                    Próxima
                                </button>
                            </div>
                        )}
                    </div>
                </div>

                <ConfirmModal 
                    isOpen={!!deletingItem}
                    title="Excluir Lançamento Financeiro"
                    message="Deseja realmente remover este lançamento financeiro? Esta ação não pode ser desfeita."
                    btnConfirm="Sim, Excluir"
                    btnCancel="Cancelar"
                    type="danger"
                    onCancel={() => setDeletingItem(null)}
                    onConfirm={async () => {
                        try {
