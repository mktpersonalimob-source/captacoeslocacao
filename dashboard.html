        const getDefaultStartDate = () => {
            const d = new Date();
            return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().split('T')[0];
        };

        const getDefaultEndDate = () => {
            const d = new Date();
            return new Date(d.getFullYear(), d.getMonth() + 1, 0).toISOString().split('T')[0];
        };

        const formatMoney = (value) => {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        };

        const formatDateToBR = (dateString) => {
            if(!dateString) return "";
            const [year, month, day] = dateString.split('-');
            return `${day}/${month}/${year}`;
        };

        const getMonthNameBR = (monthStr) => {
            if (!monthStr) return "";
            const [year, month] = monthStr.split('-');
            const date = new Date(year, parseInt(month) - 1, 1);
            return date.toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
        };

        const logAudit = async (user, action, details) => {
            if (!user || !user.email) {
                console.warn("Audit log skipped: user not available.");
                return;
            }
            try {
                const auditRef = window.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'audit_logs');
                await window.addDoc(auditRef, {
                    userEmail: user.email,
                    action: action,
                    details: details,
                    timestamp: new Date().toISOString()
                });
            } catch (error) {
                console.error("Failed to write audit log:", error);
            }
        };

        const exportAuditPDF = async (currentUser, logs, dataInicio, dataFim, showToast) => {
            if (logs.length === 0) {
                showToast("Nenhum registro de auditoria para exportar.", "error");
                return;
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape' });
            doc.text(`Relatório de Auditoria: ${formatDateToBR(dataInicio)} a ${formatDateToBR(dataFim)}`, 14, 22);

                const querySnapshot = await firebaseApi.getDocs(q);

                    showToast('Já existe uma captação com este código.', 'error');
                    return;

                        observacoes: observacoes.trim(),
                        createdAt: new Date().toISOString(),

                        availability: availability

        const CapturesDashboard = ({ isLoaded, user, brokers, setView, onSelectBroker, showToast, dataInicio, setDataInicio, dataFim, setDataFim, firebaseApi, logAudit }) => {
            const [captures, setCaptures] = useState([]);

            useEffect(() => {

            const brokerStats = useMemo(() => {
                const stats = {};
                const brokerCategoryMap = new Map(brokers.map(b => [b.name, b.category || 'locacao']));

                // Populate stats
                captures.forEach(c => {
                    const involvedBrokers = c.corretores || [c.corretor]; // Compatibilidade com estrutura antiga
                    const contribution = 1 / involvedBrokers.length;

                    involvedBrokers.forEach(brokerName => {
                        const currentKey = brokerName.trim().toUpperCase();
                        if (!stats[currentKey]) {
                            stats[currentKey] = {
                                name: brokerName.trim(), count: 0, aluguelCount: 0,
                                category: brokerCategoryMap.get(brokerName.trim()) || 'locacao',
                                vendaCount: 0, aluguelVendaCount: 0, approvedForMetaCount: 0,
                                metaPrimeiroRegistro: 0, metaAtualizacao: 0
                            };
                        }

                        stats[currentKey].count += contribution;

                        if (c.tipo === 'venda') stats[currentKey].vendaCount += contribution;
                        else if (c.tipo === 'aluguel_venda') stats[currentKey].aluguelVendaCount += contribution;
                        else stats[currentKey].aluguelCount += contribution;

                        const isMetaEligible = c.status === 'aprovado' && c.availability !== 'indisponivel' && c.tipo !== 'venda';
                        if (isMetaEligible) c.registrationType === 'atualizacao' ? stats[currentKey].metaAtualizacao += contribution : stats[currentKey].metaPrimeiroRegistro += contribution;
                    });
                });

                if (showAllBrokers) {
                    brokers.forEach(broker => {
                        const key = broker.name.toUpperCase();
                        if (!stats[key]) {
                            stats[key] = {
                                name: broker.name, count: 0, aluguelCount: 0, category: broker.category || 'locacao',
                                vendaCount: 0, aluguelVendaCount: 0, approvedForMetaCount: 0, metaPrimeiroRegistro: 0, metaAtualizacao: 0
                            };
                        }
                    });
                }

                // Calculate final meta score for each broker
                Object.keys(stats).forEach(key => {
                    const broker = stats[key];
                    const atualizacaoBonus = broker.metaAtualizacao >= 5 ? 3 : 0;
                    broker.approvedForMetaCount = broker.metaPrimeiroRegistro + atualizacaoBonus;
                });

                return Object.values(stats).sort((a, b) => b.count - a.count);
            }, [captures, brokers, showAllBrokers]);

            const topBroker = brokerStats.length > 0 ? brokerStats[0] : null;

            const handleCategoryToggle = (category) => {
                setSelectedReportCategories(prev => ({ ...prev, [category]: !prev[category] }));

            const exportMonthlyPDF = async (currentUser, categoriesToInclude) => {
                const brokersToReport = brokerStats.filter(b => categoriesToInclude[b.category]);

                if (brokersToReport.length === 0) {
                    showToast("Não há dados para exportar neste período.", "error");
                    return;
                }
                setShowReportModal(false);
                try {
                    const meta = 6;
                    const { jsPDF } = jspdf;
                    const doc = new jsPDF({ orientation: 'landscape' });
                    
                    const title = `Relatório de Captações: ${formatDateToBR(dataInicio)} a ${formatDateToBR(dataFim)}`;
                    
                    doc.setFontSize(16);
                    doc.text(title, 14, 22);
                    doc.setFontSize(10);
                    doc.setTextColor('#64748b'); // Corrigido para string hexadecimal (cinza)
                    doc.text(`Exportado por: ${currentUser?.email || 'Usuário desconhecido'}`, 14, 28);
                    
                    const tableData = brokersToReport.map(b => [ 
                        b.name,
                        b.aluguelCount.toFixed(1),
                        b.aluguelVendaCount.toFixed(1),
                        b.vendaCount.toFixed(1),
                        b.count.toFixed(1),
                        `${b.approvedForMetaCount.toFixed(1)} / ${meta}`,
                        b.approvedForMetaCount >= meta ? 'Atingida' : 'Não Atingida'
                    ]);
                    const totalAluguel = brokersToReport.reduce((sum, b) => sum + b.aluguelCount, 0);
                    const totalAluguelVenda = brokersToReport.reduce((sum, b) => sum + b.aluguelVendaCount, 0);
                    const totalVenda = brokersToReport.reduce((sum, b) => sum + b.vendaCount, 0);
                    const totalCount = brokersToReport.reduce((sum, b) => sum + b.count, 0);
                    tableData.push(['TOTAL', totalAluguel.toFixed(1), totalAluguelVenda.toFixed(1), totalVenda.toFixed(1), totalCount.toFixed(1), '', '']);
                    
                    doc.autoTable({
                        startY: 35,
                        head: [['Corretor', 'Aluguel', 'Aluguel/Venda', 'Venda', 'Total', 'Meta', 'Status Meta']],
                        body: tableData,
                        theme: 'grid',

                    const formattedDate = `${dataInicio}_${dataFim}`;
                    doc.save(`captacoes_resumo_${formattedDate}.pdf`);
                    await logAudit(currentUser, "Exportação de PDF", `Relatório de Desempenho (Resumo). Período: ${formatDateToBR(dataInicio)} a ${formatDateToBR(dataFim)}`);

            return (
                <React.Fragment>

                            </div>
                        </div>

                        <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex items-center justify-between">
                            <div>
                                <p className="text-slate-500 font-medium mb-1">Corretor Destaque</p>

                                    {topBroker ? topBroker.name : '-'}
                                </h3>
                                {topBroker && <p className="text-sm text-green-600 font-medium mt-1">{topBroker.count.toFixed(1)} captações</p>}
                            </div>
                            <div className="bg-amber-100 text-amber-600 p-3 rounded-full">
                                <Icons.Award />
                            </div>
                        </div>
                    </div> 

                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 mt-6">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-slate-100 pb-6">
                            <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                <Icons.Users /> Desempenho da Equipe
                            </h2>
                            
                            <div className="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                                <div className="flex-1 sm:flex-none flex items-center bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus-within:ring-2 focus-within:ring-blue-500 transition">
                                    <Icons.Calendar />
                                    <span className="text-sm text-slate-500 ml-2 mr-1">De:</span>
                                    <input 
                                        type="date" 
                                        value={dataInicio}
                                        onChange={(e) => setDataInicio(e.target.value)}
                                        className="outline-none bg-transparent text-slate-700 font-medium w-full sm:w-32"
                                    />
                                    <span className="text-sm text-slate-500 mx-2">Até:</span>
                                    <input 
                                        type="date" 
                                        value={dataFim}
                                        onChange={(e) => setDataFim(e.target.value)}
                                        className="outline-none bg-transparent text-slate-700 font-medium w-full sm:w-32"
                                    />
                                </div>
                                <label className="flex items-center gap-2 cursor-pointer">
                                    <input 
                                        type="checkbox" 
                                        checked={showAllBrokers} onChange={(e) => setShowAllBrokers(e.target.checked)} 
                                        className="h-4 w-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500"

                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-slate-600" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clipRule="evenodd" /></svg>
                                </button>
                                <button

                                    >

                    {showReportModal && (

                                        <span className="ml-3 font-semibold text-slate-700">Locação</span>
                                    </label>
                                    <label className="flex items-center p-3 bg-slate-50 rounded-lg border border-slate-200 hover:bg-slate-100 cursor-pointer">
                                        <input type="checkbox" checked={selectedReportCategories.lancamento} onChange={() => handleCategoryToggle('lancamento')} className="h-5 w-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500" />
                                        <span className="ml-3 font-semibold text-slate-700">Lançamento</span>
                                    </label>
                                    <label className="flex items-center p-3 bg-slate-50 rounded-lg border border-slate-200 hover:bg-slate-100 cursor-pointer">
                                        <input type="checkbox" checked={selectedReportCategories.terceiro} onChange={() => handleCategoryToggle('terceiro')} className="h-5 w-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500" />
                                        <span className="ml-3 font-semibold text-slate-700">Terceiro</span>

                                <div className="flex gap-3">
                                    <button 
                                        onClick={() => setShowReportModal(false)} 
                                        className="flex-1 bg-slate-100 text-slate-700 py-2.5 rounded-xl font-semibold hover:bg-slate-200 transition"
                                    >
                                        Cancelar
                                    </button>
                                    <button 
                                        onClick={() => exportMonthlyPDF(user, selectedReportCategories)}
                                        className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-semibold hover:bg-blue-700 transition shadow-sm"
                                    >
                                        Gerar PDF
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </React.Fragment>
            );
        };

        const BrokerDetails = ({ brokerName, onBack, user, brokers, showToast, dataInicio, setDataInicio, dataFim, setDataFim, firebaseApi, logAudit }) => {
            const [captures, setCaptures] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [statusFilter, setStatusFilter] = useState('todos');
            const [editingItem, setEditingItem] = useState(null);
            const [deletingItem, setDeletingItem] = useState(null);
            const [currentPage, setCurrentPage] = useState(1);
            const [loading, setLoading] = useState(true);

            const brokerInfo = useMemo(() => brokers.find(b => b.name === brokerName), [brokers, brokerName]);
            
            useEffect(() => {
                if (!user || !brokerName || !dataInicio || !dataFim) return;
                setLoading(true);

                const { query, collection, where, onSnapshot, or, and } = firebaseApi;
                const capturesRef = collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'captures');
                
                const q = query(capturesRef, 
                    and(
                        or(
                            where("corretores", "array-contains", brokerName),
                            where("corretor", "==", brokerName)
                        ),
                        where("data", ">=", dataInicio),
                        where("data", "<=", dataFim)
                    ));

                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setCaptures(data);
                    setLoading(false);
                }, (error) => {
                    console.error("Error fetching broker captures:", error);
                    showToast("Erro ao carregar captações do corretor. Verifique o console para criar índices.", "error");
                    setLoading(false);
                });

                return () => unsubscribe();
            }, [user, brokerName, dataInicio, dataFim]);

            const filteredData = useMemo(() => {
                return captures.filter(c => {
                    const matchStatus = statusFilter === 'todos' || (c.status || 'pendente') === statusFilter;
                    
                    const term = searchTerm.toLowerCase();
                    const matchSearch = term === '' || (c.codigo && c.codigo.toLowerCase().includes(term));
                    return matchSearch && matchStatus;
                }).sort((a, b) => new Date(b.data) - new Date(a.data));
            }, [captures, searchTerm, statusFilter]);

            useEffect(() => {
                setCurrentPage(1);
            }, [filteredData]);

            const itemsPerPage = 10;
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);

            const paginatedData = useMemo(() => {
                return filteredData.slice(
                    (currentPage - 1) * itemsPerPage,
                    currentPage * itemsPerPage
                );
            }, [filteredData, currentPage]);

            const handleToggleStatus = async (item) => {
                const newStatus = (item.status || 'pendente') === 'aprovado' ? 'pendente' : 'aprovado';
                
                // Se estiver aprovando, cria os lançamentos financeiros
                if (newStatus === 'aprovado') {
                    const paymentsRef = firebaseApi.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments');
                    const involvedBrokers = item.corretores || [item.corretor];

                    for (const brokerName of involvedBrokers) {
                        await firebaseApi.addDoc(paymentsRef, {
                            captureId: item.id,
                            codigo: item.codigo,
                            corretor: brokerName,
                            todosCorretores: involvedBrokers,
                            dataCaptacao: item.data,
                            tipoContrato: item.tipo,
                            valor: 0,
                            status: 'Pendente de Valor',
                            dataRegistro: new Date().toISOString().split('T')[0],
                            createdAt: new Date().toISOString(),
                            createdBy: user.email
                        });
                    }
                }

                try {
                    if (!user) return;
                    const docRef = firebaseApi.doc(window.db, 'artifacts', window.__app_id, 'public', 'data', 'captures', item.id);
                    await firebaseApi.updateDoc(docRef, { status: newStatus, lastModifiedBy: user.email });
                    await logAudit(user, "Alteração de Status da Captação", `Código: ${item.codigo}, Novo Status: ${newStatus}`);
                    showToast(`Status da captação ${item.codigo} alterado para ${newStatus}.`, "success");
                } catch (err) {
                    showToast("Erro ao alterar o status.", "error");
                }
            };

            const exportBrokerPDF = async (currentUser) => {
                if (filteredData.length === 0) {
                    showToast("Não há dados para exportar neste período.", "error");
                    return;
                }
                try {
                    // Verificação de segurança para garantir que a biblioteca jsPDF foi carregada
                    if (!window.jspdf || !window.jspdf.jsPDF) {
                        showToast("A biblioteca de PDF ainda não carregou. Tente novamente em um instante.", "error");
                        console.error("jsPDF library not available on window.");
                        return;
                    }

                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    
                    doc.setFontSize(16);
                    doc.text(`Captações - Corretor: ${brokerName}`, 14, 22);
                    doc.setFontSize(12);
                    doc.text(`Período: ${formatDateToBR(dataInicio)} a ${formatDateToBR(dataFim)}`, 14, 30);
                    doc.setFontSize(10);
                    doc.setTextColor('#64748b'); // Corrigido para string hexadecimal (cinza)
                    doc.text(`Exportado por: ${currentUser?.email || 'Usuário desconhecido'}`, 14, 36);
                    
                    const metaEligibleCaptures = filteredData.filter(c => {
                        const involvedBrokers = c.corretores || [c.corretor];
                        return c.status === 'aprovado' && c.availability !== 'indisponivel' && c.tipo !== 'venda' && involvedBrokers.includes(brokerName);
                    });

                    const primeiroRegistroCount = metaEligibleCaptures.filter(c => (c.registrationType !== 'atualizacao')).length / (metaEligibleCaptures[0]?.corretores?.length || 1);
                    const atualizacaoCount = metaEligibleCaptures.filter(c => c.registrationType === 'atualizacao').length / (metaEligibleCaptures[0]?.corretores?.length || 1);

                    let metaScore = primeiroRegistroCount;
                    if (atualizacaoCount >= 5) {
                        metaScore += 3;
                    }
                    const meta = 6;
                    const metaAtingida = metaScore >= meta;

                    const totalCaptacoes = filteredData.length;
                    const totalAluguel = filteredData.filter(c => c.tipo === 'aluguel' || c.tipo === 'locacao' || typeof c.tipo === 'undefined').length;
                    const totalAluguelVenda = filteredData.filter(c => c.tipo === 'aluguel_venda').length; 
                    const totalVenda = filteredData.filter(c => c.tipo === 'venda').length;

                    doc.setFont('helvetica', 'bold');
                    doc.text(`Total de Captações: ${totalCaptacoes} (Aluguel: ${totalAluguel}, Al-Vd: ${totalAluguelVenda}, Venda: ${totalVenda})`, 14, 46);

                    doc.setFont('helvetica', 'normal');
                    doc.setTextColor(metaAtingida ? '#22c55e' : '#ef4444');
                    doc.text(`Meta (${meta} pts): ${metaAtingida ? 'ATINGIDA' : 'NÃO ATINGIDA'} (${metaScore.toFixed(2)} de ${meta})`, 14, 52);
                    
                    // Reset text color
                    doc.setTextColor('#000000'); // Garante que seja string hexadecimal

                    const tableData = filteredData.map(item => [
                        item.codigo, 
                        item.tipo === 'venda' ? 'Venda' : (item.tipo === 'aluguel_venda' ? 'Aluguel/Venda' : 'Aluguel'), 
                        item.status === 'aprovado' ? 'Aprovado' : 'Pendente',

                        item.registrationType === 'atualizacao' ? 'Atualização' : '1º Registro',
                        item.availability === 'indisponivel' ? 'Indisponível' : 'Disponível'

                        startY: 60,
                        head: [['Código', 'Tipo', 'Status', 'Data', 'Registro', 'Disponibilidade']],
                        body: tableData,
                        theme: 'grid',
                        headStyles: { fillColor: [37, 99, 235] },
                        styles: { fontSize: 10 }

                    doc.save(`captacoes_${brokerName.replace(/\s+/g, '_')}_${formattedDate}.pdf`);

        const Finance = ({ isLoaded, brokers, user, showToast, dataInicio, setDataInicio, dataFim, setDataFim, firebaseApi, logAudit, userProfile }) => {
            const [payments, setPayments] = useState([]);
            const [captures, setCaptures] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedBroker, setSelectedBroker] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [deletingItem, setDeletingItem] = useState(null);
            const [brokerCategoryFilter, setBrokerCategoryFilter] = useState('todos');
            const [statusFilter, setStatusFilter] = useState('todos');
            const [currentPage, setCurrentPage] = useState(1);
            const [selectedToLaunch, setSelectedToLaunch] = useState([]);
            const [editingPayment, setEditingPayment] = useState(null);
            const [newPaymentValue, setNewPaymentValue] = useState('');
            
            // State for new payment modal
            const [selectedCapture, setSelectedCapture] = useState('');
            const [showPaymentConfirm, setShowPaymentConfirm] = useState(false);
            const [valor, setValor] = useState('');
            const [captureSearchTerm, setCaptureSearchTerm] = useState('');
            const [captureSearchStartDate, setCaptureSearchStartDate] = useState(getDefaultStartDate());
            const [captureSearchEndDate, setCaptureSearchEndDate] = useState(getDefaultEndDate());
            
            const handleAddNewPayment = () => {
                setSelectedCapture('');
                setValor('');
                setCaptureSearchTerm('');
                setShowPaymentConfirm(false);
            };

            const handleClosePaymentModal = () => {
                setShowPaymentConfirm(false);
                setIsModalOpen(false);
                setSelectedCapture('');
                setValor('');
                setCaptureSearchTerm('');
            };

            const fetchData = useCallback(() => {
                if (!user || !dataInicio || !dataFim || !isLoaded) {
                    if (isLoaded) setLoading(false);
                    return;
                }
                setLoading(true);
                const { query, collection, onSnapshot, where } = firebaseApi;
                const paymentsRef = collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments');
                
                const q = query(paymentsRef, where("dataRegistro", ">=", dataInicio), where("dataRegistro", "<=", dataFim));
    
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const allData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setPayments(allData);
                    setLoading(false);
                }, (error) => {
                    console.error("Error fetching payments:", error);
                    showToast("Erro ao carregar pagamentos. Verifique o console para criar índices.", "error");
                    setLoading(false);
                });
    
                return () => unsubscribe();
            }, [user, dataInicio, dataFim, isLoaded, firebaseApi, showToast]);

            useEffect(() => {
                let unsubscribe;
                if (isLoaded) {
                    unsubscribe = fetchData();
                }
                return () => { if (unsubscribe) unsubscribe(); };
            }, [fetchData, isLoaded]);

            useEffect(() => {
                if (!user || !isModalOpen) {
                    setCaptures([]);
                    return;
                };
                const { query, collection, where } = firebaseApi;
                const capturesRef = collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'captures');
                const q = query(capturesRef,
                    where("data", ">=", captureSearchStartDate),
                    where("data", "<=", captureSearchEndDate));
                firebaseApi.getDocs(q).then(snapshot => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setCaptures(data);
                }).catch(err => {
                    console.error("Error fetching captures for modal:", err);
                });
            }, [user, isModalOpen, captureSearchStartDate, captureSearchEndDate]);

            const filteredPayments = useMemo(() => {
                const brokerCategoryMap = new Map(brokers.map(b => [b.name, b.category || 'locacao']));
                return payments.filter(p => {
                    const matchBroker = selectedBroker ? p.corretor === selectedBroker : true;
                    const brokerCategory = brokerCategoryMap.get(p.corretor);
                    const matchCategory = brokerCategoryFilter === 'todos' ? true : brokerCategory === brokerCategoryFilter;
                    const matchStatus = statusFilter === 'todos' ? true : p.status === statusFilter;
                    return matchBroker && matchStatus && matchCategory;
                }).sort((a, b) => new Date(b.dataRegistro) - new Date(a.dataRegistro));
            }, [payments, selectedBroker, statusFilter, brokerCategoryFilter, brokers]);

            useEffect(() => {
                // Reset page to 1 when filters change
                setCurrentPage(1);
            }, [filteredPayments]);

            const itemsPerPage = 10;
            const totalPages = Math.ceil(filteredPayments.length / itemsPerPage);

            const paginatedPayments = useMemo(() => {
                return filteredPayments.slice(
                    (currentPage - 1) * itemsPerPage,
                    currentPage * itemsPerPage
                );
            }, [filteredPayments, currentPage]);

            const handleUpdatePaymentValue = async () => {
                if (!editingPayment || !newPaymentValue) {
                    showToast("Informe um valor válido.", "error");
                    return;
                }
                const numValor = parseFloat(newPaymentValue.replace(',', '.'));
                if (isNaN(numValor) || numValor <= 0) {
                    showToast("O valor deve ser um número maior que zero.", "error");
                    return;
                }

                try {
                    if (!user) return;
                    const docRef = firebaseApi.doc(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments', editingPayment.id);
                    await firebaseApi.updateDoc(docRef, {
                        valor: numValor,
                        status: 'A pagar',
                        lastModifiedBy: user.email
                    });
                    await logAudit(user, "Atualização de Valor de Pagamento", `Captação Cód: ${editingPayment.codigo}, Novo Valor: ${formatMoney(numValor)}`);
                    setEditingPayment(null);
                    setNewPaymentValue('');
                    showToast("Valor do pagamento atualizado com sucesso!", "success");
                } catch (err) {
                    showToast("Erro ao atualizar o valor.", "error");
                }
            };

            useEffect(() => {
                if (!user || !isModalOpen) {
                    setCaptures([]);
                    return;
                };
                const { query, collection, onSnapshot, where } = firebaseApi;
                const capturesRef = collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'captures');
                const q = query(capturesRef,
                    where("data", ">=", captureSearchStartDate),
                    where("data", "<=", captureSearchEndDate));
                firebaseApi.getDocs(q).then(snapshot => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setCaptures(data);
                });
            }, [user, isModalOpen, captureSearchStartDate, captureSearchEndDate]);

            const filteredCapturesForSelect = useMemo(() => {
                const term = captureSearchTerm.toLowerCase();
                return captures.filter(c => {
                    return (c.codigo && c.codigo.toLowerCase().includes(term)) || (c.corretor && c.corretor.toLowerCase().includes(term));
                }).sort((a,b) => new Date(b.data) - new Date(a.data));
            }, [captures, captureSearchTerm, captureSearchStartDate, captureSearchEndDate]);

            const handleAddPayment = async (e) => {
                e.preventDefault();
                if (!selectedCapture || !valor) {
                    showToast("Selecione a captação e informe o valor.", "error");
                    return;
                }
                const numValor = parseFloat(valor.replace(',', '.'));
                if (isNaN(numValor) || numValor <= 0) {
                    showToast("Valor inválido.", "error");
                    return;
                }
                const cap = captures.find(c => c.id === selectedCapture);
                if (!cap) return;

                const involvedBrokers = cap.corretores || (cap.corretor ? [cap.corretor] : []);
                if (involvedBrokers.length === 0) {
                    showToast("A captação selecionada não tem corretores associados.", "error");
                    return;
                }

                try {
                    if (!user) return;
                    const payRef = firebaseApi.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments');
                    
                    for (const brokerName of involvedBrokers) {
                        await firebaseApi.addDoc(payRef, {
                            captureId: cap.id,
                            codigo: cap.codigo,
                            corretor: brokerName,
                            todosCorretores: involvedBrokers,
                            dataCaptacao: cap.data,
                            tipoContrato: cap.tipo || 'aluguel',
                            valor: numValor,
                            status: 'A pagar',
                            dataRegistro: new Date().toISOString().split('T')[0],
                            createdAt: new Date().toISOString(),
                            createdBy: user.email
                        });
                    }
                    
                    await logAudit(user, "Criação de Lançamento Financeiro", `Captação Cód: ${cap.codigo}, Valor: ${formatMoney(numValor)} para ${involvedBrokers.length} corretor(es).`);
                    setShowPaymentConfirm(true);
                    showToast(`Valor a pagar lançado para ${involvedBrokers.length} corretor(es)!`, "success");
                } catch (err) {
                    showToast("Erro ao lançar pagamento.", "error");
                }
            };

            const handleLaunchPayments = async (paymentIds) => {
                if (paymentIds.length === 0) {
                    showToast("Nenhuma comissão selecionada para lançar.", "error");
                    return;
                }
                try {
                    if (!user) return;
                    const launchDate = new Date().toISOString();
                    for (const paymentId of paymentIds) {
                        const docRef = firebaseApi.doc(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments', paymentId);
                        await firebaseApi.updateDoc(docRef, {
                            status: 'Lançado',
                            dataLancamento: launchDate,
                            lastModifiedBy: user.email
                        });
                    }
                    await logAudit(user, "Lançamento de Comissão", `Lançou ${paymentIds.length} comissão(ões) para a carteira.`);
                    setSelectedToLaunch([]);
                    showToast(`${paymentIds.length} comissão(ões) foi/foram lançada(s) para a carteira.`, "success");
                } catch (err) {
                    showToast("Erro ao lançar comissões.", "error");
                }
            };

            const exportPaidPDF = async (currentUser) => {
                if (filteredPayments.length === 0) {
                    showToast("Nenhum dado para exportar.", "error");
                    return;
                }
                try {
                    const { jsPDF } = jspdf;
                    const doc = new jsPDF();
                    
                    doc.setFontSize(16);
                    doc.text('Relatório Financeiro - Captações PAGAS', 14, 20);
                    doc.setFontSize(11);
                    doc.text(`Período: ${formatDateToBR(dataInicio)} a ${formatDateToBR(dataFim)}`, 14, 28);
                    doc.setFontSize(10);
                    doc.setTextColor('#64748b');
                    doc.text(`Exportado por: ${currentUser?.email || 'Usuário desconhecido'}`, 14, 34);
                    
                    const paidOnly = filteredPayments.filter(p => p.status === 'Paga');
                    
                    if (paidOnly.length === 0) {
                        showToast("Não há lançamentos com status 'Paga' para exportar.", "info");
                        return;
                    }

                    const grouped = {};
                    paidOnly.forEach(payment => {
                        if (!grouped[payment.corretor]) grouped[payment.corretor] = [];
                        grouped[payment.corretor].push(payment);
                    });

                    let currentY = 40;
                    const totalGeralPago = paidOnly.reduce((sum, p) => sum + p.valor, 0);
                    const sortedBrokers = Object.keys(grouped).sort();

                    for (const brokerName of sortedBrokers) {
                        const pays = grouped[brokerName];
                        if (currentY > 250) { doc.addPage(); currentY = 20; }

                        doc.setFontSize(12);
                        doc.setTextColor('#16a34a'); // Green
                        doc.text(`Corretor: ${brokerName}`, 14, currentY);
                        doc.setTextColor('#000000');

                        const tableData = pays.map(p => [ p.codigo, p.tipoContrato === 'venda' ? 'Venda' : p.tipoContrato === 'aluguel_venda' ? 'Aluguel/Venda' : 'Aluguel', formatDateToBR(p.dataCaptacao), formatDateToBR(p.dataPagamento), formatMoney(p.valor) ]);
                        const subTotal = pays.reduce((sum, p) => sum + p.valor, 0);
                        
                        tableData.push([{ content: 'TOTAL PAGO AO CORRETOR', colSpan: 4, styles: { fontStyle: 'bold', halign: 'right' } }, { content: formatMoney(subTotal), styles: { fontStyle: 'bold' } }]);

                        doc.autoTable({ startY: currentY + 4, head: [['Cód.', 'Tipo', 'Data Cap.', 'Data Pag.', 'Valor Pago']], body: tableData, theme: 'grid', headStyles: { fillColor: [22, 163, 74] }, styles: { fontSize: 9 }, margin: { bottom: 15 } });
                        
                        currentY = doc.lastAutoTable.finalY + 15;
                    }
                    
                    doc.setFontSize(12);
                    doc.text(`TOTAL GERAL PAGO NO PERÍODO: ${formatMoney(totalGeralPago)}`, 14, currentY);
                    
                    const formattedDate = `${dataInicio}_${dataFim}`;
                    doc.save(`lancamentos_pagos_${formattedDate}.pdf`);
                    await logAudit(currentUser, "Exportação de PDF", `Relatório Financeiro (Pagos). Período: ${formatDateToBR(dataInicio)} a ${formatDateToBR(dataFim)}`);
                    showToast("Relatório de Pagos gerado com sucesso!", "success");
                } catch(e) {
                    console.error("Erro ao gerar PDF de pagos:", e);
                    showToast("Erro ao gerar PDF.", "error");
                }
            };

            const exportPDF = async (currentUser) => {
                if (filteredPayments.length === 0) {
                    showToast("Nenhum dado para exportar.", "error");
                    return;

                try {
                    const { jsPDF } = window.jspdf;

                    doc.setFontSize(16);
                    doc.text('Relatório Financeiro - Captações A PAGAR', 14, 20);
                    doc.setFontSize(11);
                    doc.text(`Período: ${formatDateToBR(dataInicio)} a ${formatDateToBR(dataFim)}`, 14, 28);

                    doc.text(`Exportado por: ${currentUser?.email || 'Usuário desconhecido'}`, 14, 34);

                        return;

                    const grouped = {};

                        grouped[payment.corretor].push(payment);

                    let currentY = 40;

                    const sortedBrokers = Object.keys(grouped).sort();

                            currentY = 20;

                        doc.setFontSize(12);
                        doc.setTextColor('#2563eb'); // Corrigido para string hexadecimal
                        doc.text(`Corretor: ${brokerName}`, 14, currentY);
                        doc.setTextColor('#000000'); // Garante que seja string hexadecimal

                        const tableData = pays.map(p => [
                            p.codigo,

                            formatMoney(p.valor)

                        const subTotal = pays.reduce((sum, p) => sum + p.valor, 0);
                        
                        tableData.push([{ content: 'TOTAL DO CORRETOR', colSpan: 3, styles: { fontStyle: 'bold', halign: 'right' } }, { content: formatMoney(subTotal), styles: { fontStyle: 'bold' } }]);

                        doc.autoTable({
                            startY: currentY + 4,
                            head: [['Cód. Captação', 'Tipo', 'Data Captação', 'Valor a Pagar']],
                            body: tableData,
                            theme: 'grid',
                            headStyles: { fillColor: [226, 232, 240], textColor: [15, 23, 42] },
                            styles: { fontSize: 9 },
                            margin: { bottom: 15 }

                        currentY = doc.lastAutoTable.finalY + 15;
                    }
                    
                    doc.setFontSize(12);
                    doc.text(`TOTAL GERAL A PAGAR: ${formatMoney(totalGeralAPagar)}`, 14, currentY);
                    
                    const formattedDate = `${dataInicio}_${dataFim}`;
                    doc.save(`lancamentos_${formattedDate}.pdf`);
                    await logAudit(currentUser, "Exportação de PDF", `Relatório Financeiro. Período: ${formatDateToBR(dataInicio)} a ${formatDateToBR(dataFim)}`);
                    showToast("Relatório de A Pagar gerado com sucesso!", "success");
                } catch(e) {
                    showToast("Erro ao gerar PDF.", "error");
                }
            };

            return (
                <React.Fragment>
                    <div className="max-w-7xl mx-auto slide-up">
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                        <div className="border-b border-slate-200 pb-6 mb-8">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                                    <Icons.DollarSign /> Captações a Pagar
                                </h2>
                                <p className="text-slate-500 text-sm mt-1">Gerencie os lançamentos e pagamentos financeiros das captações.</p>
                            </div>
                            <div className="flex flex-wrap items-center gap-3 mt-6">
                                <div className="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 w-full sm:w-auto">
                                    <span className="text-sm text-slate-500 mr-2">De:</span>
                                    <input type="date" value={dataInicio} onChange={(e) => setDataInicio(e.target.value)} className="outline-none bg-transparent w-full sm:w-32 font-medium" />
                                    <span className="text-sm text-slate-500 mx-2">Até:</span>
                                    <input type="date" value={dataFim} onChange={(e) => setDataFim(e.target.value)} className="outline-none bg-transparent w-full sm:w-32 font-medium" />
                                </div>
                                <select value={selectedBroker} onChange={(e) => setSelectedBroker(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none font-medium w-full sm:w-auto flex-grow">
                                    <option value="">Todos os Corretores</option>
                                    {brokers.map(b => <option key={b.id} value={b.name}>{b.name}</option>)}
                                </select>
                                <select value={brokerCategoryFilter} onChange={(e) => setBrokerCategoryFilter(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none font-medium w-full sm:w-auto flex-grow">
                                    <option value="todos">Todas as Equipes</option>
                                    <option value="locacao">Locação</option>
                                    <option value="lancamento">Lançamento</option>
                                    <option value="terceiro">Terceiro</option>
                                </select>
                                <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none font-medium w-full sm:w-auto flex-grow">
                                    <option value="todos">Todos os Status</option>
                                    <option value="Pendente de Valor">Pendente</option>
                                    <option value="A pagar">A Lançar</option>
                                    <option value="Lançado">Lançado (Na Carteira)</option>
                                    <option value="Paga">Paga</option>
                                </select>
                                <button onClick={fetchData} className="p-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl transition" title="Atualizar dados">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-slate-600" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clipRule="evenodd" /></svg>
                                </button>
                            </div>
                            <div className="flex flex-wrap justify-end items-center gap-3 mt-4">
                                {selectedToLaunch.length > 0 && (
                                    <button onClick={() => handleLaunchPayments(selectedToLaunch)} className="w-full sm:w-auto flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm transition">
                                        Lançar Selecionados ({selectedToLaunch.length})
                                    </button>
                                )}
                                <button onClick={() => setIsModalOpen(true)} className="w-full sm:w-auto flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm transition">
                                <Icons.Plus /> Lançar Pagamento
                            </button>
                            <button onClick={() => exportPDF(user)} className="flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm transition">
                                    <Icons.FileText /> PDF (A Pagar)
                                </button>
                                <button onClick={() => exportPaidPDF(user)} className="flex items-center justify-center gap-2 bg-green-800 hover:bg-green-900 text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm transition">
                                    <Icons.FileText /> PDF (Pagos)
                                </button>
                            </div>
                        </div>

                        {loading ? <p>Carregando...</p> : payments.length === 0 ? (
                            <div className="text-center py-16 text-slate-500 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                                <Icons.DollarSign className="w-10 h-10 mx-auto text-slate-300 mb-3" />
                                <p className="mb-4 text-lg">Nenhum pagamento registrado neste período.</p>
                                {['Administrador', 'Gestor', 'Financeiro', 'Gerente'].includes(userProfile?.role) && (
                                    <button onClick={() => setIsModalOpen(true)} className="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-2 px-6 rounded-lg transition shadow-sm">
                                        Fazer um lançamento agora
                                    </button>
                                )}
                            </div>
                        ) : (
                            <div className="overflow-x-auto border border-slate-200 rounded-xl">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm">
                                            <th className="py-3 px-3">
                                                <input type="checkbox"
                                                    onChange={() => {
                                                        const allLaunchableIds = filteredPayments.filter(p => p.status === 'A pagar').map(p => p.id); // 'A pagar' is the status for "A Lançar"
                                                        if (selectedToLaunch.length === allLaunchableIds.length) {
                                                            setSelectedToLaunch([]);
                                                        } else {
                                                            setSelectedToLaunch(allLaunchableIds);
                                                        }
                                                    }}/>
                                            </th>
                                            <th className="py-3 px-3 font-bold">Captação (Cód)</th>
                                            <th className="py-3 px-3 font-bold">Tipo</th>
                                            <th className="py-3 px-3 font-bold">Corretor(es)</th>
                                            <th className="py-3 px-3 font-bold">Data Captação</th>
                                            <th className="py-3 px-3 font-bold">Data Lançamento</th>
                                            <th className="py-3 px-3 font-bold">Valor</th>
                                            <th className="py-3 px-3 font-bold">Status</th>
                                            <th className="py-3 px-3 font-bold">Data Pagamento</th>
                                            <th className="py-3 px-3 font-bold text-right">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-sm">
                                        {paginatedPayments.map((p) => (
                                            <tr key={p.id} className="border-b border-slate-100 hover:bg-blue-50/30 transition last:border-0">
                                                <td className="py-3 px-3">
                                                    {p.status === 'A pagar' && (
                                                        <input type="checkbox"
                                                            checked={selectedToLaunch.includes(p.id)}
                                                            onChange={() => setSelectedToLaunch(prev => 
                                                                prev.includes(p.id)
                                                                    ? prev.filter(id => id !== p.id)
                                                                    : [...prev, p.id]
                                                            )} />

                                                </td>
                                                <td className="py-3 px-3 font-bold text-slate-800 whitespace-nowrap">{p.codigo}</td>
                                                <td className="py-3 px-3 text-slate-600 font-medium">

                                                        p.tipoContrato === 'venda' ? 'bg-purple-100 text-purple-700' : 
                                                        p.tipoContrato === 'aluguel_venda' ? 'bg-orange-100 text-orange-700' : 
                                                        'bg-sky-100 text-sky-700'}`
                                                    }>
                                                        {p.tipoContrato === 'venda' ? 'Venda' : p.tipoContrato === 'aluguel_venda' ? 'Aluguel/Venda' : 'Aluguel'}

                                                        </div>

                                                </td>
                                                <td className="py-3 px-3 text-slate-500 whitespace-nowrap">{formatDateToBR(p.dataCaptacao)}</td>
                                                <td className="py-3 px-3 text-slate-500 whitespace-nowrap">{formatDateToBR(p.dataRegistro)}</td>
                                                <td className="py-3 px-3 text-slate-800 font-black whitespace-nowrap">

                                                        p.status === 'Lançado' ? 'bg-purple-100 text-purple-700' :
                                                        p.status === 'A pagar' ? 'bg-amber-100 text-amber-700' :
                                                        'bg-blue-100 text-blue-700'
                                                    }`}>
                                                        {
                                                            p.status === 'Paga' ? <Icons.CheckCircle className="w-4 h-4" /> :
                                                            p.status === 'A pagar' ? <Icons.DollarSign className="w-4 h-4" /> : p.status === 'Lançado' ? <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z" /><path fillRule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clipRule="evenodd" /></svg> :

                                                        }
                                                    </span>

                                                <td className="py-3 px-3 text-right">
