        const getDefaultStartDate = () => {
            const d = new Date();
            return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().split('T')[0];
        };

        const getDefaultEndDate = () => {
            const d = new Date();
            return new Date(d.getFullYear(), d.getMonth() + 1, 0).toISOString().split('T')[0];
        };

        const formatMoney = (value) => {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        };

        const formatDateToBR = (dateString) => {
            if(!dateString) return "";
            const [year, month, day] = dateString.split('-');
            return `${day}/${month}/${year}`;
        };

        const getMonthNameBR = (monthStr) => {
            if (!monthStr) return "";
            const [year, month] = monthStr.split('-');
            const date = new Date(year, parseInt(month) - 1, 1);
            return date.toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
        };

        const logAudit = async (user, action, details) => {
            if (!user || !user.email) {
                console.warn("Audit log skipped: user not available.");
                return;
            }
            try {
                const auditRef = window.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'audit_logs');
                await window.addDoc(auditRef, {
                    userEmail: user.email,
                    action: action,
                    details: details,
                    timestamp: new Date().toISOString()
                });
            } catch (error) {
                console.error("Failed to write audit log:", error);
            }
        };

        const exportAuditPDF = async (currentUser, logs, dataInicio, dataFim, showToast) => {
            if (logs.length === 0) {
                showToast("Nenhum registro de auditoria para exportar.", "error");
                return;
            }

        const BackupManager = ({ user, showToast, firebaseApi, logAudit }) => {
            const fileInputRef = useRef(null);
            const [isLoading, setIsLoading] = useState(false);

            const handleExport = async () => {
                const { collection, query } = firebaseApi;
                showToast("Preparando backup...", "info");

                try {
                    const capturesRef = firebaseApi.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'captures');
                    const brokersRef = firebaseApi.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'brokers');
                    const paymentsRef = firebaseApi.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments');
                    const auditLogsRef = firebaseApi.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'audit_logs');

                    const [capturesSnap, brokersSnap, paymentsSnap, auditLogsSnap] = await Promise.all([
                        getDocs(query(capturesRef)),
                        getDocs(query(brokersRef)),
                        getDocs(query(paymentsRef)),
                        getDocs(query(auditLogsRef))
                    ]);

                    const captures = capturesSnap.docs.map(d => d.data());
                    const brokers = brokersSnap.docs.map(d => d.data());
                    const payments = paymentsSnap.docs.map(d => d.data());
                    const auditLogs = auditLogsSnap.docs.map(d => d.data());

                    if (captures.length === 0 && brokers.length === 0 && payments.length === 0 && auditLogs.length === 0) {
                        showToast('Nenhum dado para exportar.', 'error');
                        return;
                    }

                const dataToExport = {
                    captures: captures.map(({ corretores, codigo, data, tipo, status, registrationType, availability, observacoes }) => ({ corretores, codigo, data, tipo, status, registrationType, availability, observacoes })),
                    brokers: brokers.map(({ name, category }) => ({ name, category })),
                    payments: payments.map(({ captureId, codigo, corretor, todosCorretores, dataCaptacao, valor, status, dataRegistro, tipoContrato, dataPagamento, dataLancamento }) => ({ captureId, codigo, corretor, todosCorretores, dataCaptacao, valor, status, dataRegistro, tipoContrato, dataPagamento, dataLancamento })),
                    audit_logs: auditLogs.map(({ userEmail, action, details, timestamp }) => ({ userEmail, action, details, timestamp }))
                };
                const dataStr = JSON.stringify(dataToExport, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement("a");
                link.href = url;
                link.download = `backup_captacoes_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                await logAudit(user, "Exportação de Backup", "Backup completo do sistema exportado para .json");
                showToast("Backup baixado com sucesso!", "success");
                } catch (error) {
                    console.error("Backup export error:", error);
                    showToast("Erro ao gerar o backup.", "error");
                }
            };

            const triggerImport = () => {
                if (fileInputRef.current) {
                    fileInputRef.current.value = ''; 
                    fileInputRef.current.click();
                }
            };

            const handleImportFile = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsLoading(true);

                const { collection, query } = firebaseApi;
                let captures = [];
                let brokers = [];
                try {
                    const capturesSnap = await getDocs(query(collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'captures')));
                    captures = capturesSnap.docs.map(doc => ({...doc.data(), id: doc.id}));
                    const brokersSnap = await getDocs(query(collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'brokers')));
                    brokers = brokersSnap.docs.map(doc => ({...doc.data(), id: doc.id}));
                } catch (fetchErr) {
                    showToast("Erro ao carregar dados atuais para verificação.", "error");
                    setIsLoading(false);
                    return;
                }


                const reader = new FileReader();
                reader.onload = async (event) => {
                    const fileContent = event.target.result;
                    try {
                        if (!user) throw new Error("Aguarde a conexão com o sistema.");
                        let importedData;
                        try { importedData = JSON.parse(fileContent); } 
                        catch (parseErr) { throw new Error("Arquivo inválido. Use um .json exportado pelo CaptaPro."); }
                        
                        let importCaptures = [];
                        let importBrokers = [];
                        let importPayments = [];
                        let importAuditLogs = [];

                        if (Array.isArray(importedData)) {
                            importCaptures = importedData;
                        } else if (importedData && typeof importedData === 'object') {
                            importCaptures = Array.isArray(importedData.captures) ? importedData.captures : [];
                            importBrokers = Array.isArray(importedData.brokers) ? importedData.brokers : [];
                            importPayments = Array.isArray(importedData.payments) ? importedData.payments : [];
                            importAuditLogs = Array.isArray(importedData.audit_logs) ? importedData.audit_logs : [];
                        } else {
                            throw new Error("Formato de arquivo não reconhecido.");
                        }

                        let newCapturesCount = 0;
                        let newBrokersCount = 0;
                        let newPaymentsCount = 0;
                        let newAuditLogsCount = 0;
                        const capturesRef = firebaseApi.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'captures');
                        const brokersRef = firebaseApi.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'brokers');
                        const auditLogsRef = firebaseApi.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'audit_logs');
                        const paymentsRef = firebaseApi.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments');

                        const safeString = (val) => (val === null || val === undefined) ? '' : String(val);
                        const currentBrokerNames = brokers.map(b => safeString(b.name).trim().toUpperCase()).filter(Boolean);
                        
                        for (const item of importBrokers) {
                            const bName = safeString(item.name).trim();
                            const bCategory = safeString(item.category).trim() || 'locacao';
                            if (!bName) continue;
                            const nameUpper = bName.toUpperCase();
                            if (!currentBrokerNames.includes(nameUpper)) {
                                await firebaseApi.addDoc(brokersRef, { name: bName, category: bCategory, createdAt: new Date().toISOString() });
                                currentBrokerNames.push(nameUpper); 
                                newBrokersCount++;
                            }
                        }

                        const addedCapturesKeys = new Set(); 

                        for (const item of importCaptures) {
                            const cCorretores = Array.isArray(item.corretores) && item.corretores.length > 0 ? item.corretores.map(c => safeString(c).trim()) : [safeString(item.corretor).trim()];
                            const cCodigo = safeString(item.codigo).trim();
                            const cData = safeString(item.data).trim();
                            const cStatus = safeString(item.status).trim() || 'pendente';
                            const cTipo = safeString(item.tipo).trim() || 'locacao';
                            const cRegistrationType = safeString(item.registrationType).trim() || 'primeiro_registro';
                            const cAvailability = safeString(item.availability).trim() || 'disponivel';
                            const cObservacoes = safeString(item.observacoes).trim();

                            if (cCorretores.length === 0 || !cCorretores[0] || !cCodigo || !cData) continue;

                            for (const broker of cCorretores) {
                                if (broker && !currentBrokerNames.includes(broker.toUpperCase())) {
                                    await firebaseApi.addDoc(brokersRef, { name: broker, category: 'locacao', createdAt: new Date().toISOString() });
                                    currentBrokerNames.push(broker.toUpperCase());
                                    newBrokersCount++;
                                }
                            }

                            const uniqueKey = `${cCodigo.toUpperCase()}`;
                            if (addedCapturesKeys.has(uniqueKey)) continue;

                            const isDuplicate = captures.some(c => 
                                safeString(c.codigo).trim().toUpperCase() === cCodigo.toUpperCase()
                            );

                            if (!isDuplicate) {
                                await firebaseApi.addDoc(capturesRef, {
                                    corretores: cCorretores,
                                    codigo: cCodigo,
                                    data: cData,
                                    tipo: cTipo,
                                    status: cStatus,
                                    registrationType: cRegistrationType,
                                    availability: cAvailability,
                                    observacoes: cObservacoes,
                                    createdAt: new Date().toISOString()
                                });
                                addedCapturesKeys.add(uniqueKey);
                                newCapturesCount++;
                            }
                        }

                        for (const item of importPayments) {
                            const { captureId, codigo, corretor, todosCorretores, dataCaptacao, valor, status, dataRegistro, tipoContrato, dataPagamento, dataLancamento } = item;
                            if (!codigo || !valor) continue;
                            
                            await firebaseApi.addDoc(paymentsRef, {
                                captureId: safeString(captureId),
                                codigo: safeString(codigo),
                                corretor: safeString(corretor),
                                todosCorretores: Array.isArray(todosCorretores) ? todosCorretores : [],
                                dataCaptacao: safeString(dataCaptacao),
                                valor: Number(valor),
                                status: safeString(status),
                                dataRegistro: safeString(dataRegistro),
                                dataPagamento: safeString(dataPagamento) || null,
                                dataLancamento: safeString(dataLancamento) || null,
                                tipoContrato: safeString(tipoContrato) || 'aluguel',
                                createdAt: new Date().toISOString()
                            });
                            newPaymentsCount++;
                        }
                        
                        for (const item of importAuditLogs) {
                            const { userEmail, action, details, timestamp } = item;
                            if (!userEmail || !action || !timestamp) continue;
                            await firebaseApi.addDoc(auditLogsRef, {
                                userEmail: safeString(userEmail),
                                action: safeString(action),
                                details: safeString(details),
                                timestamp: safeString(timestamp)
                            });
                            newAuditLogsCount++;
                        }

                        
                        await logAudit(user, "Importação de Backup", `Importação concluída! ${newCapturesCount} captações, ${newPaymentsCount} pagamentos e ${newBrokersCount} corretores novos.`);
                        showToast(`Importação concluída! ${newCapturesCount} captações, ${newPaymentsCount} pagamentos e ${newBrokersCount} corretores inseridos.`, "success");
                    } catch (error) {
                        showToast(error.message || "Erro inesperado ao ler o arquivo.", "error");
                    } finally {
                        setIsLoading(false);
                        if (fileInputRef.current) fileInputRef.current.value = '';
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="max-w-xl mx-auto slide-up">
                    <div className="bg-white p-8 md:p-10 rounded-2xl shadow-sm border border-slate-200 text-center">
                        <div className="bg-indigo-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 text-indigo-600 shadow-inner">
                            <Icons.Download />
                        </div>
                        <h2 className="text-2xl font-bold text-slate-800 mb-3">Backup Seguro</h2>
                        <p className="text-slate-500 mb-8 leading-relaxed">
                            Mantenha seus dados seguros exportando um arquivo. O sistema ignora duplicatas automaticamente ao importar um backup.
                        </p>

                        <div className="flex flex-col gap-4">
                            <button 
                                onClick={handleExport}
                                className="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 px-4 rounded-xl transition shadow-md"
                            >
                                <Icons.Download /> Baixar Backup (.json)
                            </button>

                            <input 
                                type="file" 
                                accept=".json, application/json, .txt" 
                                ref={fileInputRef} 
                                className="hidden" 
                                onChange={handleImportFile}
                            />
                            
                            <button 
                                onClick={triggerImport}
                                disabled={isLoading}
                                className={`w-full flex items-center justify-center gap-2 border-2 font-bold py-3.5 px-4 rounded-xl transition ${isLoading ? 'bg-slate-50 border-slate-200 text-slate-400 cursor-wait' : 'bg-white border-slate-300 hover:border-slate-400 hover:bg-slate-50 text-slate-700 shadow-sm'}`}
                            >
                                {isLoading ? (
                                    <span className="animate-pulse flex items-center gap-2">Processando Backup...</span>
                                ) : (
                                    <><Icons.Upload /> Restaurar Dados (.json)</>
                                )}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const AuditLogViewer = ({ isActive, showToast, user, firebaseApi }) => {
            const [auditLogs, setAuditLogs] = useState([]);
            const [loading, setLoading] = useState(true);
            const [loadingMore, setLoadingMore] = useState(false);
            const [lastVisible, setLastVisible] = useState(null);
            const [hasMore, setHasMore] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');
            const fetchInitialLogs = useCallback(async () => {
                if (!user || !isActive) return;
                setLoading(true);
                setAuditLogs([]);
                setLastVisible(null);
                setHasMore(true);

                const { query, collection, where, orderBy } = firebaseApi;
                const auditLogsRef = collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'audit_logs');
                const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();

                const q = query(auditLogsRef, 
                    where("timestamp", ">=", oneDayAgo),
                    orderBy("timestamp", "desc")
                );

                try {
                    const snapshot = await firebaseApi.getDocs(q);
                    const logs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    const lastDoc = snapshot.docs[snapshot.docs.length - 1];
                    
                    setAuditLogs(logs);
                    setLastVisible(lastDoc);
                    if (!lastDoc) {
                        setHasMore(false);
                    }
                } catch (error) {
                    console.error("Error fetching initial audit logs:", error);
                    showToast("Erro ao carregar auditoria.", "error");
                } finally {
                    setLoading(false);
                }
            }, [user, isActive, firebaseApi, showToast]);

            useEffect(() => {
                if (isActive) {
                    fetchInitialLogs();
                }
            }, [isActive, fetchInitialLogs]);

            const handleLoadMore = async () => {
                if (!user || !lastVisible || !hasMore) return;
                setLoadingMore(true);

                const { query, collection, orderBy, limit, startAfter } = firebaseApi;
                const auditLogsRef = collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'audit_logs');
                
                const q = query(auditLogsRef, 
                    orderBy("timestamp", "desc"),
                    startAfter(lastVisible),
                    limit(50)
                );

                try {
                    const snapshot = await firebaseApi.getDocs(q);
                    const newLogs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    const lastDoc = snapshot.docs[snapshot.docs.length - 1];
                    
                    setAuditLogs(prev => [...prev, ...newLogs]);
                    setLastVisible(lastDoc);
                    if (!lastDoc || newLogs.length < 50) {
                        setHasMore(false);
                    }
                } catch (error) {
                    console.error("Error fetching more audit logs:", error);
                    showToast("Erro ao carregar mais registros.", "error");
                } finally {
                    setLoadingMore(false);
                }
            };

            const filteredLogs = useMemo(() => {
                if (!auditLogs) return [];
                const term = searchTerm.toLowerCase();
                return auditLogs.filter(log => term === '' || (log.userEmail && log.userEmail.toLowerCase().includes(term)) ||
                        (log.action && log.action.toLowerCase().includes(term)) ||
                        (log.details && log.details.toLowerCase().includes(term)));
            }, [auditLogs, searchTerm]);

            return (
                <div className="max-w-5xl mx-auto slide-up">
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-slate-100 pb-6">
                            <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                                <Icons.Shield /> Registros de Auditoria
                            </h2>
                            <div className="flex flex-wrap items-center gap-3 w-full sm:w-auto justify-end">
                                <div className="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 w-full sm:w-auto focus-within:ring-2 focus-within:ring-blue-500">
                                    <Icons.Search className="text-slate-400"/>
                                    <input 
                                        type="text" 
                                        placeholder="Buscar nos registros..."
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="ml-2 outline-none bg-transparent w-full placeholder:text-slate-400"
                                    />
                                </div>
                            </div>
                        </div>

                        {loading ? <p className="text-center py-10 text-slate-500">Carregando registros...</p> : (
                            <React.Fragment>
                                <div className="space-y-3 max-h-[60vh] overflow-y-auto pr-2">
                                    {filteredLogs.length === 0 ? (
                                        <p className="text-center text-slate-500 py-10">Nenhum registro de auditoria encontrado nas últimas 24 horas.</p>
                                    ) : filteredLogs.map(log => (
                                        <div key={log.id} className="bg-slate-50/70 border border-slate-200 p-4 rounded-lg text-sm">
                                            <div className="flex justify-between items-center mb-2">
                                                <p className="font-bold text-slate-800">{log.action}</p>
                                                <p className="text-xs text-slate-500 font-medium">{new Date(log.timestamp).toLocaleString('pt-BR')}</p>
                                            </div>
                                            <p className="text-slate-600 leading-snug">{log.details}</p>
                                            <p className="text-xs text-slate-500 mt-2">Usuário: <span className="font-semibold">{log.userEmail}</span></p>
                                        </div>
                                    ))}
                                </div>
                                {hasMore && (
                                    <div className="text-center mt-6">
                                        <button onClick={handleLoadMore} disabled={loadingMore} className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-6 rounded-lg transition border border-slate-200 disabled:opacity-50">
                                            {loadingMore ? 'Carregando...' : 'Carregar mais antigos'}
                                        </button>
                                    </div>
                                )}
                            </React.Fragment>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('dashboard');
            
            const [user, setUser] = useState(null);
            const [brokers, setBrokers] = useState([]);
            const [authLoading, setAuthLoading] = useState(true);
            const [userProfile, setUserProfile] = useState(null); // Keep userProfile here
            const [isAdminMenuOpen, setIsAdminMenuOpen] = useState(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const adminMenuRef = useRef(null); 
            const mobileMenuRef = useRef(null);
            const [loadedViews, setLoadedViews] = useState({ dashboard: true, captures: true, financeiro: true, brokers: true, backup: true }); // Carrega todas as views para evitar problemas de renderização inicial

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (adminMenuRef.current && !adminMenuRef.current.contains(event.target)) {
                        setIsAdminMenuOpen(false);
                    }
                    if (mobileMenuRef.current && !mobileMenuRef.current.contains(event.target)) {
                        setIsMobileMenuOpen(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => {
                    document.removeEventListener("mousedown", handleClickOutside);
                };
            }, [adminMenuRef, mobileMenuRef]);
            
            const [toasts, setToasts] = useState([]);

            const [readCount, setReadCount] = useState(0);
            const [writeCount, setWriteCount] = useState(0);

            const showToast = useCallback((message, type = 'info') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 4000);
            }, []);

            const [dataInicio, setDataInicio] = useState(getDefaultStartDate());
            const [dataFim, setDataFim] = useState(getDefaultEndDate());

            const createDateHandler = (setter, isStartDate) => (e) => {
                const newDateValue = e.target.value;
                const otherDateValue = isStartDate ? dataFim : dataInicio;

                const d1 = new Date(isStartDate ? newDateValue : otherDateValue);
                const d2 = new Date(isStartDate ? otherDateValue : newDateValue);

                const diffTime = Math.abs(d2 - d1);
                const diffMonths = diffTime / (1000 * 60 * 60 * 24 * 30.44);

                if (diffMonths > 3) {
                    showToast("O período de filtro não pode ser maior que 3 meses.", "error");
                    return;
                }
                setter(newDateValue);
            };

            const handleSetDataInicio = createDateHandler(setDataInicio, true);
            const handleSetDataFim = createDateHandler(setDataFim, false);

            const firebaseApi = useMemo(() => {
                const incrementRead = (count = 1) => setReadCount(c => c + count);
                const incrementWrite = () => setWriteCount(w => w + 1);

                return {
                    getDocs: async (...args) => {
                        const result = await window.getDocs(...args);
                        incrementRead(result.docs.length || 1);
                        return result;
                    },
        getDoc: async (...args) => {
            const result = await window.getDoc(...args);
            incrementRead();
            return result;
        },
                    addDoc: async (...args) => {
                        const result = await window.addDoc(...args);
                        incrementWrite();
                        return result;
                    },
                    updateDoc: async (...args) => {
                        const result = await window.updateDoc(...args);
                        incrementWrite();
                        return result;
                    },
                    deleteDoc: async (...args) => {
                        const result = await window.deleteDoc(...args);
                        incrementWrite();
                        return result;
                    },
                    onSnapshot: (query, onNext, onError) => {
                        const newOnNext = (snapshot) => {
                            incrementRead(snapshot.docs.length || 1);
                            onNext(snapshot);
                        };
                        return window.onSnapshot(query, newOnNext, onError);
                    },
                    // Funções que não fazem I/O são passadas diretamente
                    doc: window.doc,
                    collection: window.collection,
                    query: window.query,
                    where: window.where,
                    or: window.or,
                    orderBy: window.orderBy,
                    and: window.and,
                    limit: window.limit,
                    startAfter: window.startAfter,
                };
            }, [setReadCount, setWriteCount]);

            // Efeito para resetar contadores quando a página é restaurada do cache (ex: botão "voltar" do navegador)
            useEffect(() => {
                const handlePageShow = (event) => {
                    if (event.persisted) {
                        setReadCount(0);
                        setWriteCount(0);
                    }
                };

                window.addEventListener('pageshow', handlePageShow);
                return () => {
                    window.removeEventListener('pageshow', handlePageShow);
                };
            }, []); // Executa apenas uma vez

            // --- REDIRECIONAMENTO PARA login.html AO SAIR ---
            const handleLogout = async () => {
                try {
                    if (window.auth && window.signOut) {
                        await window.signOut(window.auth);
                        showToast("Sessão encerrada com sucesso.", "success"); 
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 1000);
                    }
                } catch (e) {
                    showToast("Erro ao encerrar a sessão.", "error");
                }
            };

            useEffect(() => {
                let inactivityTimer;
                const logoutDueToInactivity = async () => {
                    if (window.auth && window.signOut) {
                        try {
                            await window.signOut(window.auth);
                            showToast("Sessão encerrada por inatividade (10 min).", "error");
                        } catch (e) {
                            window.location.href = 'login.html';
                        }
                    }
                };

                const resetTimer = () => {
                    clearTimeout(inactivityTimer);
                    inactivityTimer = setTimeout(logoutDueToInactivity, 10 * 60 * 1000);
                };

                const events = ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'];
                events.forEach(event => window.addEventListener(event, resetTimer));
                resetTimer();

                return () => {
                    clearTimeout(inactivityTimer);
                    events.forEach(event => window.removeEventListener(event, resetTimer));
                };
            }, [showToast]);
            // ------------------------------------------------

            useEffect(() => {
                let isInitializingAuth = !!window.__initial_auth_token;

                const initAuth = async () => {
                    if (window.__initial_auth_token) {
                        try {
                            await window.signInWithCustomToken(window.auth, window.__initial_auth_token);
                        } catch (error) {
                            console.error("Auth error:", error);
                            window.location.href = 'login.html';
                        } finally {
                            isInitializingAuth = false;
                        }
                    }
                };

                const unsubscribeAuth = window.onAuthStateChanged(window.auth, async (currentUser) => {
                    // Ignora o disparo inicial nulo caso estejamos no meio do login com token inicial
                    if (isInitializingAuth && !currentUser) return;
                    
                    if (user?.uid !== currentUser?.uid) {
                        setReadCount(0);
                        setWriteCount(0);
                        setUserProfile(null);
                    }
                    
                    setUser(currentUser);
                    
                    if (currentUser) {
                        const userId = currentUser.uid;
                        let profile = {
                            email: currentUser.email,
                            name: currentUser.displayName || currentUser.email.split('@')[0],
                            role: 'Corretor' // Papel padrão
                        };
                        try {
                            const roleDoc = await firebaseApi.getDoc(firebaseApi.doc(window.db, 'user_roles', userId));
                            if (roleDoc.exists()) {
                                const userData = roleDoc.data();
                                profile.role = userData.role || 'Corretor';
                                profile.name = userData.name || profile.name;
                            }
                        } catch (err) {
                            console.error("Erro ao verificar permissões:", err);
                            showToast("Erro ao verificar permissões.", "error");
                        }
                        setUserProfile(profile);
                        const brokersRef = firebaseApi.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'brokers');
                        const qBrokers = firebaseApi.query(brokersRef);
                        const unsubscribeBrokers = firebaseApi.onSnapshot(qBrokers, (snapshot) => {
                            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            data.sort((a, b) => a.name.localeCompare(b.name));
                            setBrokers(data);
                            if (authLoading) {
                                setAuthLoading(false);
                            }
                        }, (error) => {
                            console.error("Error fetching brokers:", error);
                            showToast("Erro ao carregar a lista de corretores.", "error");
                            setAuthLoading(false);
                        });
                        return () => {
                            unsubscribeBrokers();
                        };
                    } else {
                        setBrokers([]);
                        setUserProfile(null);
                        setAuthLoading(false);
                        window.location.href = 'login.html';
                    }
                });

                initAuth();
                return () => {
                    unsubscribeAuth();
                };
            }, [firebaseApi, showToast, authLoading]);

            const navigate = (newView) => {
                setIsAdminMenuOpen(false);
                setLoadedViews(prev => ({ ...prev, [newView]: true }));
                setView(newView);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            if (authLoading) {
                return ( 
                    <div className="h-screen flex flex-col items-center justify-center">
                        <div className="w-16 h-16 border-4 border-white/30 border-t-white rounded-full animate-spin mb-6"></div>
                        <div className="text-white/90 text-lg font-medium animate-pulse">Conectando ao sistema...</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col">
                    <ToastContainer toasts={toasts} />
                    
                    <header className="bg-white/85 backdrop-blur-md shadow-sm border-b border-slate-200 sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6">
                            <div className="flex justify-between items-center h-16">
                                <div className="flex items-center gap-2 cursor-pointer" onClick={() => navigate('dashboard')}>
                                    <div className="bg-blue-600 text-white p-1.5 rounded-lg shadow-sm">
                                        <Icons.Home />
                                    </div>
                                    <h1 className="text-xl font-black text-slate-800 tracking-tight">Capta<span className="text-blue-600">Pro</span></h1>
                                </div>
                                <div className="flex items-center gap-3">
                                    <div className="sm:hidden relative" ref={mobileMenuRef}> {/* Adicionado relative aqui */}
                                        <button onClick={() => setIsMobileMenuOpen(prev => !prev)} className="p-2 rounded-md text-slate-500 hover:text-slate-800 hover:bg-slate-100">
                                            <Icons.Menu />
                                        </button>
                                    </div>
                                    <div className="hidden sm:flex items-center space-x-1">
                                        <NavButton icon={<Icons.FileText />} label="Captações" onClick={() => window.location.href = 'captacoes.html'} />
                                        <NavButton icon={<Icons.DollarSign />} label="Lançamentos" onClick={() => window.location.href = 'financeiro.html'} />
                                        <NavButton icon={<svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z" /><path fillRule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clipRule="evenodd" /></svg>} label="Carteira" onClick={() => window.location.href = 'carteira.html'} />
                                        <div className="w-px h-6 bg-slate-200 mx-2"></div>
                                        <div className="relative" ref={adminMenuRef}>
                                            <button onClick={() => setIsAdminMenuOpen(prev => !prev)} title="Admin" className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold transition text-slate-500 hover:bg-slate-100 hover:text-slate-900">
                                                <Icons.Sliders />
                                            </button>
                                            {isAdminMenuOpen && (
                                                <div className="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg py-1 z-50 border border-slate-200"> {/* Adjusted width */}
                                                    <NavButton icon={<Icons.Users />} label="Equipe" active={view === 'brokers'} onClick={() => { navigate('brokers'); setIsAdminMenuOpen(false); }} /> {/* Added active prop */}
                                                    <NavButton icon={<Icons.Download />} label="Backup" active={view === 'backup'} onClick={() => { navigate('backup'); setIsAdminMenuOpen(false); }} />
                                                    <NavButton icon={<Icons.Shield />} label="Auditoria" active={view === 'audit'} onClick={() => { navigate('audit'); setIsAdminMenuOpen(false); }} />
                                                </div>
                                            )}
                                        </div>
                                        <NavButton icon={<Icons.LogOut />} label="Sair" onClick={handleLogout} danger />
                                    </div>
                                </div>
                            </div>
                        </div>
                        {isMobileMenuOpen && ( // z-index ajustado para garantir que o menu fique acima de outros elementos
                            <div className="sm:hidden absolute top-16 left-0 w-full bg-white shadow-lg border-t border-slate-200 p-4 z-[60]"> 
                                <div className="flex flex-col gap-2">
                                    <button onClick={() => { navigate('brokers'); setIsMobileMenuOpen(false); }} className="flex items-center gap-3 p-3 rounded-lg text-slate-600 font-semibold hover:bg-slate-100 w-full text-left"><Icons.Users /><span>Equipe</span></button>
                                    <button onClick={() => { navigate('backup'); setIsMobileMenuOpen(false); }} className="flex items-center gap-3 p-3 rounded-lg text-slate-600 font-semibold hover:bg-slate-100 w-full text-left"><Icons.Download /><span>Backup</span></button>
                                    <button onClick={() => { navigate('audit'); setIsMobileMenuOpen(false); }} className="flex items-center gap-3 p-3 rounded-lg text-slate-600 font-semibold hover:bg-slate-100 w-full text-left"><Icons.Shield /><span>Auditoria</span></button>
                                    <div className="h-px bg-slate-200 my-2"></div>
                                    <a onClick={handleLogout} className="flex items-center gap-3 p-3 rounded-lg text-red-600 font-semibold hover:bg-red-50 cursor-pointer"><Icons.LogOut /><span>Sair</span></a>
                                </div>
                            </div>
                        )}
                    </header>

                    <nav className="sm:hidden fixed bottom-0 w-full bg-white border-t border-slate-200 z-40 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        <div className="flex justify-around items-center h-16 px-1">
                            <MobileNavButton icon={<Icons.FileText />} label="Captações" onClick={() => window.location.href = 'captacoes.html'} />
                            <MobileNavButton icon={<Icons.DollarSign />} label="Lançar" onClick={() => window.location.href = 'financeiro.html'} />
                            <MobileNavButton icon={<svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z" /><path fillRule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clipRule="evenodd" /></svg>} label="Carteira" onClick={() => window.location.href = 'carteira.html'} />
                        </div>
                    </nav>
 
                    <main className="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 pt-4 sm:pt-6 pb-28 sm:pb-20 overflow-x-hidden">
                        <div hidden={view !== 'dashboard'}>
                            <HomeDashboard navigate={navigate} userProfile={userProfile} />
                        </div>
                        <div hidden={view !== 'brokers'}>
                            <BrokerManager user={user} brokers={brokers} showToast={showToast} firebaseApi={firebaseApi} logAudit={logAudit} userProfile={userProfile} />
                        </div>
                        <div hidden={view !== 'backup'}>
                            <BackupManager user={user} showToast={showToast} firebaseApi={firebaseApi} logAudit={logAudit} userProfile={userProfile} />
                        </div>
                        <div hidden={view !== 'audit'}>
                            <AuditLogViewer isActive={view === 'audit'} showToast={showToast} user={user} firebaseApi={firebaseApi} />
                        </div>
                    </main>
                    <footer className="fixed bottom-0 left-0 right-0 z-30 bg-white/90 backdrop-blur-sm border-t border-slate-200 py-2 px-4 text-center text-slate-500 text-xs">
                        <div className="max-w-7xl mx-auto flex flex-wrap justify-center items-center gap-x-4 gap-y-1">
                            <div className="flex items-center gap-1.5 text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-0.5 rounded-full border border-slate-200">
                                <span className={`w-2 h-2 rounded-full ${user ? 'bg-green-500' : 'bg-red-500'}`}></span>
                                {user ? 'Online' : 'Offline'}
                            </div>
                            {user && <p className="font-semibold text-slate-500">Logado como: {user.email}</p>}
                            <p>CaptaPro - 5.5 beta  - Criado por Guilherme Montoani</p>
                            <div className="flex items-center gap-x-3 font-mono">
                                <span title="Leituras do Banco de Dados">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3 inline -mt-0.5" viewBox="0 0 20 20" fill="currentColor"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z" /><path fillRule="evenodd" d="M.458 10C3.732 4.943 9.522 3 10 3s6.268 1.943 9.542 7c-3.274 5.057-9.064 7-9.542 7S3.732 15.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clipRule="evenodd" /></svg>
                                    {readCount}
                                </span>
                                <span title="Escritas no Banco de Dados">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3 inline -mt-0.5" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg>
                                    {writeCount}
                                </span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const NavButton = ({ icon, label, active, onClick, highlight, danger }) => {
            if (danger) {
                return (
                    <button onClick={onClick} className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold text-red-600 hover:bg-red-50 hover:text-red-700 transition" title="Sair do Sistema">
                        {icon} {label && <span>{label}</span>}
                    </button>
                );
            }
            return (
                <button onClick={onClick} className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold transition ${active ? 'bg-slate-100 text-blue-700' : 'text-slate-500 hover:bg-slate-100 hover:text-slate-900'}`}>
                    {icon} <span>{label}</span>
                </button>
            );
        }

        const MobileNavButton = ({ icon, label, active, onClick, highlight }) => {
            if (highlight) {
                return (
                    <button onClick={onClick} className="flex flex-col items-center justify-center w-full h-full relative top-[-15px]">
                        <div className="p-4 rounded-full shadow-lg bg-amber-500 text-white shadow-amber-200">
                            {React.cloneElement(icon, { className: "h-6 w-6"})}
                        </div>
                        <span className="text-[10px] mt-1.5 font-bold text-amber-700">{label}</span>
                    </button>
                );
            }
            return ( // eslint-disable-next-line
                <button onClick={onClick} className={`flex flex-col items-center justify-center w-full h-full space-y-1 transition ${active ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                    {React.cloneElement(icon, { className: "h-6 w-6"})}
                    <span className="text-[10px] font-bold">{label}</span>
                </button>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
