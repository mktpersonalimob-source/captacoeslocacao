                            const docRef = window.doc(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments', deletingItem.id);
                            await window.deleteDoc(docRef);
                            await logAudit(user, "Exclusão de Lançamento Financeiro", `Captação Cód: ${deletingItem.codigo}, Valor: ${formatMoney(deletingItem.valor)}`);
                            setDeletingItem(null);
                            showToast("Lançamento excluído.", "success");
                        } catch (err) {
                            showToast("Erro ao excluir lançamento.", "error");
                        }
                    }}
                />

                {editingPayment && (
                    <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                        <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 slide-up">
                            <h3 className="text-xl font-bold text-slate-800 mb-2">Informar Valor a Pagar</h3>
                            <p className="text-slate-600 mb-6">
                                Defina o valor da comissão para a captação <span className="font-bold">{editingPayment.codigo}</span> do corretor <span className="font-bold">{editingPayment.corretor}</span>.
                            </p>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1">Valor da Comissão (R$)</label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        value={newPaymentValue}
                                        onChange={(e) => setNewPaymentValue(e.target.value)}
                                        placeholder="Ex: 150.00"
                                        className="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 hover:bg-white transition"
                                        autoFocus
                                    />
                                </div>
                                <div className="flex gap-3 pt-2">
                                    <button onClick={() => { setEditingPayment(null); setNewPaymentValue(''); }} className="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl font-semibold hover:bg-slate-200 transition">Cancelar</button>
                                    <button onClick={handleUpdatePaymentValue} className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition shadow-sm">Salvar Valor</button>

                {isModalOpen && (
                    <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                        <div className="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 slide-up">
                            <h3 className="text-xl font-bold text-slate-800 mb-4 border-b border-slate-100 pb-3 flex items-center gap-2">
                                <Icons.DollarSign /> Novo Lançamento
                            </h3>
                            <form onSubmit={handleAddPayment} className="space-y-4">
                                
                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                    <label className="block text-sm font-semibold text-slate-700 mb-2">1. Buscar e Selecionar Captação</label>
                                    
                                    <div className="flex flex-col sm:flex-row gap-2 mb-3">
                                        <div className="flex-1 flex items-center bg-white border border-slate-300 rounded-lg px-2 focus-within:ring-2 focus-within:ring-blue-500 shadow-sm transition">
                                            <Icons.Calendar />
                                            <span className="text-xs text-slate-500 mx-1">De:</span>
                                            <input 
                                                type="date" 
                                                value={captureSearchStartDate} 
                                                onChange={(e) => setCaptureSearchStartDate(e.target.value)} 
                                                className="w-full py-1.5 outline-none bg-transparent text-sm text-slate-700"
                                            />
                                        </div>
                                        <div className="flex-1 flex items-center bg-white border border-slate-300 rounded-lg px-2 focus-within:ring-2 focus-within:ring-blue-500 shadow-sm transition">
                                            <span className="text-xs text-slate-500 mr-1">Até:</span>
                                            <input 
                                                type="date" 
                                                value={captureSearchEndDate} 
                                                onChange={(e) => setCaptureSearchEndDate(e.target.value)} 
                                                className="w-full py-1.5 outline-none bg-transparent text-sm text-slate-700"
                                            />
                                        </div>
                                    </div>

                                    <div className="flex items-center bg-white border border-slate-300 rounded-lg px-3 focus-within:ring-2 focus-within:ring-blue-500 mb-3 shadow-sm transition">
                                        <Icons.Search />
                                        <input
                                            type="text"
                                            placeholder="Filtrar por código ou corretor..."
                                            value={captureSearchTerm}
                                            onChange={(e) => setCaptureSearchTerm(e.target.value)}
                                            className="w-full px-2 py-2 outline-none bg-transparent text-sm"
                                        />
                                    </div>

                                    <select 
                                        value={selectedCapture}
                                        onChange={(e) => setSelectedCapture(e.target.value)}
                                        className="w-full px-3 py-2.5 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm text-sm"
                                    >
                                        <option value="" disabled>Selecione a captação na lista abaixo...</option>
                                        {filteredCapturesForSelect.map(c => (
                                            <option key={c.id} value={c.id}>
                                                {c.codigo} - {c.corretor} ({formatDateToBR(c.data)})
                                            </option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1">2. Valor a Pagar (R$)</label>
                                    <input 
                                        type="number"
                                        step="0.01"
                                        value={valor}
                                        onChange={(e) => setValor(e.target.value)}
                                        placeholder="Ex: 150.00"
                                        className="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 hover:bg-white transition"
                                    />
                                </div>
                                <div className="flex gap-3 mt-8 pt-4 border-t border-slate-100">
                                    <button type="button" onClick={() => { setIsModalOpen(false); setCaptureSearchTerm(''); setCaptureSearchStartDate(getDefaultStartDate()); setCaptureSearchEndDate(getDefaultEndDate()); }} className="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl font-semibold hover:bg-slate-200 transition">Cancelar</button>
                                    <button type="submit" className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition shadow-sm">Lançar a Pagar</button>

                    )}
                    {isModalOpen && (
                        <ConfirmModal
                            isOpen={showPaymentConfirm}
                            title="Lançamento Realizado!"
                            message="O que você gostaria de fazer agora?"
                            btnConfirm="Lançar Outro Valor"
                            btnCancel="Voltar para Financeiro"
                            onConfirm={handleAddNewPayment}
                            onCancel={handleClosePaymentModal}
                        />
            )}
            </React.Fragment>
            );
        };

        const BackupManager = ({ captures, payments, user, brokers, showToast }) => {
            const fileInputRef = useRef(null);
            const [isLoading, setIsLoading] = useState(false);

            const handleExport = () => {
                if (captures.length === 0 && brokers.length === 0 && payments.length === 0 && auditLogs.length === 0) {
                    showToast('Nenhum dado para exportar.', 'error');
                    return;
                }
                
                const dataToExport = {
                    captures: captures.map(({ corretor, codigo, data, tipo, status, registrationType, availability }) => ({ corretor, codigo, data, tipo, status, registrationType, availability })),
                    brokers: brokers.map(({ name }) => ({ name })),
                    payments: payments.map(({ captureId, codigo, corretor, dataCaptacao, valor, status, dataRegistro, tipoContrato, secondCorretor, hasSecondBroker, dataPagamento }) => ({ captureId, codigo, corretor, dataCaptacao, valor, status, dataRegistro, tipoContrato, secondCorretor, hasSecondBroker, dataPagamento })),
                    audit_logs: auditLogs.map(({ userEmail, action, details, timestamp }) => ({ userEmail, action, details, timestamp }))
                };
                const dataStr = JSON.stringify(dataToExport, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement("a");
                link.href = url;
                link.download = `backup_captacoes_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                logAudit(user, "Exportação de Backup", "Backup completo do sistema exportado para .json");
                showToast("Backup baixado com sucesso!", "success");
            };

            const triggerImport = () => {
                if (fileInputRef.current) {
                    fileInputRef.current.value = ''; 
                    fileInputRef.current.click();
                }
            };

            const handleImportFile = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsLoading(true);

                const reader = new FileReader();
                reader.onload = async (event) => {
                    const fileContent = event.target.result;
                    try {
                        if (!user) throw new Error("Aguarde a conexão com o sistema.");
                        let importedData;
                        try { importedData = JSON.parse(fileContent); } 
                        catch (parseErr) { throw new Error("Arquivo inválido. Use um .json exportado pelo CaptaPro."); }
                        
                        let importCaptures = [];
                        let importBrokers = [];
                        let importPayments = [];
                        let importAuditLogs = [];

                        if (Array.isArray(importedData)) {
                            importCaptures = importedData;
                        } else if (importedData && typeof importedData === 'object') {
                            importCaptures = Array.isArray(importedData.captures) ? importedData.captures : [];
                            importBrokers = Array.isArray(importedData.brokers) ? importedData.brokers : [];
                            importPayments = Array.isArray(importedData.payments) ? importedData.payments : [];
                            importAuditLogs = Array.isArray(importedData.audit_logs) ? importedData.audit_logs : [];
                        } else {
                            throw new Error("Formato de arquivo não reconhecido.");
                        }

                        let newCapturesCount = 0;
                        let newBrokersCount = 0;
                        let newPaymentsCount = 0;
                        let newAuditLogsCount = 0;
                        const capturesRef = window.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'captures');
                        const brokersRef = window.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'brokers');
                        const auditLogsRef = window.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'audit_logs');
                        const paymentsRef = window.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments');

                        const safeString = (val) => (val === null || val === undefined) ? '' : String(val);
                        const currentBrokerNames = brokers.map(b => safeString(b.name).trim().toUpperCase()).filter(Boolean);
                        
                        for (const item of importBrokers) {
                            const bName = safeString(item.name).trim();
                            const bCategory = safeString(item.category).trim() || 'locacao';
                            if (!bName) continue;
                            const nameUpper = bName.toUpperCase();
                            if (!currentBrokerNames.includes(nameUpper)) {
                                await window.addDoc(brokersRef, { name: bName, category: bCategory, createdAt: new Date().toISOString() });
                                currentBrokerNames.push(nameUpper); 
                                newBrokersCount++;
                            }
                        }

                        const addedCapturesKeys = new Set(); 

                        for (const item of importCaptures) {
                            const cCorretor = safeString(item.corretor).trim();
                            const cCodigo = safeString(item.codigo).trim();
                            const cData = safeString(item.data).trim();
                            const cStatus = safeString(item.status).trim() || 'pendente';
                            const cTipo = safeString(item.tipo).trim() || 'locacao';
                            const cRegistrationType = safeString(item.registrationType).trim() || 'primeiro_registro';
                            const cSecondCorretor = safeString(item.secondCorretor).trim();
                            const cAvailability = safeString(item.availability).trim() || 'disponivel';

                            if (!cCorretor || !cCodigo || !cData) continue;

                            const brokerUpper = cCorretor.toUpperCase();
                            if (!currentBrokerNames.includes(brokerUpper)) {
                                await window.addDoc(brokersRef, { name: cCorretor, createdAt: new Date().toISOString() });
                                currentBrokerNames.push(brokerUpper);
                                newBrokersCount++;
                            }

                            if (cSecondCorretor && !currentBrokerNames.includes(cSecondCorretor.toUpperCase())) {
                                await window.addDoc(brokersRef, { name: cSecondCorretor, createdAt: new Date().toISOString() });
                                currentBrokerNames.push(cSecondCorretor.toUpperCase());
                                newBrokersCount++;
                            }

                            const uniqueKey = `${brokerUpper}_${cCodigo.toUpperCase()}_${cData}`;
                            if (addedCapturesKeys.has(uniqueKey)) continue;

                            const isDuplicate = captures.some(c => 
                                safeString(c.corretor).trim().toUpperCase() === brokerUpper &&
                                safeString(c.codigo).trim().toUpperCase() === cCodigo.toUpperCase() &&
                                safeString(c.data).trim() === cData
                            );

                            if (!isDuplicate) {
                                await window.addDoc(capturesRef, {
                                    corretor: cCorretor,
                                    codigo: cCodigo,
                                    data: cData,
                                    secondCorretor: cSecondCorretor || null,
                                    tipo: cTipo,
                                    status: cStatus,
                                    registrationType: cRegistrationType,
                                    availability: cAvailability,
                                    createdAt: new Date().toISOString()
                                });
                                addedCapturesKeys.add(uniqueKey);
                                newCapturesCount++;
                            }
                        }

                        for (const item of importPayments) {
                            const { captureId, codigo, corretor, dataCaptacao, valor, status, dataRegistro, tipoContrato, secondCorretor, hasSecondBroker, dataPagamento } = item;
                            if (!codigo || !valor) continue;
                            
                            await window.addDoc(paymentsRef, {
                                captureId: safeString(captureId),
                                codigo: safeString(codigo),
                                corretor: safeString(corretor),
                                dataCaptacao: safeString(dataCaptacao),
                                valor: Number(valor),
                                status: safeString(status),
                                secondCorretor: safeString(secondCorretor) || null,
                                hasSecondBroker: !!hasSecondBroker,
                                dataRegistro: safeString(dataRegistro),
                                dataPagamento: safeString(dataPagamento) || null,
                                tipoContrato: safeString(tipoContrato) || 'aluguel',
                                createdAt: new Date().toISOString()
                            });
                            newPaymentsCount++;
                        }
                        
                        for (const item of importAuditLogs) {
                            const { userEmail, action, details, timestamp } = item;
                            if (!userEmail || !action || !timestamp) continue;
                            await window.addDoc(auditLogsRef, {
                                userEmail: safeString(userEmail),
                                action: safeString(action),
                                details: safeString(details),
                                timestamp: safeString(timestamp)
                            });
                            newAuditLogsCount++;
                        }

                        
                        await logAudit(user, "Importação de Backup", `Importação concluída! ${newCapturesCount} captações, ${newPaymentsCount} pagamentos e ${newBrokersCount} corretores novos.`);
                        showToast(`Importação concluída! ${newCapturesCount} captações, ${newPaymentsCount} pagamentos e ${newBrokersCount} corretores inseridos.`, "success");
                    } catch (error) {
                        showToast(error.message || "Erro inesperado ao ler o arquivo.", "error");
                    } finally {
                        setIsLoading(false);
                        if (fileInputRef.current) fileInputRef.current.value = '';
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="max-w-xl mx-auto slide-up">
                    <div className="bg-white p-8 md:p-10 rounded-2xl shadow-sm border border-slate-200 text-center">
                        <div className="bg-indigo-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 text-indigo-600 shadow-inner">
                            <Icons.Download />
                        </div>
                        <h2 className="text-2xl font-bold text-slate-800 mb-3">Backup Seguro</h2>
                        <p className="text-slate-500 mb-8 leading-relaxed">
                            Mantenha seus dados seguros exportando um arquivo. O sistema ignora duplicatas automaticamente ao importar um backup.
                        </p>

                        <div className="flex flex-col gap-4">
                            <button 
                                onClick={handleExport}
                                className="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 px-4 rounded-xl transition shadow-md"
                            >
                                <Icons.Download /> Baixar Backup (.json)
                            </button>

                            <input 
                                type="file" 
                                accept=".json, application/json, .txt" 
                                ref={fileInputRef} 
                                className="hidden" 
                                onChange={handleImportFile}
                            />
                            
                            <button 
                                onClick={triggerImport}
                                disabled={isLoading}
                                className={`w-full flex items-center justify-center gap-2 border-2 font-bold py-3.5 px-4 rounded-xl transition ${isLoading ? 'bg-slate-50 border-slate-200 text-slate-400 cursor-wait' : 'bg-white border-slate-300 hover:border-slate-400 hover:bg-slate-50 text-slate-700 shadow-sm'}`}
                            >
                                {isLoading ? (
                                    <span className="animate-pulse flex items-center gap-2">Processando Backup...</span>
                                ) : (
                                    <><Icons.Upload /> Restaurar Dados (.json)</>
                                )}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const AuditLogViewer = ({ showToast, user, dataInicio, setDataInicio, dataFim, setDataFim, auditLogs }) => {
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');

            useEffect(() => {
                if (auditLogs) {
                    setLoading(false);
                }
            }, [auditLogs]);

            const filteredLogs = useMemo(() => {
                if (!auditLogs) return [];
                const term = searchTerm.toLowerCase();
                return auditLogs.filter(log => {
                    const logDate = log.timestamp.split('T')[0];
                    const matchDate = logDate >= dataInicio && logDate <= dataFim;
                    const matchSearch = term === '' ||
                        (log.userEmail && log.userEmail.toLowerCase().includes(term)) ||
                        (log.action && log.action.toLowerCase().includes(term)) ||
                        (log.details && log.details.toLowerCase().includes(term));
                    return matchDate && matchSearch;
                }).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            }, [auditLogs, dataInicio, dataFim, searchTerm]);

            return (
                <div className="max-w-5xl mx-auto slide-up">
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-slate-100 pb-6">
                            <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                                <Icons.Shield /> Registros de Auditoria
                            </h2>
                            <div className="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                                <div className="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus-within:ring-2 focus-within:ring-blue-500 transition w-full sm:w-auto">
                                    <Icons.Calendar />
                                    <span className="text-sm text-slate-500 ml-2 mr-1">De:</span>
                                    <input type="date" value={dataInicio} onChange={(e) => setDataInicio(e.target.value)} className="outline-none bg-transparent text-slate-700 font-medium w-full" />
                                    <span className="text-sm text-slate-500 mx-2">Até:</span>
                                    <input type="date" value={dataFim} onChange={(e) => setDataFim(e.target.value)} className="outline-none bg-transparent text-slate-700 font-medium w-full" />
                                </div>
                                <div className="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 w-full sm:w-auto focus-within:ring-2 focus-within:ring-blue-500">
                                    <Icons.Search className="text-slate-400"/>
                                    <input 
                                        type="text" 
                                        placeholder="Buscar nos registros..."
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="ml-2 outline-none bg-transparent w-full placeholder:text-slate-400"
                                    />
                                </div>
                                <button 
                                    onClick={() => exportAuditPDF(user, filteredLogs, dataInicio, dataFim, showToast)}
                                    className="flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 px-5 rounded-xl transition shadow-sm w-full sm:w-auto"
                                    title="Exportar Relatório de Auditoria"
                                >
                                    <Icons.FileText /> <span className="sm:hidden md:inline">Exportar PDF</span>
                                </button>
                            </div>
                        </div>

                        {loading ? <p>Carregando registros...</p> : (
                            <div className="space-y-3 max-h-[60vh] overflow-y-auto pr-2">
                                {filteredLogs.length === 0 ? (
                                    <p className="text-center text-slate-500 py-10">Nenhum registro de auditoria encontrado para este período.</p>
                                ) : filteredLogs.map(log => (
                                    <div key={log.id} className="bg-slate-50/70 border border-slate-200 p-4 rounded-lg text-sm">
                                        <div className="flex justify-between items-center mb-2">
                                            <p className="font-bold text-slate-800">{log.action}</p>
                                            <p className="text-xs text-slate-500 font-medium">{new Date(log.timestamp).toLocaleString('pt-BR')}</p>
                                        </div>
                                        <p className="text-slate-600 leading-snug">{log.details}</p>
                                        <p className="text-xs text-slate-500 mt-2">Usuário: <span className="font-semibold">{log.userEmail}</span></p>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('dashboard');
            const [selectedBroker, setSelectedBroker] = useState(null);
            
            const [user, setUser] = useState(null);
            const [captures, setCaptures] = useState([]);
            const [auditLogs, setAuditLogs] = useState([]);
            const [isCaptureModalOpen, setIsCaptureModalOpen] = useState(false);
            const [payments, setPayments] = useState([]);
            const [brokers, setBrokers] = useState([]);
            const [authLoading, setAuthLoading] = useState(true); // Renamed from authLoading to avoid confusion
            const [userProfile, setUserProfile] = useState(null);
            const [isAuthorized, setIsAuthorized] = useState(false);

            const [toasts, setToasts] = useState([]);

            const showToast = useCallback((message, type = 'info') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 4000);
            }, []);

            const [dataInicio, setDataInicio] = useState(getDefaultStartDate());
            const [dataFim, setDataFim] = useState(getDefaultEndDate());

            // --- REDIRECIONAMENTO PARA login.html AO SAIR ---
            const handleLogout = async () => {
                try {
                    if (window.auth && window.signOut) {
                        await window.signOut(window.auth);
                        showToast("Sessão encerrada com sucesso.", "success");
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 1000);
                    }
                } catch (e) {
                    showToast("Erro ao encerrar a sessão.", "error");
                }
            };

            useEffect(() => {
                let inactivityTimer;
                const logoutDueToInactivity = async () => {
                    if (window.auth && window.signOut) {
                        try {
                            await window.signOut(window.auth);
                            showToast("Sessão encerrada por inatividade (10 min).", "error");
                        } catch (e) {
                            window.location.href = 'login.html';
                        }
                    }
                };

                const resetTimer = () => {
                    clearTimeout(inactivityTimer);
                    inactivityTimer = setTimeout(logoutDueToInactivity, 10 * 60 * 1000);
                };

                const events = ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'];
                events.forEach(event => window.addEventListener(event, resetTimer));
                resetTimer();

                return () => {
                    clearTimeout(inactivityTimer);
                    events.forEach(event => window.removeEventListener(event, resetTimer));
                };
            }, [showToast]);
            // ------------------------------------------------

            useEffect(() => {
                // IMPORTANTE: Defina aqui os e-mails com permissão de administrador.
                // O email 'gui.mont0ani@gmail.com' é o administrador mestre e sempre terá o papel de Administrador.
                const MASTER_ADMIN_EMAIL = "gui.mont0ani@gmail.com";

                const dataUnsubscribers = [];

                const setupDataListeners = () => {
                    dataUnsubscribers.forEach(unsub => unsub()); dataUnsubscribers.length = 0;
                    const capturesRef = window.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'captures');
                    dataUnsubscribers.push(window.onSnapshot(window.query(capturesRef), (snapshot) => {
                        const capturesData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        // Ensure 'tipo', 'status', 'registrationType', 'availability' have default values if missing
                        const sanitizedCaptures = capturesData.map(capture => ({
                            ...capture,
                            tipo: capture.tipo || 'aluguel',
                            status: capture.status || 'pendente',
                            registrationType: capture.registrationType || 'primeiro_registro',
                            availability: capture.availability || 'disponivel',
                        }));
                        setCaptures(sanitizedCaptures);
                    }));
                    const brokersRef = window.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'brokers');
                    dataUnsubscribers.push(window.onSnapshot(window.query(brokersRef), (snapshot) => { //
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        data.sort((a, b) => a.name.localeCompare(b.name));
                        setBrokers(data);
                    }));
                    const paymentsRef = window.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments');
                    dataUnsubscribers.push(window.onSnapshot(window.query(paymentsRef), (snapshot) => setPayments(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })))));
                    const auditLogsRef = window.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'audit_logs');
                    dataUnsubscribers.push(window.onSnapshot(window.query(auditLogsRef), (snapshot) => setAuditLogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })))));
                };

                const clearAllState = () => {
                    setUser(null); setUserProfile(null); setIsAuthorized(false);
                    setCaptures([]); setBrokers([]); setPayments([]); setAuditLogs([]);
                    dataUnsubscribers.forEach(unsub => unsub());
                    dataUnsubscribers.length = 0;
                };

                const unsubscribeAuth = window.onAuthStateChanged(window.auth, (currentUser) => {
                    if (currentUser) {
                        const userEmail = currentUser.email.toLowerCase();
                        let role = 'Corretor'; // Papel padrão
                        let name = currentUser.displayName || userEmail.split('@')[0];

                        if (userEmail === MASTER_ADMIN_EMAIL.toLowerCase()) {
                            role = 'Administrador';
                        } else {
                            // Busca o papel do usuário no Firestore para outros usuários
                            window.getDoc(window.doc(window.db, 'user_roles', userEmail)).then(roleDoc => {
                                if (roleDoc.exists()) {
                                    const userData = roleDoc.data();
                                    role = userData.role || role;
                                    name = userData.name || name;
                                }
                                // Continue with setting user profile and listeners after role is determined
                                const profile = { email: currentUser.email, name: name, role: role };
                                setUser(currentUser);
                                setUserProfile(profile);
                                console.log("User Profile loaded:", profile); // Added for debugging
                                setIsAuthorized(true); // Todos os usuários logados podem ver o dashboard
                                setupDataListeners();
                                setAuthLoading(false);
                            }).catch(err => {
                                console.error("Erro ao buscar papel do usuário:", err);
                                // Fallback para o papel padrão se houver um erro
                                const profile = { email: currentUser.email, name: name, role: role };
                                setUser(currentUser);
                                setUserProfile(profile);
                                console.log("User Profile loaded (fallback):", profile); // Added for debugging
                                setIsAuthorized(true);
                                setupDataListeners();
                                setAuthLoading(false);
                            });
                            return; // Exit early to avoid setting profile twice
                        }

                        // For MASTER_ADMIN_EMAIL, set profile immediately
                        const profile = { email: currentUser.email, name: name, role: role };
                        setUser(currentUser);
                        setUserProfile(profile);
                        console.log("User Profile loaded (master admin):", profile); // Added for debugging
                        setIsAuthorized(true);
                        setupDataListeners();
                        setAuthLoading(false);
                    } else {
                        clearAllState();
                        setAuthLoading(false);
                        // Apenas redireciona se não houver um token inicial para tentar o login
                        if (!window.__initial_auth_token) {
                           window.location.href = 'login.html';
                        }
                    }
                });

                // Tenta logar com token inicial se existir
                if (window.__initial_auth_token) {
                    window.signInWithCustomToken(window.auth, window.__initial_auth_token).catch(error => {
                        console.error("Auth token error:", error);
                        window.location.href = 'login.html';
                    });
                }

                return () => {
                    unsubscribeAuth();
                    dataUnsubscribers.forEach(unsub => unsub());
                };
            }, [showToast]);

            const navigate = (newView) => {
                setView(newView);
                setSelectedBroker(null);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleBrokerSelect = (brokerName) => {
                setSelectedBroker(brokerName);
                setView('broker');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            if (authLoading) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center bg-slate-50">
                        <div className="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
                        <div className="text-slate-500 font-medium animate-pulse">Conectando ao banco seguro...</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    <ToastContainer toasts={toasts} />
                    
                    <header className="bg-white/85 backdrop-blur-md shadow-sm border-b border-slate-200 sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6">
                            <div className="flex justify-between items-center h-16">
                                <div className="flex items-center gap-2 cursor-pointer" onClick={() => navigate('dashboard')}>
                                    <div className="bg-blue-600 text-white p-1.5 rounded-lg shadow-sm">
                                        <Icons.Home />
                                    </div>
                                    <h1 className="text-xl font-black text-slate-800 tracking-tight">Capta<span className="text-blue-600">Pro</span></h1>
                                </div>
                                <div className="flex items-center gap-3">
                                    <div className="hidden sm:flex items-center space-x-1">
                                        <NavButton icon={<Icons.Home />} label="Painel" active={view === 'dashboard' || view === 'broker'} onClick={() => navigate('dashboard')} /> {/* */}
                                        {userProfile && ['Administrador', 'Gestor'].includes(userProfile.role) && <NavButton icon={<Icons.Users />} label="Equipe" active={view === 'brokers'} onClick={() => navigate('brokers')} />} {/* */}
                                        {userProfile && ['Administrador', 'Gestor', 'Financeiro', 'Gerente'].includes(userProfile.role) && <NavButton icon={<Icons.DollarSign />} label="Financeiro" active={view === 'financeiro'} onClick={() => navigate('financeiro')} />} {/* */}
                                        {userProfile?.role === 'Administrador' && <a href="master.html" className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold transition text-slate-500 hover:bg-slate-100 hover:text-slate-900" title="Painel do Administrador"><Icons.Sliders /> <span>Admin</span></a>}
                                        
                                        {userProfile && (['Administrador', 'Gestor'].includes(userProfile.role) || (userProfile.role === 'Gerente' && view === 'audit')) && <div className="w-px h-6 bg-slate-200 mx-2"></div>} {/* */}

                                        {userProfile && ['Administrador', 'Gestor'].includes(userProfile.role) && <NavButton icon={<Icons.Download />} label="Backup" active={view === 'backup'} onClick={() => navigate('backup')} />}
                                        {userProfile && ['Administrador', 'Gestor', 'Gerente', 'Financeiro'].includes(userProfile.role) && <NavButton icon={<Icons.Shield />} label="Auditoria" active={view === 'audit'} onClick={() => navigate('audit')} />}
                                        <NavButton icon={<Icons.LogOut />} label="Sair" onClick={handleLogout} danger />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>
                    <nav className="sm:hidden fixed bottom-0 w-full bg-white border-t border-slate-200 z-40 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        <div className="flex justify-around items-center h-16 px-1">
                            <MobileNavButton icon={<Icons.Home />} label="Painel" active={view === 'dashboard' || view === 'broker'} onClick={() => navigate('dashboard')} />
                            {userProfile && ['Administrador', 'Gestor', 'Financeiro', 'Gerente'].includes(userProfile.role) && <MobileNavButton icon={<Icons.DollarSign />} label="Finanças" active={view === 'financeiro'} onClick={() => navigate('financeiro')} />}
                            {userProfile && ['Administrador', 'Gestor'].includes(userProfile.role) && <MobileNavButton icon={<Icons.Plus />} label="Nova" onClick={() => setIsCaptureModalOpen(true)} highlight />}
                            {userProfile && ['Administrador', 'Gestor'].includes(userProfile.role) && <MobileNavButton icon={<Icons.Users />} label="Equipe" active={view === 'brokers'} onClick={() => navigate('brokers')} />}
                            
                            {userProfile?.role === 'Administrador' && <a href="master.html" className="flex flex-col items-center justify-center w-full h-full space-y-1 transition text-slate-400 hover:text-slate-600"><Icons.Sliders className="h-6 w-6" /><span className="text-[10px] font-bold">Admin</span></a>}
                            {userProfile && ['Administrador', 'Gestor', 'Gerente', 'Financeiro'].includes(userProfile.role) && <MobileNavButton icon={<Icons.Shield />} label="Auditoria" active={view === 'audit'} onClick={() => navigate('audit')} />}
                        </div>
                    </nav>

                    <main className="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 pt-4 sm:pt-6 pb-28 sm:pb-20 overflow-x-hidden">
                        {view === 'financeiro' && userProfile && ['Administrador', 'Gestor', 'Financeiro', 'Gerente'].includes(userProfile.role) && <Finance captures={captures} payments={payments} brokers={brokers} user={user} showToast={showToast} dataInicio={dataInicio} setDataInicio={setDataInicio} dataFim={dataFim} setDataFim={dataFim} userProfile={userProfile} />} {/* */}
                        {view === 'brokers' && userProfile && ['Administrador', 'Gestor'].includes(userProfile.role) && <BrokerManager user={user} brokers={brokers} showToast={showToast} userProfile={userProfile} />}
                        {view === 'dashboard' && <Dashboard user={user} captures={captures} brokers={brokers} setView={navigate} onSelectBroker={handleBrokerSelect} showToast={showToast} dataInicio={dataInicio} setDataInicio={setDataInicio} dataFim={dataFim} setDataFim={setDataFim} />}
                        {view === 'broker' && selectedBroker && <BrokerDetails captures={captures} brokerName={selectedBroker} onBack={() => navigate('dashboard')} user={user} brokers={brokers} showToast={showToast} dataInicio={dataInicio} setDataInicio={setDataInicio} dataFim={dataFim} setDataFim={setDataFim} userProfile={userProfile} />}
                        {view === 'backup' && userProfile && ['Administrador', 'Gestor'].includes(userProfile.role) && <BackupManager captures={captures} payments={payments} user={user} brokers={brokers} showToast={showToast} logAudit={logAudit} auditLogs={auditLogs} />}
                        {view === 'audit' && userProfile && ['Administrador', 'Gestor', 'Gerente', 'Financeiro'].includes(userProfile.role) && <AuditLogViewer showToast={showToast} user={user} dataInicio={dataInicio} setDataInicio={setDataFim} dataFim={dataFim} auditLogs={auditLogs} />}
                        <CaptureForm isOpen={isCaptureModalOpen} onClose={() => setIsCaptureModalOpen(false)} user={user} brokers={brokers} showToast={showToast} captures={captures} navigate={navigate} userProfile={userProfile} />
                    </main>

                    {userProfile && ['Administrador', 'Gestor'].includes(userProfile.role) && (
                        <button onClick={() => setIsCaptureModalOpen(true)} className="fixed right-6 bottom-10 sm:right-8 bg-blue-600 hover:bg-blue-700 text-white rounded-xl px-6 py-3 hidden sm:flex items-center justify-center gap-2 shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-110 z-40" title="Registrar Nova Captação">
                            <Icons.Plus /> 
                            <span className="font-semibold">Nova Captação</span>
                        </button>
                    )}

                    <footer className="fixed bottom-0 left-0 right-0 z-30 bg-white/90 backdrop-blur-sm border-t border-slate-200 py-2 px-4 text-center text-slate-400 text-xs">
                        <div className="max-w-7xl mx-auto flex flex-wrap justify-center items-center gap-x-4 gap-y-1">
                            <div className="flex items-center gap-1.5 text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-0.5 rounded-full border border-slate-200">
                                <span className={`w-2 h-2 rounded-full ${user ? 'bg-green-500' : 'bg-red-500'}`}></span>
                                {user ? 'Online' : 'Offline'}
                            </div>
                            {userProfile && <p className="font-semibold text-slate-500">Logado como: {userProfile.name} ({userProfile.role})</p>} {/* */}
                            <p>CaptaPro - Versão 4.0 - Criado por Guilherme Montoani</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const NavButton = ({ icon, label, active, onClick, highlight, danger }) => {
            if (danger) {
                return (
                    <button onClick={onClick} className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold text-red-600 hover:bg-red-50 hover:text-red-700 transition" title="Sair do Sistema">
                        {icon} {label && <span>{label}</span>}
                    </button>
                );
            }
            return (
                <button onClick={onClick} className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold transition ${active ? 'bg-slate-100 text-blue-700' : 'text-slate-500 hover:bg-slate-100 hover:text-slate-900'}`}>
                    {icon} <span>{label}</span>
                </button>
            );
        }

        const MobileNavButton = ({ icon, label, active, onClick, highlight }) => {
            if (highlight) {
                 return (
                    <button onClick={onClick} className="flex flex-col items-center justify-center w-full h-full relative top-[-15px]">
                        <div className="p-4 rounded-full shadow-lg bg-blue-600 text-white shadow-blue-300">
                            {React.cloneElement(icon, { className: "h-6 w-6"})}
                        </div>
                        <span className="text-[10px] mt-1.5 font-bold text-blue-700">{label}</span>
                    </button>
                );
            }
            return (
                <button onClick={onClick} className={`flex flex-col items-center justify-center w-full h-full space-y-1 transition ${active ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                    {React.cloneElement(icon, { className: "h-6 w-6"})}
                    <span className="text-[10px] font-bold">{label}</span>
                </button>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
