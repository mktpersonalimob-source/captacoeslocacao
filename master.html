<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - CaptaPro</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232563EB%22></rect><text x=%2250%22 y=%2250%22 font-size=%2250%22 dy=%22.35em%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22bold%22>A</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f1f5f9; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .slide-up { animation: slideUp 0.4s ease-out forwards; }
        .toast-enter { animation: toastEnter 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastEnter { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-200 selection:text-blue-900">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, addDoc, collection, query, onSnapshot, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxPTPN6UGWt3lkidtwU2hMF_sU7RGOeEo",
            authDomain: "cap-pro-loc.firebaseapp.com",
            projectId: "cap-pro-loc",
            storageBucket: "cap-pro-loc.firebasestorage.app",
            messagingSenderId: "1026522877878",
            appId: "1:1026522877878:web:cc8d2f156fd0bee024bb17",
            measurementId: "G-D00DLYECPN"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        window.db = db;
        window.auth = auth;
        window.signOut = signOut;
        window.onAuthStateChanged = onAuthStateChanged;
        window.collection = collection;
        window.query = query;
        window.onSnapshot = onSnapshot;
        window.addDoc = addDoc;
        window.updateDoc = updateDoc;
        window.getDoc = getDoc;
        window.setDoc = setDoc;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.__app_id = 'captacoes-app';
    </script>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const Icons = {
            User: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            Sliders: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>,
            Shield: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        };

        const logAudit = async (user, action, details) => {
            if (!user || !user.email) return;
            try {
                const auditRef = window.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'audit_logs');
                await window.addDoc(auditRef, { userEmail: user.email, action, details, timestamp: new Date().toISOString() });
            } catch (error) { console.error("Failed to write audit log:", error); }
        };

        const ToastContainer = ({ toasts }) => (
            <div className="fixed top-20 right-4 z-50 flex flex-col gap-3 pointer-events-none">
                {toasts.map(toast => (
                    <div key={toast.id} className={`toast-enter pointer-events-auto flex items-center gap-3 px-5 py-3 rounded-xl shadow-lg border ${toast.type === 'error' ? 'bg-red-50 border-red-200 text-red-800' : 'bg-green-50 border-green-200 text-green-800'}`}>
                        {toast.type === 'error' ? <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> : <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>}
                        <p className="font-medium">{toast.message}</p>
                    </div>
                ))}
            </div>
        );

        const ConfirmModal = ({ isOpen, title, message, btnConfirm, btnCancel, onConfirm, onCancel, type = "primary" }) => {
            if (!isOpen) return null;
            const btnColor = type === 'danger' ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700';
            return (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 slide-up">
                        <h3 className="text-xl font-bold text-slate-800 mb-2">{title}</h3>
                        <p className="text-slate-600 mb-8 leading-relaxed">{message}</p>
                        <div className="flex flex-col sm:flex-row gap-3">
                            <button onClick={onCancel} className="flex-1 bg-slate-100 text-slate-700 font-semibold py-2.5 px-4 rounded-xl hover:bg-slate-200 transition">{btnCancel}</button>
                            <button onClick={onConfirm} className={`flex-1 text-white font-semibold py-2.5 px-4 rounded-xl transition shadow-sm ${btnColor}`}>{btnConfirm}</button>
                        </div>
                    </div>
                </div>
            );
        };

        const UserRoleManager = ({ showToast }) => {
            const [users, setUsers] = useState([]);
            const [newUserEmail, setNewUserEmail] = useState('');
            const [newUserName, setNewUserName] = useState('');
            const [newUserRole, setNewUserRole] = useState('Gerente');
            const [editingUser, setEditingUser] = useState(null);
            const [deletingUser, setDeletingUser] = useState(null);

            useEffect(() => {
                const rolesRef = window.collection(window.db, 'user_roles');
                const q = window.query(rolesRef);
                const unsubscribe = window.onSnapshot(q, (snapshot) => {
                    const userList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setUsers(userList.sort((a, b) => a.name.localeCompare(b.name)));
                });
                return () => unsubscribe();
            }, []);

            const handleAddUser = async (e) => {
                e.preventDefault();
                if (!newUserEmail.trim() || !newUserName.trim()) {
                    showToast('Preencha e-mail e nome.', 'error');
                    return;
                }
                const email = newUserEmail.trim().toLowerCase();
                if (users.some(u => u.id === email)) {
                    showToast('Este e-mail já está cadastrado.', 'error');
                    return;
                }
                try {
                    const userDocRef = window.doc(window.db, 'user_roles', email);
                    await window.setDoc(userDocRef, { name: newUserName.trim(), role: newUserRole });
                    showToast('Usuário adicionado com sucesso!', 'success');
                    setNewUserEmail(''); setNewUserName(''); setNewUserRole('Gerente');
                } catch (error) { showToast('Erro ao adicionar usuário.', 'error'); }
            };

            const handleUpdateUser = async () => {
                if (!editingUser) return;
                try {
                    const userDocRef = window.doc(window.db, 'user_roles', editingUser.id);
                    await window.updateDoc(userDocRef, { name: editingUser.name, role: editingUser.role });
                    showToast('Usuário atualizado com sucesso!', 'success');
                    setEditingUser(null);
                } catch (error) { showToast('Erro ao atualizar usuário.', 'error'); }
            };

            const handleDeleteUser = async () => {
                if (!deletingUser) return;
                try {
                    const userDocRef = window.doc(window.db, 'user_roles', deletingUser.id);
                    await window.deleteDoc(userDocRef);
                    showToast('Usuário removido com sucesso.', 'success');
                    setDeletingUser(null);
                } catch (error) { showToast('Erro ao remover usuário.', 'error'); }
            };

            const roleColors = {
                Administrador: 'bg-red-100 text-red-700',
                Gestor: 'bg-blue-100 text-blue-700',
                Gerente: 'bg-purple-100 text-purple-700',
                Financeiro: 'bg-green-100 text-green-700',
            };

            return (
                <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                    <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2 mb-2"><Icons.Shield /> Usuários do Sistema</h2>
                    <p className="text-slate-500 mb-6">Cadastre e gerencie os acessos dos usuários ao sistema.</p>
                    
                    <form onSubmit={handleAddUser} className="grid grid-cols-1 md:grid-cols-3 gap-4 items-end bg-slate-50 p-4 rounded-xl border border-slate-200 mb-8">
                        <div>
                            <label className="block text-sm font-semibold text-slate-600 mb-1">E-mail do Usuário</label>
                            <input type="email" value={newUserEmail} onChange={e => setNewUserEmail(e.target.value)} placeholder="email@exemplo.com" className="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" />
                        </div>
                        <div>
                            <label className="block text-sm font-semibold text-slate-600 mb-1">Nome</label>
                            <input type="text" value={newUserName} onChange={e => setNewUserName(e.target.value)} placeholder="Nome Sobrenome" className="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" />
                        </div>
                        <div>
                            <label className="block text-sm font-semibold text-slate-600 mb-1">Nível de Acesso</label>
                            <select value={newUserRole} onChange={e => setNewUserRole(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                <option value="Gerente">Gerente</option>
                                <option value="Financeiro">Financeiro</option>
                                <option value="Gestor">Gestor</option>
                                <option value="Administrador">Administrador</option>
                            </select>
                        </div>
                        <button type="submit" className="md:col-span-3 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl transition shadow-sm">Adicionar Usuário</button>
                    </form>

                    <h3 className="font-semibold text-slate-700 mb-4">Usuários Cadastrados</h3>
                    <ul className="space-y-3">
                        {users.map(u => (
                            <li key={u.id} className="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200 group">
                                <div className="flex items-center gap-3">
                                    <div className="bg-slate-200 text-slate-600 p-2 rounded-lg"><Icons.User /></div>
                                    <div>
                                        <p className="font-bold text-slate-800">{u.name}</p>
                                        <p className="text-sm text-slate-500">{u.id}</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-4">
                                    <span className={`px-3 py-1 rounded-full text-xs font-bold ${roleColors[u.role] || 'bg-slate-200 text-slate-700'}`}>{u.role}</span>
                                    {u.id !== 'gui.mont0ani@gmail.com' && (
                                        <div className="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <button onClick={() => setEditingUser(u)} className="text-slate-400 hover:text-blue-600 p-2 rounded-lg hover:bg-blue-50 transition" title="Editar Usuário"><Icons.Edit /></button>
                                            <button onClick={() => setDeletingUser(u)} className="text-slate-400 hover:text-red-500 p-2 rounded-lg hover:bg-red-50 transition" title="Remover Usuário"><Icons.Trash /></button>
                                        </div>
                                    )}
                                </div>
                            </li>
                        ))}
                    </ul>

                    {editingUser && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                            <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 slide-up">
                                <h3 className="text-xl font-bold text-slate-800 mb-4">Editar Usuário</h3>
                                <div className="space-y-4">
                                    <div><label className="block text-sm font-semibold text-slate-700 mb-1">E-mail</label><input type="text" value={editingUser.id} disabled className="w-full px-4 py-3 rounded-xl border bg-slate-100 text-slate-500 cursor-not-allowed" /></div>
                                    <div><label className="block text-sm font-semibold text-slate-700 mb-1">Nome</label><input type="text" value={editingUser.name} onChange={(e) => setEditingUser({...editingUser, name: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none transition" /></div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1">Nível de Acesso</label>
                                        <select value={editingUser.role} onChange={(e) => setEditingUser({...editingUser, role: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none transition bg-white">
                                            <option value="Gerente">Gerente</option>
                                            <option value="Financeiro">Financeiro</option>
                                            <option value="Gestor">Gestor</option>
                                            <option value="Administrador">Administrador</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="flex gap-3 mt-8">
                                    <button onClick={() => setEditingUser(null)} className="flex-1 bg-slate-100 text-slate-700 py-2.5 rounded-xl font-semibold hover:bg-slate-200 transition">Cancelar</button>
                                    <button onClick={handleUpdateUser} className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-semibold hover:bg-blue-700 transition shadow-sm">Salvar Alterações</button>
                                </div>
                            </div>
                        </div>
                    )}
                    <ConfirmModal isOpen={!!deletingUser} title="Remover Usuário" message={`Deseja remover o acesso de "${deletingUser?.name}" (${deletingUser?.id})? O usuário não poderá mais fazer login.`} btnConfirm="Sim, Remover" btnCancel="Cancelar" type="danger" onCancel={() => setDeletingUser(null)} onConfirm={handleDeleteUser} />
                </div>
            );
        };

        const AdminPage = ({ user, showToast }) => {
            return (
                <div className="max-w-5xl mx-auto slide-up space-y-8">
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                        <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2 mb-2"><Icons.Sliders /> Painel de Administração</h2>
                        <p className="text-slate-500">Gerencie as configurações e usuários do sistema.</p>
                    </div>
                    <UserRoleManager showToast={showToast} />
                </div>
            );
        };

        const MasterApp = () => {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [isAuthorized, setIsAuthorized] = useState(false);
            const [toasts, setToasts] = useState([]);

            const ADMIN_EMAIL = "gui.mont0ani@gmail.com";

            const showToast = useCallback((message, type = 'info') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => { setToasts(prev => prev.filter(t => t.id !== id)); }, 4000);
            }, []);

            const handleLogout = async () => {
                try {
                    await window.signOut(window.auth);
                    showToast("Sessão encerrada.", "success");
                    setTimeout(() => { window.location.href = 'login.html'; }, 1000);
                } catch (e) { showToast("Erro ao encerrar a sessão.", "error"); }
            };

            useEffect(() => {
                const unsubscribeAuth = window.onAuthStateChanged(window.auth, (currentUser) => {
                    if (currentUser) {
                        const userEmail = currentUser.email.toLowerCase();

                        // Prioritize Admin check (synchronous)
                        if (userEmail === ADMIN_EMAIL.toLowerCase()) {
                            setUser(currentUser);
                            setIsAuthorized(true);
                            setAuthLoading(false);
                            return; // Exit early, admin is authorized
                        }

                        // For other users, check Firestore for "Administrador" role
                        const userRoleRef = window.doc(window.db, 'user_roles', userEmail);
                        window.getDoc(userRoleRef).then(roleDoc => {
                            if (roleDoc.exists() && roleDoc.data().role === "Administrador") {
                                setUser(currentUser);
                                setIsAuthorized(true);
                            } else {
                                // Not the master admin and not an admin in the DB
                                setIsAuthorized(false);
                                showToast("Acesso negado. Esta é uma área restrita.", "error");
                                setTimeout(() => { window.location.href = 'dashboard.html'; }, 2000);
                            }
                            setAuthLoading(false);
                        }).catch(err => {
                            console.error("Erro ao verificar permissões de admin:", err);
                            setIsAuthorized(false);
                            setAuthLoading(false);
                            showToast("Erro ao verificar permissões.", "error");
                            setTimeout(() => { window.location.href = 'dashboard.html'; }, 2000);
                        });
                    } else {
                        setAuthLoading(false);
                        window.location.href = 'login.html';
                    }
                });
                return () => unsubscribeAuth();
            }, [showToast]);

            if (authLoading) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center bg-slate-50">
                        <div className="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
                        <div className="text-slate-500 font-medium animate-pulse">Verificando permissões...</div>
                    </div>
                );
            }

            if (!isAuthorized) {
                return (
                     <div className="h-screen flex flex-col items-center justify-center bg-slate-50">
                        <ToastContainer toasts={toasts} />
                        <div className="w-12 h-12 border-4 border-red-200 border-t-red-600 rounded-full animate-spin mb-4"></div>
                        <div className="text-slate-500 font-medium">Acesso Negado. Redirecionando...</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    <ToastContainer toasts={toasts} />
                    <header className="bg-white/85 backdrop-blur-md shadow-sm border-b border-slate-200 sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6">
                            <div className="flex justify-between items-center h-16">
                                <div className="flex items-center gap-2">
                                    <div className="bg-blue-600 text-white p-1.5 rounded-lg shadow-sm"><Icons.Sliders /></div>
                                    <h1 className="text-xl font-black text-slate-800 tracking-tight">Admin <span className="text-blue-600">CaptaPro</span></h1>
                                </div>
                                <div className="flex items-center gap-3">
                                    <a href="dashboard.html" className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold text-slate-500 hover:bg-slate-100 hover:text-slate-900 transition">Voltar ao Dashboard</a>
                                    <button onClick={handleLogout} className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold text-red-600 hover:bg-red-50 hover:text-red-700 transition" title="Sair do Sistema">
                                        <Icons.LogOut /> <span>Sair</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 pt-4 sm:pt-6 pb-20">
                        <AdminPage showToast={showToast} />
                    </main>

                    <footer className="fixed bottom-0 left-0 right-0 z-30 bg-white/90 backdrop-blur-sm border-t border-slate-200 py-2 px-4 text-center text-slate-400 text-xs">
                        <div className="max-w-7xl mx-auto flex flex-wrap justify-center items-center gap-x-4 gap-y-1">
                            <div className="flex items-center gap-1.5 text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-0.5 rounded-full border border-slate-200">
