    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, addDoc, collection, query, onSnapshot, updateDoc, deleteDoc, where, getDocs, orderBy, or, and, limit, startAfter } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration setup
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                apiKey: "AIzaSyBxPTPN6UGWt3lkidtwU2hMF_sU7RGOeEo",
                authDomain: "cap-pro-loc.firebaseapp.com",
                projectId: "cap-pro-loc",
                storageBucket: "cap-pro-loc.firebasestorage.app",
                messagingSenderId: "1026522877878",
                appId: "1:1026522877878:web:cc8d2f156fd0bee024bb17",
                measurementId: "G-D00DLYECPN"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        window.db = db;
        window.auth = auth;
        window.signOut = signOut;
        window.signInWithCustomToken = signInWithCustomToken;
        window.onAuthStateChanged = onAuthStateChanged;
        window.collection = collection;
        window.query = query;
        window.getDoc = getDoc;
        window.onSnapshot = onSnapshot;
        window.addDoc = addDoc;
        window.updateDoc = updateDoc;
        window.where = where;
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;
        window.orderBy = orderBy;
        window.or = or;
        window.and = and;
        window.limit = limit;
        window.startAfter = startAfter;
        window.doc = doc;
        window.__app_id = typeof __app_id !== 'undefined' ? __app_id : 'captacoes-app';
        window.__initial_auth_token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // --- Extracted Icons ---
        const Icons = {
            Home: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>,
            User: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            DollarSign: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>,
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            Menu: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
        };

        const getDefaultStartDate = () => {
            const d = new Date();
            return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().split('T')[0];
        };

        const getDefaultEndDate = () => {
            const d = new Date();
            return new Date(d.getFullYear(), d.getMonth() + 1, 0).toISOString().split('T')[0];
        };

        const formatMoney = (value) => {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        };

        const formatDateToBR = (dateString) => {
            if(!dateString) return "";
            const [year, month, day] = dateString.split('-');
            return `${day}/${month}/${year}`;
        };

        const logAudit = async (user, action, details) => {
            if (!user || !user.email) {
                console.warn("Audit log skipped: user not available.");
                return;
            }
            try {
                const auditRef = window.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'audit_logs');
                await window.addDoc(auditRef, {
                    userEmail: user.email,
                    action: action,
                    details: details,
                    timestamp: new Date().toISOString()
                });
            } catch (error) {
                console.error("Failed to write audit log:", error);
            }
        };

        const ConfirmModal = ({ isOpen, title, message, btnConfirm, btnCancel, onConfirm, onCancel, type = "primary" }) => {
            if (!isOpen) return null;
            const btnColor = type === 'danger' ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700';
            
            return (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 slide-up">
                        <h3 className="text-xl font-bold text-slate-800 mb-2">{title}</h3>
                        <p className="text-slate-600 mb-8 leading-relaxed">{message}</p>
                        <div className="flex flex-col sm:flex-row gap-3">
                            <button onClick={onCancel} className="flex-1 bg-slate-100 text-slate-700 font-semibold py-2.5 px-4 rounded-xl hover:bg-slate-200 transition">
                                {btnCancel}
                            </button>
                            <button onClick={onConfirm} className={`flex-1 text-white font-semibold py-2.5 px-4 rounded-xl transition shadow-sm ${btnColor}`}>
                                {btnConfirm}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ToastContainer = ({ toasts }) => {
            return (
                <div className="fixed top-20 right-4 z-50 flex flex-col gap-3 pointer-events-none">
                    {toasts.map(toast => (
                        <div key={toast.id} className={`toast-enter pointer-events-auto flex items-center gap-3 px-5 py-3 rounded-xl shadow-lg border ${toast.type === 'error' ? 'bg-red-50 border-red-200 text-red-800' : 'bg-green-50 border-green-200 text-green-800'}`}>
                            {toast.type === 'error' ? (
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            ) : (
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                            )}
                            <p className="font-medium">{toast.message}</p>
                        </div>
                    ))}
                </div>
            );
        };

        const Finance = ({ isLoaded, brokers, user, showToast, dataInicio, setDataInicio, dataFim, setDataFim, firebaseApi, logAudit, userProfile }) => {
            const [payments, setPayments] = useState([]);
            const [captures, setCaptures] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedBroker, setSelectedBroker] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [deletingItem, setDeletingItem] = useState(null);
            const [brokerCategoryFilter, setBrokerCategoryFilter] = useState('todos');
            const [statusFilter, setStatusFilter] = useState('todos');
            const [currentPage, setCurrentPage] = useState(1);
            const [selectedToLaunch, setSelectedToLaunch] = useState([]);
            const [editingPayment, setEditingPayment] = useState(null);
            const [newPaymentValue, setNewPaymentValue] = useState('');
            
            // State for new payment modal
            const [selectedCapture, setSelectedCapture] = useState('');
            const [showPaymentConfirm, setShowPaymentConfirm] = useState(false);
            const [valor, setValor] = useState('');
            const [captureSearchTerm, setCaptureSearchTerm] = useState('');
            const [captureSearchStartDate, setCaptureSearchStartDate] = useState(getDefaultStartDate());
            const [captureSearchEndDate, setCaptureSearchEndDate] = useState(getDefaultEndDate());
            
            const handleAddNewPayment = () => {
                setSelectedCapture('');
                setValor('');
                setCaptureSearchTerm('');
                setShowPaymentConfirm(false);
            };

            const handleClosePaymentModal = () => {
                setShowPaymentConfirm(false);
                setIsModalOpen(false);
                setSelectedCapture('');
                setValor('');
                setCaptureSearchTerm('');
            };

            const fetchData = useCallback(() => {
                if (!user || !dataInicio || !dataFim || !isLoaded) {
                    if (isLoaded) setLoading(false);
                    return;
                }
                setLoading(true);
                const { query, collection, onSnapshot, where } = firebaseApi;
                const paymentsRef = collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments');
                
                const q = query(paymentsRef, where("dataRegistro", ">=", dataInicio), where("dataRegistro", "<=", dataFim));
    
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const allData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setPayments(allData);
                    setLoading(false);
                }, (error) => {
                    console.error("Error fetching payments:", error);
                    showToast("Erro ao carregar pagamentos. Verifique o console para criar índices.", "error");
                    setLoading(false);
                });
    
                return () => unsubscribe();
            }, [user, dataInicio, dataFim, isLoaded, firebaseApi, showToast]);

            useEffect(() => {
                let unsubscribe;
                if (isLoaded) {
                    unsubscribe = fetchData();
                }
                return () => { if (unsubscribe) unsubscribe(); };
            }, [fetchData, isLoaded]);

            useEffect(() => {
                if (!user || !isModalOpen) {
                    setCaptures([]);
                    return;
                };
                const { query, collection, where } = firebaseApi;
                const capturesRef = collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'captures');
                const q = query(capturesRef,
                    where("data", ">=", captureSearchStartDate),
                    where("data", "<=", captureSearchEndDate));
                firebaseApi.getDocs(q).then(snapshot => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setCaptures(data);
                }).catch(err => {
                    console.error("Error fetching captures for modal:", err);
                });
            }, [user, isModalOpen, captureSearchStartDate, captureSearchEndDate]);

            const filteredPayments = useMemo(() => {
                const brokerCategoryMap = new Map(brokers.map(b => [b.name, b.category || 'locacao']));
                return payments.filter(p => {
                    const matchBroker = selectedBroker ? p.corretor === selectedBroker : true;
                    const brokerCategory = brokerCategoryMap.get(p.corretor);
                    const matchCategory = brokerCategoryFilter === 'todos' ? true : brokerCategory === brokerCategoryFilter;
                    const matchStatus = statusFilter === 'todos' ? true : p.status === statusFilter;
                    return matchBroker && matchStatus && matchCategory;
                }).sort((a, b) => new Date(b.dataRegistro) - new Date(a.dataRegistro));
            }, [payments, selectedBroker, statusFilter, brokerCategoryFilter, brokers]);

            useEffect(() => {
                // Reset page to 1 when filters change
                setCurrentPage(1);
            }, [filteredPayments]);

            const itemsPerPage = 10;
            const totalPages = Math.ceil(filteredPayments.length / itemsPerPage);

            const paginatedPayments = useMemo(() => {
                return filteredPayments.slice(
                    (currentPage - 1) * itemsPerPage,
                    currentPage * itemsPerPage
                );
            }, [filteredPayments, currentPage]);

            const handleUpdatePaymentValue = async () => {
                if (!editingPayment || !newPaymentValue) {
                    showToast("Informe um valor válido.", "error");
                    return;
                }
                const numValor = parseFloat(newPaymentValue.replace(',', '.'));
                if (isNaN(numValor) || numValor <= 0) {
                    showToast("O valor deve ser um número maior que zero.", "error");
                    return;
                }

                try {
                    if (!user) return;
                    const docRef = firebaseApi.doc(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments', editingPayment.id);
                    await firebaseApi.updateDoc(docRef, {
                        valor: numValor,
                        status: 'A pagar',
                        lastModifiedBy: user.email
                    });
                    await logAudit(user, "Atualização de Valor de Pagamento", `Captação Cód: ${editingPayment.codigo}, Novo Valor: ${formatMoney(numValor)}`);
                    setEditingPayment(null);
                    setNewPaymentValue('');
                    showToast("Valor do pagamento atualizado com sucesso!", "success");
                } catch (err) {
                    showToast("Erro ao atualizar o valor.", "error");
                }
            };

            useEffect(() => {
                if (!user || !isModalOpen) {
                    setCaptures([]);
                    return;
                };
                const { query, collection, onSnapshot, where } = firebaseApi;
                const capturesRef = collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'captures');
                const q = query(capturesRef,
                    where("data", ">=", captureSearchStartDate),
                    where("data", "<=", captureSearchEndDate));
                firebaseApi.getDocs(q).then(snapshot => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setCaptures(data);
                });
            }, [user, isModalOpen, captureSearchStartDate, captureSearchEndDate]);

            const filteredCapturesForSelect = useMemo(() => {
                const term = captureSearchTerm.toLowerCase();
                return captures.filter(c => {
                    return (c.codigo && c.codigo.toLowerCase().includes(term)) || (c.corretor && c.corretor.toLowerCase().includes(term));
                }).sort((a,b) => new Date(b.data) - new Date(a.data));
            }, [captures, captureSearchTerm, captureSearchStartDate, captureSearchEndDate]);

            const handleAddPayment = async (e) => {
                e.preventDefault();
                if (!selectedCapture || !valor) {
                    showToast("Selecione a captação e informe o valor.", "error");
                    return;
                }
                const numValor = parseFloat(valor.replace(',', '.'));
                if (isNaN(numValor) || numValor <= 0) {
                    showToast("Valor inválido.", "error");
                    return;
                }
                const cap = captures.find(c => c.id === selectedCapture);
                if (!cap) return;

                const involvedBrokers = cap.corretores || (cap.corretor ? [cap.corretor] : []);
                if (involvedBrokers.length === 0) {
                    showToast("A captação selecionada não tem corretores associados.", "error");
                    return;
                }

                try {
                    if (!user) return;
                    const payRef = firebaseApi.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments');
                    
                    for (const brokerName of involvedBrokers) {
                        await firebaseApi.addDoc(payRef, {
                            captureId: cap.id,
                            codigo: cap.codigo,
                            corretor: brokerName,
                            todosCorretores: involvedBrokers,
                            dataCaptacao: cap.data,
                            tipoContrato: cap.tipo || 'aluguel',
                            valor: numValor,
                            status: 'A pagar',
                            dataRegistro: new Date().toISOString().split('T')[0],
                            createdAt: new Date().toISOString(),
                            createdBy: user.email
                        });
                    }
                    
                    await logAudit(user, "Criação de Lançamento Financeiro", `Captação Cód: ${cap.codigo}, Valor: ${formatMoney(numValor)} para ${involvedBrokers.length} corretor(es).`);
                    setShowPaymentConfirm(true);
                    showToast(`Valor a pagar lançado para ${involvedBrokers.length} corretor(es)!`, "success");
                } catch (err) {
                    showToast("Erro ao lançar pagamento.", "error");
                }
            };

            const handleLaunchPayments = async (paymentIds) => {
                if (paymentIds.length === 0) {
                    showToast("Nenhuma comissão selecionada para lançar.", "error");
                    return;
                }
                try {
                    if (!user) return;
                    const launchDate = new Date().toISOString();
                    for (const paymentId of paymentIds) {
                        const docRef = firebaseApi.doc(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments', paymentId);
                        await firebaseApi.updateDoc(docRef, {
                            status: 'Lançado',
                            dataLancamento: launchDate,
                            lastModifiedBy: user.email
                        });
                    }
                    await logAudit(user, "Lançamento de Comissão", `Lançou ${paymentIds.length} comissão(ões) para a carteira.`);
                    setSelectedToLaunch([]);
                    showToast(`${paymentIds.length} comissão(ões) foi/foram lançada(s) para a carteira.`, "success");
                } catch (err) {
                    showToast("Erro ao lançar comissões.", "error");
                }
            };

            return (
                <React.Fragment>
                    <div className="max-w-7xl mx-auto slide-up">
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                        <div className="border-b border-slate-200 pb-6 mb-8">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                                    <Icons.DollarSign /> Captações a Pagar
                                </h2>
                                <p className="text-slate-500 text-sm mt-1">Gerencie os lançamentos e pagamentos financeiros das captações.</p>
                            </div>
                            <div className="flex flex-wrap items-center gap-3 mt-6">
                                <div className="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 w-full sm:w-auto">
                                    <span className="text-sm text-slate-500 mr-2">De:</span>
                                    <input type="date" value={dataInicio} onChange={(e) => setDataInicio(e.target.value)} className="outline-none bg-transparent w-full sm:w-32 font-medium" />
                                    <span className="text-sm text-slate-500 mx-2">Até:</span>
                                    <input type="date" value={dataFim} onChange={(e) => setDataFim(e.target.value)} className="outline-none bg-transparent w-full sm:w-32 font-medium" />
                                </div>
                                <select value={selectedBroker} onChange={(e) => setSelectedBroker(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none font-medium w-full sm:w-auto flex-grow">
                                    <option value="">Todos os Corretores</option>
                                    {brokers.map(b => <option key={b.id} value={b.name}>{b.name}</option>)}
                                </select>
                                <select value={brokerCategoryFilter} onChange={(e) => setBrokerCategoryFilter(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none font-medium w-full sm:w-auto flex-grow">
                                    <option value="todos">Todas as Equipes</option>
                                    <option value="locacao">Locação</option>
                                    <option value="administrativo">Administrativo</option>
                                    <option value="lancamento">Lançamento</option>
                                    <option value="terceiro">Terceiro</option>
                                </select>
                                <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none font-medium w-full sm:w-auto flex-grow">
                                    <option value="todos">Todos os Status</option>
                                    <option value="Pendente de Valor">Pendente</option>
                                    <option value="A pagar">A Lançar</option>
                                    <option value="Lançado">Lançado (Na Carteira)</option>
                                    <option value="Paga">Paga</option>
                                </select>
                                <button onClick={fetchData} className="p-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl transition" title="Atualizar dados">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-slate-600" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clipRule="evenodd" /></svg>
                                </button>
                            </div>
                            <div className="flex flex-wrap justify-end items-center gap-3 mt-4">
                                {selectedToLaunch.length > 0 && (
                                    <button onClick={() => handleLaunchPayments(selectedToLaunch)} className="w-full sm:w-auto flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm transition">
                                        Lançar Selecionados ({selectedToLaunch.length})
                                    </button>
                                )}
                                <button onClick={() => setIsModalOpen(true)} className="w-full sm:w-auto flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm transition">
                                <Icons.Plus /> Lançar Pagamento
                            </button>
                            </div>
                        </div>

                        {loading ? <p>Carregando...</p> : payments.length === 0 ? (
                            <div className="text-center py-16 text-slate-500 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                                <Icons.DollarSign className="w-10 h-10 mx-auto text-slate-300 mb-3" />
                                <p className="mb-4 text-lg">Nenhum pagamento registrado neste período.</p>
                                {['Administrador', 'Gestor', 'Financeiro', 'Gerente'].includes(userProfile?.role) && (
                                    <button onClick={() => setIsModalOpen(true)} className="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-2 px-6 rounded-lg transition shadow-sm">
                                        Fazer um lançamento agora
                                    </button>
                                )}
                            </div>
                        ) : (
                            <div className="overflow-x-auto border border-slate-200 rounded-xl">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm">
                                            <th className="py-3 px-3">
                                                <input type="checkbox"
                                                    onChange={() => {
                                                        const allLaunchableIds = filteredPayments.filter(p => p.status === 'A pagar').map(p => p.id); // 'A pagar' is the status for "A Lançar"
                                                        if (selectedToLaunch.length === allLaunchableIds.length) {
                                                            setSelectedToLaunch([]);
                                                        } else {
                                                            setSelectedToLaunch(allLaunchableIds);
                                                        }
                                                    }}/>
                                            </th>
                                            <th className="py-3 px-3 font-bold">Captação (Cód)</th>
                                            <th className="py-3 px-3 font-bold">Tipo</th>
                                            <th className="py-3 px-3 font-bold">Corretor(es)</th>
                                            <th className="py-3 px-3 font-bold">Data Captação</th>
                                            <th className="py-3 px-3 font-bold">Data Lançamento</th>
                                            <th className="py-3 px-3 font-bold">Valor</th>
                                            <th className="py-3 px-3 font-bold">Status</th>
                                            <th className="py-3 px-3 font-bold">Data Pagamento</th>
                                            <th className="py-3 px-3 font-bold text-right">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-sm">
                                        {paginatedPayments.map((p) => (
                                            <tr key={p.id} className="border-b border-slate-100 hover:bg-blue-50/30 transition last:border-0">
                                                <td className="py-3 px-3">
                                                    {p.status === 'A pagar' && (
                                                        <input type="checkbox"
                                                            checked={selectedToLaunch.includes(p.id)}
                                                            onChange={() => setSelectedToLaunch(prev => 
                                                                prev.includes(p.id)
                                                                    ? prev.filter(id => id !== p.id)
                                                                    : [...prev, p.id]
                                                            )} />
                                                    )}
                                                </td>
                                                <td className="py-3 px-3 font-bold text-slate-800 whitespace-nowrap">{p.codigo}</td>
                                                <td className="py-3 px-3 text-slate-600 font-medium">
                                                    <span className={`px-2 py-1 rounded-full text-xs font-semibold ${
                                                        p.tipoContrato === 'venda' ? 'bg-purple-100 text-purple-700' : 
                                                        p.tipoContrato === 'aluguel_venda' ? 'bg-orange-100 text-orange-700' : 
                                                        'bg-sky-100 text-sky-700'}`
                                                    }>
                                                        {p.tipoContrato === 'venda' ? 'Venda' : p.tipoContrato === 'aluguel_venda' ? 'Aluguel/Venda' : 'Aluguel'}
                                                    </span>
                                                </td>
                                                <td className="py-3 px-3 text-slate-600 font-medium">
                                                    <div className="flex flex-col">
                                                        <div className="flex items-center gap-2">
                                                            <span>{p.corretor}</span>
                                                            {(p.todosCorretores?.length || 0) > 1 && (
                                                                <span className="text-xs bg-slate-200 text-slate-600 font-semibold px-1.5 py-0.5 rounded-full" title={p.todosCorretores.join(', ')}>
                                                                    +{p.todosCorretores.length - 1}
                                                                </span>
                                                            )}
                                                        </div>
                                                    </div>
                                                </td>
                                                <td className="py-3 px-3 text-slate-500 whitespace-nowrap">{formatDateToBR(p.dataCaptacao)}</td>
                                                <td className="py-3 px-3 text-slate-500 whitespace-nowrap">{formatDateToBR(p.dataRegistro)}</td>
                                                <td className="py-3 px-3 text-slate-800 font-black whitespace-nowrap">
                                                    {p.status === 'Pendente de Valor' ? (
                                                        <span className="text-xs font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded-full">VALOR PENDENTE</span>
                                                    ) : (
                                                        formatMoney(p.valor)
                                                    )}
                                                </td>
                                                <td className="py-3 px-3">
                                                    <span title={p.status} className={`p-2 rounded-full shadow-sm inline-flex items-center justify-center ${
                                                        p.status === 'Paga' ? 'bg-green-100 text-green-700' :
                                                        p.status === 'Lançado' ? 'bg-purple-100 text-purple-700' :
                                                        p.status === 'A pagar' ? 'bg-amber-100 text-amber-700' :
                                                        'bg-blue-100 text-blue-700'
                                                    }`}>
                                                        {
                                                            p.status === 'Paga' ? <Icons.CheckCircle className="w-4 h-4" /> :
                                                            p.status === 'A pagar' ? <Icons.DollarSign className="w-4 h-4" /> : p.status === 'Lançado' ? <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z" /><path fillRule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clipRule="evenodd" /></svg> :
                                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                                        }
                                                    </span>
                                                </td>
                                                <td className="py-3 px-3 text-slate-500 whitespace-nowrap">{p.dataPagamento ? formatDateToBR(p.dataPagamento) : '-'}</td>
                                                <td className="py-3 px-3 text-right">
                                                    <div className="flex items-center justify-end gap-2">
                                                        {p.status === 'Pendente de Valor' ? (
                                                            <button
                                                                onClick={() => { setEditingPayment(p); setNewPaymentValue(''); }}
                                                                className="text-xs font-bold px-3 py-1.5 rounded-lg transition border shadow-sm bg-blue-50 text-blue-600 border-blue-200 hover:bg-blue-600 hover:text-white"
                                                            >
                                                                Informar Valor
                                                            </button>
                                                        ) : p.status === 'A pagar' ? (
                                                            <div className="flex items-center gap-1">
                                                                <button onClick={() => handleLaunchPayments([p.id])} className="text-xs font-bold px-3 py-1.5 rounded-lg transition border shadow-sm bg-blue-50 text-blue-600 border-blue-200 hover:bg-blue-600 hover:text-white">
                                                                    Lançar na Carteira
                                                                </button>
                                                                <button onClick={() => { setEditingPayment(p); setNewPaymentValue(p.valor); }} className="text-slate-400 hover:text-blue-600 p-1.5 hover:bg-blue-50 rounded-lg transition" title="Editar Valor">
                                                                    <Icons.Edit />
                                                                </button>
                                                            </div>
                                                        ) : (
                                                            <button className="text-xs font-bold px-3 py-1.5 rounded-lg border shadow-sm bg-slate-50 text-slate-500 border-slate-200 cursor-default">
                                                                {p.status === 'Lançado' ? 'Na Carteira' : 'Pago'}
                                                            </button>
                                                        )}
                                                        <button 
                                                            onClick={() => setDeletingItem(p)}
                                                            className="text-slate-400 hover:text-red-600 p-1.5 hover:bg-red-50 rounded-lg transition"
                                                            title="Remover Lançamento"
                                                        >
                                                            <Icons.Trash />
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                        {totalPages > 1 && (
                            <div className="flex justify-center items-center gap-2 mt-6">
                                <button onClick={() => setCurrentPage(p => p - 1)} disabled={currentPage === 1} className="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed">
                                    Anterior
                                </button>
                                <span className="text-sm text-slate-500 font-medium">
                                    Página {currentPage} de {totalPages}
                                </span>
                                <button onClick={() => setCurrentPage(p => p + 1)} disabled={currentPage === totalPages} className="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed">
                                    Próxima
                                </button>
                            </div>
                        )}
                    </div>
                </div>

                <ConfirmModal 
                    isOpen={!!deletingItem}
                    title="Excluir Lançamento Financeiro"
                    message="Deseja realmente remover este lançamento financeiro? Esta ação não pode ser desfeita."
                    btnConfirm="Sim, Excluir"
                    btnCancel="Cancelar"
                    type="danger"
                    onCancel={() => setDeletingItem(null)}
                    onConfirm={async () => {
                        try {
                            if (!user) return;
                                const docRef = firebaseApi.doc(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments', deletingItem.id);
                                await firebaseApi.deleteDoc(docRef);
                            await logAudit(user, "Exclusão de Lançamento Financeiro", `Captação Cód: ${deletingItem.codigo}, Valor: ${formatMoney(deletingItem.valor)}`);
                            setDeletingItem(null);
                            showToast("Lançamento excluído.", "success");
                        } catch (err) {
                            showToast("Erro ao excluir lançamento.", "error");
                        }
                    }}
                />

                {editingPayment && (
                    <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                        <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 slide-up">
                            <h3 className="text-xl font-bold text-slate-800 mb-2">Informar Valor a Pagar</h3>
                            <p className="text-slate-600 mb-6 leading-relaxed">
                                Defina o valor da comissão para a captação <span className="font-bold">{editingPayment.codigo}</span> do corretor <span className="font-bold">{editingPayment.corretor}</span>.
                            </p>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1">Valor da Comissão (R$)</label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        value={newPaymentValue}
                                        onChange={(e) => setNewPaymentValue(e.target.value)}
                                        placeholder="Ex: 150.00"
                                        className="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 hover:bg-white transition"
                                        autoFocus
                                    />
                                </div>
                                <div className="flex gap-3 pt-2">
                                    <button onClick={() => { setEditingPayment(null); setNewPaymentValue(''); }} className="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl font-semibold hover:bg-slate-200 transition">Cancelar</button>
                                    <button onClick={handleUpdatePaymentValue} className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition shadow-sm">Salvar Valor</button>
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                {isModalOpen && (
                    <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 p-4 overflow-y-auto fade-in">
                        <div className="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 slide-up mx-auto my-8">
                            <h3 className="text-xl font-bold text-slate-800 mb-4 border-b border-slate-100 pb-3 flex items-center gap-2">
                                <Icons.DollarSign /> Novo Lançamento
                            </h3>
                            <form onSubmit={handleAddPayment} className="space-y-4">
                                
                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                    <label className="block text-sm font-semibold text-slate-700 mb-2">1. Buscar e Selecionar Captação</label>
                                    
                                    <div className="flex flex-col sm:flex-row gap-2 mb-3">
                                        <div className="flex-1 flex items-center bg-white border border-slate-300 rounded-lg px-2 focus-within:ring-2 focus-within:ring-blue-500 shadow-sm transition">
                                            <Icons.Calendar />
                                            <span className="text-xs text-slate-500 mx-1">De:</span>
                                            <input 
                                                type="date" 
                                                value={captureSearchStartDate} 
                                                onChange={(e) => setCaptureSearchStartDate(e.target.value)} 
                                                className="w-full py-1.5 outline-none bg-transparent text-sm text-slate-700"
                                            />
                                        </div>
                                        <div className="flex-1 flex items-center bg-white border border-slate-300 rounded-lg px-2 focus-within:ring-2 focus-within:ring-blue-500 shadow-sm transition">
                                            <span className="text-xs text-slate-500 mr-1">Até:</span>
                                            <input 
                                                type="date" 
                                                value={captureSearchEndDate} 
                                                onChange={(e) => setCaptureSearchEndDate(e.target.value)} 
                                                className="w-full py-1.5 outline-none bg-transparent text-sm text-slate-700"
                                            />
                                        </div>
                                    </div>

                                    <div className="flex items-center bg-white border border-slate-300 rounded-lg px-3 focus-within:ring-2 focus-within:ring-blue-500 mb-3 shadow-sm transition">
                                        <Icons.Search />
                                        <input
                                            type="text"
                                            placeholder="Filtrar por código ou corretor..."
                                            value={captureSearchTerm}
                                            onChange={(e) => setCaptureSearchTerm(e.target.value)}
                                            className="w-full px-2 py-2 outline-none bg-transparent text-sm"
                                        />
                                    </div>

                                    <select 
                                        value={selectedCapture}
                                        onChange={(e) => setSelectedCapture(e.target.value)}
                                        className="w-full px-3 py-2.5 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm text-sm"
                                    >
                                        <option value="" disabled>Selecione a captação na lista abaixo...</option>
                                        {filteredCapturesForSelect.map(c => (
                                            <option key={c.id} value={c.id}>
                                                {c.codigo} - {c.corretor} ({formatDateToBR(c.data)})
                                            </option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1">2. Valor a Pagar (R$)</label>
                                    <input 
                                        type="number"
                                        step="0.01"
                                        value={valor}
                                        onChange={(e) => setValor(e.target.value)}
                                        placeholder="Ex: 150.00"
                                        className="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 hover:bg-white transition"
                                    />
                                </div>
                                <div className="flex gap-3 mt-8 pt-4 border-t border-slate-100">
                                    <button type="button" onClick={() => { setIsModalOpen(false); setCaptureSearchTerm(''); setCaptureSearchStartDate(getDefaultStartDate()); setCaptureSearchEndDate(getDefaultEndDate()); }} className="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl font-semibold hover:bg-slate-200 transition">Cancelar</button>
                                    <button type="submit" className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition shadow-sm">Lançar a Pagar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                    )}
                    {isModalOpen && (
                        <ConfirmModal
                            isOpen={showPaymentConfirm}
                            title="Lançamento Realizado!"
                            message="O que você gostaria de fazer agora?"
                            btnConfirm="Lançar Outro Valor"
                            btnCancel="Voltar para Financeiro"
                            onConfirm={handleAddNewPayment}
                            onCancel={handleClosePaymentModal}
                        />
                )}
            </React.Fragment>
        );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [brokers, setBrokers] = useState([]);
            const [userProfile, setUserProfile] = useState(null);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const mobileMenuRef = useRef(null);
            const [toasts, setToasts] = useState([]);
            const [readCount, setReadCount] = useState(0);
            const [writeCount, setWriteCount] = useState(0);
            const [dataInicio, setDataInicio] = useState(getDefaultStartDate());
            const [dataFim, setDataFim] = useState(getDefaultEndDate());

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (mobileMenuRef.current && !mobileMenuRef.current.contains(event.target)) {
                        setIsMobileMenuOpen(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, [mobileMenuRef]);
            
            const showToast = useCallback((message, type = 'info') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 4000);
            }, []);

            const firebaseApi = useMemo(() => {
                const incrementRead = (count = 1) => setReadCount(c => c + count);
                const incrementWrite = () => setWriteCount(w => w + 1);
                return {
                    getDocs: async (...args) => { const result = await window.getDocs(...args); incrementRead(result.docs.length || 1); return result; },
                    getDoc: async (...args) => { const result = await window.getDoc(...args); incrementRead(); return result; },
                    addDoc: async (...args) => { const result = await window.addDoc(...args); incrementWrite(); return result; },
                    updateDoc: async (...args) => { const result = await window.updateDoc(...args); incrementWrite(); return result; },
                    deleteDoc: async (...args) => { const result = await window.deleteDoc(...args); incrementWrite(); return result; },
                    onSnapshot: (query, onNext, onError) => {
                        const newOnNext = (snapshot) => { incrementRead(snapshot.docs.length || 1); onNext(snapshot); };
                        return window.onSnapshot(query, newOnNext, onError);
                    },
                    doc: window.doc, collection: window.collection, query: window.query, where: window.where,
                    or: window.or, orderBy: window.orderBy, and: window.and, limit: window.limit, startAfter: window.startAfter,
                };
            }, [setReadCount, setWriteCount]);

            useEffect(() => {
                const handlePageShow = (event) => { if (event.persisted) { setReadCount(0); setWriteCount(0); } };
                window.addEventListener('pageshow', handlePageShow);
                return () => window.removeEventListener('pageshow', handlePageShow);
            }, []);

            const handleLogout = async () => {
                try {
                    if (window.auth && window.signOut) {
                        await window.signOut(window.auth);
                        showToast("Sessão encerrada com sucesso.", "success"); 
                        setTimeout(() => { window.location.href = 'login.html'; }, 1000);
                    }
                } catch (e) {
                    showToast("Erro ao encerrar a sessão.", "error");
                }
            };

            useEffect(() => {
                let inactivityTimer;
                const logoutDueToInactivity = async () => {
                    if (window.auth && window.signOut) {
                        try { await window.signOut(window.auth); showToast("Sessão encerrada por inatividade (10 min).", "error"); } 
                        catch (e) { window.location.href = 'login.html'; }
                    }
                };
                const resetTimer = () => { clearTimeout(inactivityTimer); inactivityTimer = setTimeout(logoutDueToInactivity, 10 * 60 * 1000); };
                const events = ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'];
                events.forEach(event => window.addEventListener(event, resetTimer));
                resetTimer();
                return () => { clearTimeout(inactivityTimer); events.forEach(event => window.removeEventListener(event, resetTimer)); };
            }, [showToast]);

            useEffect(() => {
                const unsubscribeAuth = window.onAuthStateChanged(window.auth, async (currentUser) => {
                    if (user?.uid !== currentUser?.uid) { setReadCount(0); setWriteCount(0); setUserProfile(null); }
                    setUser(currentUser);
                    if (currentUser) {
                        const brokersRef = firebaseApi.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'brokers');
                        const qBrokers = firebaseApi.query(brokersRef);
                        const unsubscribeBrokers = firebaseApi.onSnapshot(qBrokers, (snapshot) => {
                            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            data.sort((a, b) => a.name.localeCompare(b.name));
                            setBrokers(data);
                            if (authLoading) setAuthLoading(false);
                        }, (error) => {
                            console.error("Error fetching brokers:", error);
                            showToast("Erro ao carregar a lista de corretores.", "error");
                            setAuthLoading(false);
                        });
                        return () => unsubscribeBrokers();
                    } else {
                        setBrokers([]); setUserProfile(null); setAuthLoading(false); window.location.href = 'login.html';
                    }
                });
                return () => unsubscribeAuth();
            }, [firebaseApi, showToast, authLoading]);

            const navigate = (page) => { window.location.href = page; };

            if (authLoading) {
                return ( 
                    <div className="h-screen flex flex-col items-center justify-center">
                        <div className="w-16 h-16 border-4 border-white/30 border-t-white rounded-full animate-spin mb-6"></div>
                        <div className="text-white/90 text-lg font-medium animate-pulse">Conectando ao sistema...</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col">
                    <ToastContainer toasts={toasts} />
                    
                    <header className="bg-white/85 backdrop-blur-md shadow-sm border-b border-slate-200 sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6">
                            <div className="flex justify-between items-center h-16">
                                <div className="flex items-center gap-2 cursor-pointer" onClick={() => navigate('dashboard.html')}>
                                    <div className="bg-blue-600 text-white p-1.5 rounded-lg shadow-sm"><Icons.Home /></div>
                                    <h1 className="text-xl font-black text-slate-800 tracking-tight">Capta<span className="text-blue-600">Pro</span></h1>
                                </div>
                                <div className="flex items-center gap-3">
                                    <div className="sm:hidden relative" ref={mobileMenuRef}>
                                        <button onClick={() => setIsMobileMenuOpen(prev => !prev)} className="p-2 rounded-md text-slate-500 hover:text-slate-800 hover:bg-slate-100"><Icons.Menu /></button>
                                    </div>
                                    <div className="hidden sm:flex items-center space-x-1">
                                        <NavButton icon={<Icons.FileText />} label="Captações" onClick={() => navigate('captacoes.html')} />
                                        <NavButton icon={<Icons.DollarSign />} label="Lançamentos" active={true} />
                                        <NavButton icon={<svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z" /><path fillRule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clipRule="evenodd" /></svg>} label="Carteira" onClick={() => navigate('carteira.html')} />
                                        <NavButton icon={<Icons.LogOut />} label="Sair" onClick={handleLogout} danger />
                                    </div>
                                </div>
                            </div>
                        </div>
                        {isMobileMenuOpen && (
                            <div className="sm:hidden absolute top-16 left-0 w-full bg-white shadow-lg border-t border-slate-200 p-4 z-[60]"> 
                                <div className="flex flex-col gap-2">
                                    <a onClick={handleLogout} className="flex items-center gap-3 p-3 rounded-lg text-red-600 font-semibold hover:bg-red-50 cursor-pointer"><Icons.LogOut /><span>Sair</span></a>
                                </div>
                            </div>
                        )}
                    </header>

                    <nav className="sm:hidden fixed bottom-0 w-full bg-white border-t border-slate-200 z-40 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        <div className="flex justify-around items-center h-16 px-1">
                            <MobileNavButton icon={<Icons.FileText />} label="Captações" onClick={() => navigate('captacoes.html')} />
                            <MobileNavButton icon={<Icons.DollarSign />} label="Lançar" active={true} />
                            <MobileNavButton icon={<svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z" /><path fillRule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clipRule="evenodd" /></svg>} label="Carteira" onClick={() => navigate('carteira.html')} />
                        </div>
                    </nav>
 
                    <main className="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 pt-4 sm:pt-6 pb-28 sm:pb-20 overflow-x-hidden">
                        <Finance isLoaded={!authLoading} brokers={brokers} user={user} showToast={showToast} dataInicio={dataInicio} setDataInicio={setDataInicio} dataFim={dataFim} setDataFim={setDataFim} firebaseApi={firebaseApi} logAudit={logAudit} userProfile={userProfile} />
                    </main>

                    <footer className="fixed bottom-0 left-0 right-0 z-30 bg-white/90 backdrop-blur-sm border-t border-slate-200 py-2 px-4 text-center text-slate-500 text-xs">
                        <div className="max-w-7xl mx-auto flex flex-wrap justify-center items-center gap-x-4 gap-y-1">
                            <div className="flex items-center gap-1.5 text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-0.5 rounded-full border border-slate-200">
                                <span className={`w-2 h-2 rounded-full ${user ? 'bg-green-500' : 'bg-red-500'}`}></span>
                                {user ? 'Online' : 'Offline'}
                            </div>
                            {user && <p className="font-semibold text-slate-500">Logado como: {user.email}</p>}
                            <p>CaptaPro - 5.5 beta  - Criado por Guilherme Montoani</p>
                            <div className="flex items-center gap-x-3 font-mono">
                                <span title="Leituras do Banco de Dados"><svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3 inline -mt-0.5" viewBox="0 0 20 20" fill="currentColor"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z" /><path fillRule="evenodd" d="M.458 10C3.732 4.943 9.522 3 10 3s6.268 1.943 9.542 7c-3.274 5.057-9.064 7-9.542 7S3.732 15.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clipRule="evenodd" /></svg>{readCount}</span>
                                <span title="Escritas no Banco de Dados"><svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3 inline -mt-0.5" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg>{writeCount}</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const NavButton = ({ icon, label, active, onClick, danger }) => {
            if (danger) {
                return <button onClick={onClick} className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold text-red-600 hover:bg-red-50 hover:text-red-700 transition" title="Sair do Sistema">{icon} {label && <span>{label}</span>}</button>;
            }
            return <button onClick={onClick} className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold transition ${active ? 'bg-slate-100 text-blue-700' : 'text-slate-500 hover:bg-slate-100 hover:text-slate-900'}`}>{icon} <span>{label}</span></button>;
        }

        const MobileNavButton = ({ icon, label, active, onClick }) => {
            return <button onClick={onClick} className={`flex flex-col items-center justify-center w-full h-full space-y-1 transition ${active ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>{React.cloneElement(icon, { className: "h-6 w-6"})}<span className="text-[10px] font-bold">{label}</span></button>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
