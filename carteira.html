        // Firebase Configuration setup

                projectId: "cap-pro-loc",

        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        window.db = db;
        window.auth = auth;
        window.signOut = signOut;
        window.signInWithCustomToken = signInWithCustomToken;
        window.onAuthStateChanged = onAuthStateChanged;
        window.collection = collection;
        window.query = query;
        window.getDoc = getDoc;

        window.addDoc = addDoc;
        window.updateDoc = updateDoc;
        window.where = where;
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;
        window.orderBy = orderBy;
        window.or = or;
        window.and = and;
        window.limit = limit;
        window.startAfter = startAfter;
        window.doc = doc;
        window.__app_id = typeof __app_id !== 'undefined' ? __app_id : 'captacoes-app';
        window.__initial_auth_token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
    </script>

            Menu: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
        };

        const getDefaultStartDate = () => {
            const d = new Date();
            return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().split('T')[0];
        };

        const getDefaultEndDate = () => {
            const d = new Date();
            return new Date(d.getFullYear(), d.getMonth() + 1, 0).toISOString().split('T')[0];
        };

        const formatMoney = (value) => {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        };

        const formatDateToBR = (dateString) => {
            if(!dateString) return "";
            const [year, month, day] = dateString.split('-');
            return `${day}/${month}/${year}`;
        };

        const logAudit = async (user, action, details) => {
            if (!user || !user.email) {
                console.warn("Audit log skipped: user not available.");
                return;
            }
            try {
                const auditRef = window.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'audit_logs');
                await window.addDoc(auditRef, {
                    userEmail: user.email,
                    action: action,
                    details: details,
                    timestamp: new Date().toISOString()
                });
            } catch (error) {
                console.error("Failed to write audit log:", error);
            }
        };

        const ConfirmModal = ({ isOpen, title, message, btnConfirm, btnCancel, onConfirm, onCancel, type = "primary" }) => {
            if (!isOpen) return null;
            const btnColor = type === 'danger' ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700';
            
            return (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 slide-up">
                        <h3 className="text-xl font-bold text-slate-800 mb-2">{title}</h3>
                        <p className="text-slate-600 mb-8 leading-relaxed">{message}</p>
                        <div className="flex flex-col sm:flex-row gap-3">
                            <button onClick={onCancel} className="flex-1 bg-slate-100 text-slate-700 font-semibold py-2.5 px-4 rounded-xl hover:bg-slate-200 transition">
                                {btnCancel}
                            </button>
                            <button onClick={onConfirm} className={`flex-1 text-white font-semibold py-2.5 px-4 rounded-xl transition shadow-sm ${btnColor}`}>
                                {btnConfirm}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ToastContainer = ({ toasts }) => {
            return (
                <div className="fixed top-20 right-4 z-50 flex flex-col gap-3 pointer-events-none">
                    {toasts.map(toast => (
                        <div key={toast.id} className={`toast-enter pointer-events-auto flex items-center gap-3 px-5 py-3 rounded-xl shadow-lg border ${toast.type === 'error' ? 'bg-red-50 border-red-200 text-red-800' : 'bg-green-50 border-green-200 text-green-800'}`}>
                            {toast.type === 'error' ? (
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            ) : (
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                            )}
                            <p className="font-medium">{toast.message}</p>
                        </div>
                    ))}
                </div>
            );
        };

        const Carteira = ({ isLoaded, user, brokers, showToast, firebaseApi, logAudit, navigate }) => {
            const [view, setView] = useState('list'); // 'list' or 'details'
            const [selectedBroker, setSelectedBroker] = useState(null);
            const [categoryFilter, setCategoryFilter] = useState('todos');
            const [showOnlyWithValues, setShowOnlyWithValues] = useState(true);
            const [dataInicio, setDataInicio] = useState(getDefaultStartDate());
            const [dataFim, setDataFim] = useState(getDefaultEndDate());
            const [payments, setPayments] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');
            const [sortBy, setSortBy] = useState('value_desc'); // 'value_desc', 'value_asc', 'name_asc', 'name_desc'
            
            useEffect(() => {
                if (!user || !isLoaded) {
                    if (isLoaded) setLoading(false);
                    return;
                }
                setLoading(true);
                const { query, collection, onSnapshot, where, and, orderBy } = firebaseApi;
                const paymentsRef = collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments');
                
                const q = query(paymentsRef, 
                    and(
                        where("status", "==", "Lançado"),
                        where("dataLancamento", ">=", dataInicio + "T00:00:00.000Z"),
                        where("dataLancamento", "<=", dataFim + "T23:59:59.999Z")
                    ),
                    orderBy("dataLancamento", "desc")
                );

                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setPayments(data);
                    setLoading(false);
                }, (error) => {
                    console.error("Error fetching wallet payments:", error);
                    showToast("Erro ao carregar a carteira. Verifique o console para criar índices.", "error");
                    setLoading(false);
                });
                return () => unsubscribe();
            }, [user, dataInicio, dataFim, isLoaded, firebaseApi]);

            const brokerWalletStats = useMemo(() => {
                const stats = {};
                const brokerCategoryMap = new Map(brokers.map(b => [b.name, b.category || 'locacao']));

                // Initialize with all brokers to ensure everyone is listed, even with 0 values
                brokers.forEach(broker => {
                    stats[broker.name] = {
                        name: broker.name,
                        lancadoCount: 0,
                        lancadoValue: 0,
                        category: broker.category || 'locacao'
                    };
                });

                payments.forEach(p => {
                    if (p.status === 'Lançado' && p.corretor && stats[p.corretor]) {
                        stats[p.corretor].lancadoCount += 1;
                        stats[p.corretor].lancadoValue += p.valor;
                    }
                });

                return Object.values(stats);
            }, [payments, brokers]);

            const filteredAndSortedBrokers = useMemo(() => {
                let result = brokerWalletStats.filter(broker => {
                    const valueMatch = !showOnlyWithValues || broker.lancadoValue > 0;
                    const categoryMatch = categoryFilter === 'todos' || broker.category === categoryFilter;
                    const searchMatch = searchTerm === '' || broker.name.toLowerCase().includes(searchTerm.toLowerCase());
                    return valueMatch && categoryMatch && searchMatch;
                });

                switch (sortBy) {
                    case 'value_asc':
                        result.sort((a, b) => a.lancadoValue - b.lancadoValue);
                        break;
                    case 'name_asc':
                        result.sort((a, b) => a.name.localeCompare(b.name));
                        break;
                    case 'name_desc':
                        result.sort((a, b) => b.name.localeCompare(a.name));
                        break;
                    case 'value_desc':
                    default:
                        result.sort((a, b) => b.lancadoValue - a.lancadoValue);
                        break;
                }
                return result;
            }, [brokerWalletStats, showOnlyWithValues, categoryFilter, searchTerm, sortBy]);

            const exportWalletPDF = async (currentUser, reportStatus) => {
                const isAPagar = reportStatus === 'Lançado';
                showToast("Gerando relatório, por favor aguarde...", "info");

                const { query, collection, where, getDocs, and } = firebaseApi;
                const paymentsRef = collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments');
                
                let q;
                if (isAPagar) {
                    q = query(paymentsRef, and(
                        where("status", "==", "Lançado"),
                        where("dataLancamento", ">=", dataInicio + "T00:00:00.000Z"),
                        where("dataLancamento", "<=", dataFim + "T23:59:59.999Z")
                    ));
                } else { // 'Paga'
                    q = query(paymentsRef, and(
                        where("status", "==", "Paga"),
                        where("dataPagamento", ">=", dataInicio + "T00:00:00.000Z"),
                        where("dataPagamento", "<=", dataFim + "T23:59:59.999Z")
                    ));
                }

                const snapshot = await getDocs(q);
                let paymentsToReport = snapshot.docs.map(doc => doc.data());

                // helper para normalizar strings (remove acentuação, trim e lowercase)
                const normalizeName = (s) => (s || '').toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

                // Se houver filtro de equipe (categoryFilter definido no componente) aplica-se o filtro
 (s || '').toString().trim().toLowerCase().normalize('NFD').replace(/[␀-\u036f]/g, '');
                if (typeof categoryFilter !== 'undefined' && categoryFilter !== 'todos') {
                    const safeBrokers = Array.isArray(brokers) ? brokers : [];
                    const normCategory = normalizeName(categoryFilter);
                    // Monta conjunto de corretores que pertencem à equipe selecionada (normalizado para evitar diferenças de caixa/acento)
                    const allowed = new Set(safeBrokers.filter(b => normalizeName(b.category) === normCategory).map(b => normalizeName(b.name)));

                    if (allowed.size === 0) {
                        // Não há corretores nessa equipe: nenhum pagamento deverá ser exportado
                        paymentsToReport = [];
                    } else {
                        paymentsToReport = paymentsToReport.filter(p => {
                            // Normaliza campos do pagamento
                            const main = normalizeName(p.corretor);
                            if (main && allowed.has(main)) return true;

                            const todos = Array.isArray(p.todosCorretores) ? p.todosCorretores : (Array.isArray(p.corretores) ? p.corretores : []);
                            for (const t of todos) {
                                if (allowed.has(normalizeName(t))) return true;
                            }

                            // Também aceita quando payment has 'corretores' as comma-separated string
                            if (typeof p.corretores === 'string') {
                                const parts = p.corretores.split(',').map(s => normalizeName(s));
                                for (const part of parts) if (allowed.has(part)) return true;
                            }

                            return false;
                        });
                    }
                }

                if (paymentsToReport.length === 0) {
                    showToast(`Nenhum lançamento com status '${isAPagar ? 'A Pagar' : 'Paga'}' para exportar.`, "info");
                    return;
                }

                try {
                    const { jsPDF } = jspdf;
                    const doc = new jsPDF();
                    
                    doc.setFontSize(16);
                    doc.text(`Relatório Financeiro - Comissões ${isAPagar ? 'A PAGAR' : 'PAGAS'}`, 14, 20);
                    doc.setFontSize(11);
                    doc.text(`Período: ${formatDateToBR(dataInicio)} a ${formatDateToBR(dataFim)}`, 14, 28);
                    doc.setFontSize(10);
                    doc.setTextColor('#64748b');
                    doc.text(`Exportado por: ${currentUser?.email || 'Usuário desconhecido'}`, 14, 34);
                    
                    // Agrupa pagamentos por corretor — assegurando incluir todos os corretores da equipe selecionada
                    const grouped = {};

                    // Prepara mapa de corretores permitidos quando houver filtro de equipe
                    let allowedNameMap = null; // map normalizedName -> display name
                    if (typeof categoryFilter !== 'undefined' && categoryFilter !== 'todos') {
                        const safeBrokers = Array.isArray(brokers) ? brokers : [];
                        const normCategory = normalizeName(categoryFilter);
                        const entries = safeBrokers.filter(b => normalizeName(b.category) === normCategory).map(b => [ normalizeName(b.name || ''), (b.name||'').trim() ]);
                        allowedNameMap = new Map(entries); // may be empty map if no brokers match
                    }

                    paymentsToReport.forEach(payment => {
                        const main = (payment.corretor || '').toString().trim();

                        // Normaliza lista de corretores envolvidos
                        let todos = [];
                        if (Array.isArray(payment.todosCorretores)) todos = payment.todosCorretores.map(t => (t||'').toString().trim());
                        else if (Array.isArray(payment.corretores)) todos = payment.corretores.map(t => (t||'').toString().trim());
                        else if (typeof payment.corretores === 'string' && payment.corretores.trim() !== '') todos = payment.corretores.split(',').map(s => s.trim());

                        const targetBrokers = new Set();

                        if (allowedNameMap) {
                            // quando há filtro de equipe, só atribui a corretores permitidos
                            const mainNorm = normalizeName(main);
                            if (main && allowedNameMap.has(mainNorm)) targetBrokers.add(allowedNameMap.get(mainNorm));
                            todos.forEach(t => { const tNorm = normalizeName(t); if (t && allowedNameMap.has(tNorm)) targetBrokers.add(allowedNameMap.get(tNorm)); });
                        } else {
                            // sem filtro de equipe: atribui ao corretor principal ou aos todosCorretores
                            if (main) targetBrokers.add(main);
                            todos.forEach(t => { if (t) targetBrokers.add(t); });
                        }

                        // fallback: se não houve target (dados incompletos), tenta usar main ou primeiro todo
                        if (targetBrokers.size === 0) {
                            if (main) targetBrokers.add(main);
                            else if (todos.length > 0) targetBrokers.add(todos[0]);
                        }

                        // adiciona o pagamento a cada corretor alvo
                        targetBrokers.forEach(bName => {
                            if (!grouped[bName]) grouped[bName] = [];
                            grouped[bName].push(payment);
                        });
                    });

                    let currentY = 40;
                    const totalGeral = paymentsToReport.reduce((sum, p) => sum + p.valor, 0);
                    const sortedBrokers = Object.keys(grouped).sort();

                    for (const brokerName of sortedBrokers) {
                        const pays = grouped[brokerName];
                        if (currentY > 250) { doc.addPage(); currentY = 20; }

                        doc.setFontSize(12);
                        doc.setTextColor(isAPagar ? '#2563eb' : '#16a34a');
                        doc.text(`Corretor: ${brokerName}`, 14, currentY);
                        doc.setTextColor('#000000');

                        const tableData = pays.map(p => isAPagar 
                            ? [ p.codigo, p.tipoContrato === 'venda' ? 'Venda' : p.tipoContrato === 'aluguel_venda' ? 'Aluguel/Venda' : 'Aluguel', formatDateToBR(p.dataCaptacao), formatMoney(p.valor) ]
                            : [ p.codigo, p.tipoContrato === 'venda' ? 'Venda' : p.tipoContrato === 'aluguel_venda' ? 'Aluguel/Venda' : 'Aluguel', formatDateToBR(p.dataCaptacao), formatDateToBR(p.dataPagamento), formatMoney(p.valor) ]
                        );
                        const subTotal = pays.reduce((sum, p) => sum + p.valor, 0);
                        
                        const head = isAPagar ? [['Cód. Captação', 'Tipo', 'Data Captação', 'Valor a Pagar']] : [['Cód.', 'Tipo', 'Data Cap.', 'Data Pag.', 'Valor Pago']];
                        const totalLabel = isAPagar ? 'TOTAL DO CORRETOR' : 'TOTAL PAGO AO CORRETOR';
                        const totalColSpan = isAPagar ? 3 : 4;

                        tableData.push([{ content: totalLabel, colSpan: totalColSpan, styles: { fontStyle: 'bold', halign: 'right' } }, { content: formatMoney(subTotal), styles: { fontStyle: 'bold' } }]);

                        doc.autoTable({ startY: currentY + 4, head: head, body: tableData, theme: 'grid', headStyles: { fillColor: isAPagar ? [226, 232, 240] : [22, 163, 74], textColor: isAPagar ? [15, 23, 42] : [255,255,255] }, styles: { fontSize: 9 }, margin: { bottom: 15 } });
                        currentY = doc.lastAutoTable.finalY + 15;
                    }
                    
                    doc.setFontSize(12);
                    doc.text(`TOTAL GERAL ${isAPagar ? 'A PAGAR' : 'PAGO'} NO PERÍODO: ${formatMoney(totalGeral)}`, 14, currentY);
                    
                    const formattedDate = `${dataInicio}_${dataFim}`;
                    doc.save(`carteira_${isAPagar ? 'a_pagar' : 'pagos'}_${formattedDate}.pdf`);
                    await logAudit(currentUser, "Exportação de PDF", `Relatório da Carteira (${isAPagar ? 'A Pagar' : 'Pagos'}). Período: ${formatDateToBR(dataInicio)} a ${formatDateToBR(dataFim)}`);
                    showToast(`Relatório de ${isAPagar ? 'A Pagar' : 'Pagos'} gerado com sucesso!`, "success");
                } catch(e) {
                    console.error(`Erro ao gerar PDF de ${isAPagar ? 'A Pagar' : 'Pagos'}:`, e);
                    showToast("Erro ao gerar PDF.", "error");
                }
            };

            const handleSelectBroker = (brokerName) => {
                setSelectedBroker(brokerName);
                setView('details');
            };

            const handleBack = () => {
                setSelectedBroker(null);
                setView('list');
            };

            if (view === 'details') {
                return <CarteiraBrokerDetails 
                            brokerName={selectedBroker} 
                            onBack={handleBack}
                            user={user}
                            showToast={showToast}
                            firebaseApi={firebaseApi}
                            logAudit={logAudit}
                        />;
            }

            return (
                <div className="max-w-5xl mx-auto slide-up">
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-slate-100 pb-6">
                            <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z" /><path fillRule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clipRule="evenodd" /></svg>
                                Carteira de pagamentos
                            </h2>
                            <div className="flex items-center gap-2">
                                 <div className="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus-within:ring-2 focus-within:ring-blue-500 transition">
                                    <Icons.Calendar />
                                    <span className="text-sm text-slate-500 ml-2 mr-1">De:</span>
                                    <input type="date" value={dataInicio} onChange={(e) => setDataInicio(e.target.value)} className="outline-none bg-transparent text-slate-700 font-medium w-full sm:w-32" />
                                    <span className="text-sm text-slate-500 mx-2">Até:</span>
                                    <input type="date" value={dataFim} onChange={(e) => setDataFim(e.target.value)} className="outline-none bg-transparent text-slate-700 font-medium w-full sm:w-32" />
                                </div>
                                
                            </div>
                        </div>
                        <div className="flex flex-wrap gap-4 items-center mb-6">
                            <div className="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 w-full sm:w-auto focus-within:ring-2 focus-within:ring-blue-500">
                                <Icons.Search className="text-slate-400"/>
                                <input type="text" placeholder="Buscar corretor..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="ml-2 outline-none bg-transparent w-full placeholder:text-slate-400"/>
                            </div>
                            <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none font-medium w-full sm:w-auto">
                                <option value="value_desc">Maior Valor</option>
                                <option value="value_asc">Menor Valor</option>
                                <option value="name_asc">Nome (A-Z)</option>
                                <option value="name_desc">Nome (Z-A)</option>
                            </select>
                            <select value={categoryFilter} onChange={(e) => setCategoryFilter(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none font-medium w-full sm:w-auto">
                                <option value="todos">Todas as Equipes</option>
                                <option value="locacao">Locação</option>
                                <option value="administrativo">Administrativo</option>
                                <option value="lancamento">Lançamento</option>
                                <option value="terceiro">Terceiro</option>
                            </select>
                            <label className="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" checked={showOnlyWithValues} onChange={(e) => setShowOnlyWithValues(e.target.checked)} className="h-5 w-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500" />
                                <span className="font-medium text-sm text-slate-700">Mostrar apenas com valores a pagar</span>
                            </label>
                            <div className="flex-grow"></div>
                            <button onClick={() => exportWalletPDF(user, 'Lançado')} className="flex items-center gap-2 bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 px-4 rounded-xl transition shadow-sm">
                                <Icons.Download /> Exportar 'A Pagar'
                            </button>
                        </div>

                        {loading ? <p className="text-center py-16">Carregando...</p> : filteredAndSortedBrokers.length === 0 ? (
                            <div className="text-center py-16 text-slate-500 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                                <p className="mb-4 text-lg">{searchTerm ? 'Nenhum corretor encontrado.' : 'Nenhuma comissão a pagar neste período.'}</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                                {filteredAndSortedBrokers.map(broker => (
                                    <div key={broker.name} onClick={() => handleSelectBroker(broker.name)} className="group bg-white border border-slate-200 hover:border-blue-400 hover:shadow-md hover:-translate-y-1 transition-all duration-200 cursor-pointer rounded-2xl p-5 flex flex-col justify-between">
                                        <div className="flex items-center gap-3 mb-5">
                                            <div className="bg-slate-100 text-slate-600 group-hover:bg-blue-100 group-hover:text-blue-600 p-3 rounded-full transition-colors"><Icons.User /></div>
                                            <h3 className="font-bold text-slate-800 text-lg truncate" title={broker.name}>{broker.name}</h3>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-sm text-slate-500 font-medium">{broker.lancadoCount} comissões</p>
                                            <p className="text-2xl font-black text-green-600">{formatMoney(broker.lancadoValue)}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const CarteiraBrokerDetails = ({ brokerName, onBack, user, showToast, firebaseApi, logAudit }) => {
            const [launchedPayments, setLaunchedPayments] = useState([]);
            const [paidPayments, setPaidPayments] = useState([]);
            const [paidLastVisible, setPaidLastVisible] = useState(null);
            const [hasMorePaid, setHasMorePaid] = useState(true);
            const [loadingMore, setLoadingMore] = useState(false);
            const [selectedPayments, setSelectedPayments] = useState([]);
            const [deletingPayment, setDeletingPayment] = useState(null);
            const [loading, setLoading] = useState(true);
            const [statusFilter, setStatusFilter] = useState('Lançado'); // 'Lançado' ou 'Paga'

            const fetchData = useCallback(() => {
                if (!user || !brokerName) return;
                setLoading(true);
                setLaunchedPayments([]);
                setPaidPayments([]);
                setPaidLastVisible(null);
                setHasMorePaid(true);

                const { query, collection, where, getDocs, and, orderBy, limit } = firebaseApi;
                const paymentsRef = collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments');

                // Fetch ALL "Lançado" (A Pagar)
                const qLaunched = query(paymentsRef,
                    and(
                        where("corretor", "==", brokerName),
                        where("status", "==", "Lançado")
                    ),
                    orderBy("dataLancamento", "desc")
                );

                // Fetch first page of "Paga"
                const qPaid = query(paymentsRef,
                    and(
                        where("corretor", "==", brokerName),
                        where("status", "==", "Paga")
                    ),
                    orderBy("dataPagamento", "desc"),
                    limit(10)
                );

                Promise.all([getDocs(qLaunched), getDocs(qPaid)]).then(([launchedSnap, paidSnap]) => {
                    const launchedData = launchedSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setLaunchedPayments(launchedData);

                    const paidData = paidSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    const lastDoc = paidSnap.docs[paidSnap.docs.length - 1];
                    setPaidPayments(paidData);
                    setPaidLastVisible(lastDoc);
                    setHasMorePaid(!!lastDoc);

                }).catch(error => {
                    console.error("Error fetching broker wallet data:", error);
                    showToast("Erro ao carregar a carteira do corretor. Verifique o console para criar índices.", "error");
                }).finally(() => {
                    setLoading(false);
                });
            }, [user, brokerName, firebaseApi, showToast]);

            useEffect(() => {
                fetchData();
            }, [fetchData]);

            const payments = useMemo(() => {
                const list = statusFilter === 'Lançado' ? launchedPayments : paidPayments;
                return list;
            }, [statusFilter, launchedPayments, paidPayments]);

            const handlePay = async (paymentIdsToPay) => {
                if (paymentIdsToPay.length === 0) {
                    showToast("Nenhuma comissão selecionada para pagar.", "error");
                    return;
                }

                const paymentsToPay = launchedPayments.filter(p => paymentIdsToPay.includes(p.id));
                if (paymentsToPay.length !== paymentIdsToPay.length) {
                    showToast("Algumas comissões selecionadas não foram encontradas. A operação foi cancelada.", "error");
                    return;
                }
                const totalPaid = paymentsToPay.reduce((sum, p) => sum + p.valor, 0);
                try {
                    if (!user) return;
                    const paymentDate = new Date().toISOString().split('T')[0];
                    for (const paymentId of paymentIdsToPay) {
                        const docRef = firebaseApi.doc(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments', paymentId);
                        await firebaseApi.updateDoc(docRef, {
                            status: 'Paga',
                            dataPagamento: paymentDate,
                            lastModifiedBy: user.email
                        });
                    }
                    await logAudit(user, "Pagamento de Comissão", `Pagou ${formatMoney(totalPaid)} (${paymentIdsToPay.length} comissões) para ${brokerName}.`);
                    setSelectedPayments([]);
                    showToast(`${paymentIdsToPay.length} comissão(ões) foi/foram marcada(s) como 'Paga(s)'.`, "success");
                    fetchData(); // Recarrega os dados para atualizar a lista
                } catch (err) {
                    showToast("Erro ao processar o pagamento.", "error");
                }
            };

            const exportWalletBrokerPDF = async (currentUser) => {
                if (launchedPayments.length === 0 && paidPayments.length === 0) {
                    showToast("Nenhum dado para exportar.", "info");
                    return;
                }
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                const launchedTotal = launchedPayments.reduce((sum, p) => sum + p.valor, 0);
                const paidTotal = paidPayments.reduce((sum, p) => sum + p.valor, 0);

                doc.setFontSize(16);
                doc.text(`Relatório da Carteira - ${brokerName}`, 14, 22);
                doc.setFontSize(10);
                doc.setTextColor('#64748b');
                doc.text(`Exportado por: ${currentUser?.email || 'Usuário desconhecido'}`, 14, 28);
                doc.setTextColor('#000000');

                let currentY = 40;

                if (launchedPayments.length > 0) {
                    doc.setFontSize(12);
                    doc.setFont('helvetica', 'bold');
                    doc.text(`Comissões A Pagar (${formatMoney(launchedTotal)})`, 14, currentY);
                    currentY += 4;
                    doc.autoTable({
                        startY: currentY,
                        head: [['Cód. Imóvel', 'Valor', 'Data Lançamento', 'Data Captação']],
                        body: launchedPayments.map(p => [ p.codigo, formatMoney(p.valor), formatDateToBR(p.dataLancamento?.split('T')[0]), formatDateToBR(p.dataCaptacao) ]),
                        theme: 'grid',
                        headStyles: { fillColor: [37, 99, 235] },
                    });
                    currentY = doc.lastAutoTable.finalY + 15;
                }

                if (paidPayments.length > 0) {
                    if (currentY > 250) { doc.addPage(); currentY = 20; }
                    doc.setFontSize(12);
                    doc.setFont('helvetica', 'bold');
                    doc.text(`Histórico de Comissões Pagas (${formatMoney(paidTotal)})`, 14, currentY);
                    currentY += 4;
                    doc.autoTable({
                        startY: currentY,
                        head: [['Cód. Imóvel', 'Valor', 'Data Pagamento', 'Data Captação']],
                        body: paidPayments.map(p => [ p.codigo, formatMoney(p.valor), formatDateToBR(p.dataPagamento), formatDateToBR(p.dataCaptacao) ]),
                        theme: 'grid',
                        headStyles: { fillColor: [22, 163, 74] },
                    });
                }

                doc.save(`carteira_${brokerName.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0,10)}.pdf`);
                await logAudit(currentUser, "Exportação de PDF", `Relatório da Carteira do Corretor: ${brokerName}`);
                showToast("PDF do corretor gerado com sucesso!", "success");
            };

            const handleLoadMorePaid = async () => {
                if (!user || !brokerName || !paidLastVisible || !hasMorePaid) return;
                setLoadingMore(true);
                const { query, collection, where, getDocs, and, orderBy, limit, startAfter } = firebaseApi;
                const paymentsRef = collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments');

                const q = query(paymentsRef,
                    and(
                        where("corretor", "==", brokerName),
                        where("status", "==", "Paga")
                    ),
                    orderBy("dataPagamento", "desc"),
                    startAfter(paidLastVisible),
                    limit(10)
                );

                try {
                    const snapshot = await getDocs(q);
                    const newPaidData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    const lastDoc = snapshot.docs[snapshot.docs.length - 1];
                    setPaidPayments(prev => [...prev, ...newPaidData]);
                    setPaidLastVisible(lastDoc);
                    setHasMorePaid(!!lastDoc);
                } finally {
                    setLoadingMore(false);
                }
            };

            const handleSelectPayment = (paymentId) => {
                setSelectedPayments(prev =>
                    prev.includes(paymentId)
                        ? prev.filter(id => id !== paymentId)
                        : [...prev, paymentId]
                );
            };

            const totalValor = useMemo(() => 
                payments.reduce((acc, p) => acc + p.valor, 0), [payments]);

            const handleDeletePayment = async () => {
                if (!deletingPayment) return;
                try {
                    if (!user) return;
                    const docRef = firebaseApi.doc(window.db, 'artifacts', window.__app_id, 'public', 'data', 'payments', deletingPayment.id);
                    await firebaseApi.deleteDoc(docRef);
                    await logAudit(user, "Exclusão de Lançamento da Carteira", `Pagamento ID: ${deletingPayment.id}, Corretor: ${brokerName}`);
                    setDeletingPayment(null);
                    showToast("Lançamento removido da carteira.", "success");
                    fetchData(); // Re-fetch data
                } catch (err) {
                    showToast("Erro ao remover lançamento.", "error");
                }
            };
            
            return (
                <div className="max-w-5xl mx-auto slide-up">
                    <button onClick={onBack} className="flex items-center gap-2 text-slate-700 hover:text-blue-600 bg-white border border-slate-300 hover:bg-blue-50 font-semibold mb-4 transition px-4 py-2 rounded-xl shadow-sm">
                        <Icons.ArrowLeft /> Voltar para Carteiras
                    </button>
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 border-b border-slate-200 pb-6">
                            <div>
                                <h2 className="text-3xl font-black text-slate-800 flex items-center gap-3 mt-1">
                                    <Icons.User /> {brokerName}
                                </h2>
                                <p className="text-slate-500 font-medium mt-2">
                                    {statusFilter === 'Lançado' ? 'Total a Pagar: ' : 'Total Pago (Carregado): '}
                                    <span className="font-bold text-green-600">{formatMoney(totalValor)}</span>
                                </p>
                            </div>
                            <div className="flex flex-col sm:flex-row gap-2 items-center">
                                {selectedPayments.length > 0 && statusFilter === 'Lançado' && (
                                    <div className="flex gap-2">
                                        <button onClick={() => handlePay(selectedPayments)} className="w-full sm:w-auto flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-5 rounded-xl shadow-sm transition mt-4 sm:mt-0">
                                            <Icons.CheckCircle /> Pagar Selecionados ({selectedPayments.length})
                                        </button>
                                    </div>
                                )}
                                <button onClick={() => exportWalletBrokerPDF(user)} className="flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm transition">
                                    <Icons.FileText /> Exportar PDF
                                </button>
                            </div>
                        </div>
                        <div className="flex justify-between items-center mb-6">
                            <div className="flex border-b border-slate-200">
                                <button onClick={() => { setStatusFilter('Lançado'); setSelectedPayments([]); }} className={`px-4 py-3 font-semibold transition-colors duration-200 ${statusFilter === 'Lançado' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-slate-500 hover:text-slate-800'}`}>
                                    A Pagar
                                </button>
                                <button onClick={() => { setStatusFilter('Paga'); setSelectedPayments([]); }} className={`px-4 py-3 font-semibold transition-colors duration-200 ${statusFilter === 'Paga' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-slate-500 hover:text-slate-800'}`}>
                                    Histórico de Pagas
                                </button>
                            </div>
                        </div>

                        {loading ? <p>Carregando...</p> : payments.length === 0 ? (
                            <div className="text-center py-12 text-slate-500 bg-slate-50 rounded-xl border border-dashed border-slate-200">
                                {statusFilter === 'Lançado' ? 'Nenhuma comissão a pagar para este corretor no período.' : 'Nenhuma comissão paga para este corretor no período.'}
                            </div>
                        ) : (
                            <div className="overflow-x-auto border border-slate-200 rounded-xl">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm">
                                            {statusFilter === 'Lançado' && <th className="py-4 px-5 font-bold"><input type="checkbox" onChange={() => selectedPayments.length === payments.length ? setSelectedPayments([]) : setSelectedPayments(payments.map(p => p.id))} checked={selectedPayments.length === payments.length && payments.length > 0} /></th>}
                                            <th className="py-4 px-5 font-bold">Cód. Imóvel</th>
                                            <th className="py-4 px-5 font-bold">Valor</th>
                                            <th className="py-4 px-5 font-bold">{statusFilter === 'Lançado' ? 'Data Lançamento' : 'Data Pagamento'}</th>
                                            <th className="py-4 px-5 font-bold">Data Captação</th>
                                            {statusFilter === 'Lançado' && <th className="py-4 px-5 font-bold text-right">Ação</th>}
                                        </tr>
                                    </thead>
                                    <tbody className="text-sm">
                                        {payments.map(p => {
                                            const valuePerBroker = (p.todosCorretores?.length || 1) > 1 ? p.valor / p.todosCorretores.length : p.valor;
                                            return (
                                                <tr key={p.id} className="border-b border-slate-100 hover:bg-blue-50/30 transition last:border-0">
                                                    {statusFilter === 'Lançado' && <td className="py-4 px-5"><input type="checkbox" onChange={() => handleSelectPayment(p.id)} checked={selectedPayments.includes(p.id)} /></td>}
                                                    <td className="py-4 px-5 font-bold text-slate-800">{p.codigo}</td>
                                                    <td className="py-4 px-5 font-semibold text-green-700">{formatMoney(p.valor)}</td>
                                                    <td className="py-4 px-5 text-slate-500">{statusFilter === 'Lançado' ? formatDateToBR(p.dataLancamento?.split('T')[0]) : formatDateToBR(p.dataPagamento)}</td>
                                                    <td className="py-4 px-5 text-slate-500">{formatDateToBR(p.dataCaptacao)}</td>
                                                    {statusFilter === 'Lançado' && (
                                                        <td className="py-4 px-5 text-right">
                                                            <div className="flex items-center justify-end gap-2">
                                                                <button onClick={() => handlePay([p.id])} className="text-xs font-bold px-3 py-1.5 rounded-lg transition border shadow-sm bg-green-50 text-green-600 border-green-200 hover:bg-green-600 hover:text-white">
                                                                    Pagar
                                                                </button>
                                                                <button 
                                                                    onClick={() => setDeletingPayment(p)}
                                                                    className="text-slate-400 hover:text-red-600 p-1.5 hover:bg-red-50 rounded-lg transition"
                                                                    title="Remover da Carteira"
                                                                >
                                                                    <Icons.Trash />
                                                                </button>
                                                            </div>
                                                        </td>
                                                    )}
                                                </tr>
                                            ); 
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        )}
                        
                        {statusFilter === 'Paga' && hasMorePaid && !loading && (
                            <div className="text-center mt-6">
                                <button onClick={handleLoadMorePaid} disabled={loadingMore} className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-6 rounded-lg transition border border-slate-200 disabled:opacity-50">
                                    {loadingMore ? 'Carregando...' : 'Carregar Mais Pagas'}
                                </button>
                            </div>
                        )}

                        <ConfirmModal
                            isOpen={!!deletingPayment}
                            title="Remover Lançamento da Carteira"
                            message={`Deseja remover a comissão de ${formatMoney(deletingPayment?.valor)} para o imóvel ${deletingPayment?.codigo}? Esta ação irá apagar o registro de pagamento permanentemente.`}
                            btnConfirm="Sim, Remover"
                            btnCancel="Cancelar"
                            type="danger"
                            onConfirm={handleDeletePayment}
                            onCancel={() => setDeletingPayment(null)}
                        />
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [brokers, setBrokers] = useState([]);
            const [userProfile, setUserProfile] = useState(null);
            const [isAdminMenuOpen, setIsAdminMenuOpen] = useState(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const adminMenuRef = useRef(null);
            const mobileMenuRef = useRef(null);
            const [toasts, setToasts] = useState([]);
            const [readCount, setReadCount] = useState(0);
            const [writeCount, setWriteCount] = useState(0);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (adminMenuRef.current && !adminMenuRef.current.contains(event.target)) {
                        setIsAdminMenuOpen(false);
                    }
                    if (mobileMenuRef.current && !mobileMenuRef.current.contains(event.target)) {
                        setIsMobileMenuOpen(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, [adminMenuRef, mobileMenuRef]);
            
            const showToast = useCallback((message, type = 'info') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 4000);
            }, []);

            const firebaseApi = useMemo(() => {
                const incrementRead = (count = 1) => setReadCount(c => c + count);
                const incrementWrite = () => setWriteCount(w => w + 1);
                return {
                    getDocs: async (...args) => { const result = await window.getDocs(...args); incrementRead(result.docs.length || 1); return result; },
                    getDoc: async (...args) => { const result = await window.getDoc(...args); incrementRead(); return result; },
                    addDoc: async (...args) => { const result = await window.addDoc(...args); incrementWrite(); return result; },
                    updateDoc: async (...args) => { const result = await window.updateDoc(...args); incrementWrite(); return result; },
                    deleteDoc: async (...args) => { const result = await window.deleteDoc(...args); incrementWrite(); return result; },
                    onSnapshot: (query, onNext, onError) => {
                        const newOnNext = (snapshot) => { incrementRead(snapshot.docs.length || 1); onNext(snapshot); };
                        return window.onSnapshot(query, newOnNext, onError);
                    },
                    doc: window.doc, collection: window.collection, query: window.query, where: window.where,
                    or: window.or, orderBy: window.orderBy, and: window.and, limit: window.limit, startAfter: window.startAfter,
                };
            }, [setReadCount, setWriteCount]);

            useEffect(() => {
                const handlePageShow = (event) => { if (event.persisted) { setReadCount(0); setWriteCount(0); } };
                window.addEventListener('pageshow', handlePageShow);
                return () => window.removeEventListener('pageshow', handlePageShow);
            }, []);

            const handleLogout = async () => {
                try {
                    if (window.auth && window.signOut) {
                        await window.signOut(window.auth);
                        showToast("Sessão encerrada com sucesso.", "success"); 
                        setTimeout(() => { window.location.href = 'login.html'; }, 1000);
                    }
                } catch (e) {
                    showToast("Erro ao encerrar a sessão.", "error");
                }
            };

            useEffect(() => {
                let inactivityTimer;
                const logoutDueToInactivity = async () => {
                    if (window.auth && window.signOut) {
                        try { await window.signOut(window.auth); showToast("Sessão encerrada por inatividade (10 min).", "error"); } 
                        catch (e) { window.location.href = 'login.html'; }
                    }
                };
                const resetTimer = () => { clearTimeout(inactivityTimer); inactivityTimer = setTimeout(logoutDueToInactivity, 10 * 60 * 1000); };
                const events = ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'];
                events.forEach(event => window.addEventListener(event, resetTimer));
                resetTimer();
                return () => { clearTimeout(inactivityTimer); events.forEach(event => window.removeEventListener(event, resetTimer)); };
            }, [showToast]);

            useEffect(() => {
                const unsubscribeAuth = window.onAuthStateChanged(window.auth, async (currentUser) => {
                    if (user?.uid !== currentUser?.uid) { setReadCount(0); setWriteCount(0); setUserProfile(null); }
                    setUser(currentUser);
                    if (currentUser) {
                        const brokersRef = firebaseApi.collection(window.db, 'artifacts', window.__app_id, 'public', 'data', 'brokers');
                        const qBrokers = firebaseApi.query(brokersRef);
                        const unsubscribeBrokers = firebaseApi.onSnapshot(qBrokers, (snapshot) => {
                            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            data.sort((a, b) => a.name.localeCompare(b.name));
                            setBrokers(data);
                            if (authLoading) setAuthLoading(false);
                        }, (error) => {
                            console.error("Error fetching brokers:", error);
                            showToast("Erro ao carregar a lista de corretores.", "error");
                            setAuthLoading(false);
                        });
                        return () => unsubscribeBrokers();
                    } else {
                        setBrokers([]); setUserProfile(null); setAuthLoading(false); window.location.href = 'login.html';
                    }
                });
                return () => unsubscribeAuth();
            }, [firebaseApi, showToast, authLoading]);

            const navigate = (page) => { window.location.href = page; };

            if (authLoading) {
                return ( 
                    <div className="h-screen flex flex-col items-center justify-center">
                        <div className="w-16 h-16 border-4 border-white/30 border-t-white rounded-full animate-spin mb-6"></div>
                        <div className="text-white/90 text-lg font-medium animate-pulse">Conectando ao sistema...</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col">
                    <ToastContainer toasts={toasts} />
                    
                    <header className="bg-white/85 backdrop-blur-md shadow-sm border-b border-slate-200 sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6">
                            <div className="flex justify-between items-center h-16">
                                <div className="flex items-center gap-2 cursor-pointer" onClick={() => navigate('dashboard.html')}>
                                    <div className="bg-blue-600 text-white p-1.5 rounded-lg shadow-sm"><Icons.Home /></div>
                                    <h1 className="text-xl font-black text-slate-800 tracking-tight">Capta<span className="text-blue-600">Pro</span></h1>
                                </div>
                                <div className="flex items-center gap-3">
                                    <div className="sm:hidden relative" ref={mobileMenuRef}>
                                        <button onClick={() => setIsMobileMenuOpen(prev => !prev)} className="p-2 rounded-md text-slate-500 hover:text-slate-800 hover:bg-slate-100"><Icons.Menu /></button>
                                    </div>
                                    <div className="hidden sm:flex items-center space-x-1">
                                        <NavButton icon={<Icons.FileText />} label="Captações" onClick={() => navigate('captacoes.html')} />
                                        <NavButton icon={<Icons.DollarSign />} label="Lançamentos" onClick={() => navigate('financeiro.html')} />
                                        <NavButton icon={<svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z" /><path fillRule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clipRule="evenodd" /></svg>} label="Carteira" active={true} />
                                        <NavButton icon={<Icons.LogOut />} label="Sair" onClick={handleLogout} danger />
                                    </div>
                                </div>
                            </div>
                        </div>
                        {isMobileMenuOpen && (
                            <div className="sm:hidden absolute top-16 left-0 w-full bg-white shadow-lg border-t border-slate-200 p-4 z-[60]"> 
                                <div className="flex flex-col gap-2">
                                    <a onClick={handleLogout} className="flex items-center gap-3 p-3 rounded-lg text-red-600 font-semibold hover:bg-red-50 cursor-pointer"><Icons.LogOut /><span>Sair</span></a>
                                </div>
                            </div>
                        )}
                    </header>

                    <nav className="sm:hidden fixed bottom-0 w-full bg-white border-t border-slate-200 z-40 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        <div className="flex justify-around items-center h-16 px-1">
                            <MobileNavButton icon={<Icons.FileText />} label="Captações" onClick={() => navigate('captacoes.html')} />
                            <MobileNavButton icon={<Icons.DollarSign />} label="Lançar" onClick={() => navigate('financeiro.html')} />
                            <MobileNavButton icon={<svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z" /><path fillRule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clipRule="evenodd" /></svg>} label="Carteira" active={true} />
                        </div>
                    </nav>
 
                    <main className="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 pt-4 sm:pt-6 pb-28 sm:pb-20 overflow-x-hidden">
                        <Carteira isLoaded={!authLoading} user={user} brokers={brokers} showToast={showToast} firebaseApi={firebaseApi} logAudit={logAudit} navigate={navigate} />
                    </main>

                    <footer className="fixed bottom-0 left-0 right-0 z-30 bg-white/90 backdrop-blur-sm border-t border-slate-200 py-2 px-4 text-center text-slate-500 text-xs">
                        <div className="max-w-7xl mx-auto flex flex-wrap justify-center items-center gap-x-4 gap-y-1">
                            <div className="flex items-center gap-1.5 text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-0.5 rounded-full border border-slate-200">
                                <span className={`w-2 h-2 rounded-full ${user ? 'bg-green-500' : 'bg-red-500'}`}></span>
                                {user ? 'Online' : 'Offline'}
                            </div>
                            {user && <p className="font-semibold text-slate-500">Logado como: {user.email}</p>}
                            <p>CaptaPro - 5.5 beta  - Criado por Guilherme Montoani</p>
                            <div className="flex items-center gap-x-3 font-mono">
                                <span title="Leituras do Banco de Dados"><svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3 inline -mt-0.5" viewBox="0 0 20 20" fill="currentColor"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z" /><path fillRule="evenodd" d="M.458 10C3.732 4.943 9.522 3 10 3s6.268 1.943 9.542 7c-3.274 5.057-9.064 7-9.542 7S3.732 15.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clipRule="evenodd" /></svg>{readCount}</span>
                                <span title="Escritas no Banco de Dados"><svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3 inline -mt-0.5" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg>{writeCount}</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const NavButton = ({ icon, label, active, onClick, danger }) => {
            if (danger) {
                return <button onClick={onClick} className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold text-red-600 hover:bg-red-50 hover:text-red-700 transition" title="Sair do Sistema">{icon} {label && <span>{label}</span>}</button>;
            }
            return <button onClick={onClick} className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold transition ${active ? 'bg-slate-100 text-blue-700' : 'text-slate-500 hover:bg-slate-100 hover:text-slate-900'}`}>{icon} <span>{label}</span></button>;
        }

        const MobileNavButton = ({ icon, label, active, onClick }) => {
            return <button onClick={onClick} className={`flex flex-col items-center justify-center w-full h-full space-y-1 transition ${active ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>{React.cloneElement(icon, { className: "h-6 w-6"})}<span className="text-[10px] font-bold">{label}</span></button>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
